<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Latihan PSAS Ganjil – Informatika XII – Versi 1</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1f2937;--mut:#64748b;--line:#d9dee5;--pri:#0f766e;--pri2:#115e59;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--part:#b45309;--partbg:#fef3c7;--sel:#e0f2fe;--selb:#0284c7;--code:#0f172a;--codebg:#f1f5f9}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--ink:#e2e8f0;--mut:#94a3b8;--line:#334155;--pri:#2dd4bf;--pri2:#5eead4;--ok:#86efac;--okbg:#14532d;--bad:#fca5a5;--badbg:#7f1d1d;--part:#fcd34d;--partbg:#78350f;--sel:#0c4a6e;--selb:#38bdf8;--code:#e2e8f0;--codebg:#0b1220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:12px}
header.top{background:var(--pri);color:#fff;padding:12px 16px;border-radius:10px;margin-bottom:12px}
header.top h1{margin:0;font-size:18px}
header.top small{opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:bold;margin:10px 0 4px}
input[type=text],input[type=number],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:var(--card);color:var(--ink)}
button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:8px;border:1px solid var(--line);padding:9px 14px;background:var(--card);color:var(--ink)}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.pri:hover{background:var(--pri2)}
button:disabled{opacity:.5;cursor:not-allowed}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.timer{font-weight:bold;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin:8px 0}
.grid button{padding:6px 0;font-size:13px;position:relative}
.grid button.done{background:var(--sel);border-color:var(--selb)}
.grid button.cur{outline:2px solid var(--pri);font-weight:bold}
.grid button.flag::after{content:"⚑";position:absolute;top:-6px;right:-2px;font-size:11px;color:var(--bad)}
.grid button.ok{background:var(--okbg);border-color:var(--ok)}
.grid button.bad{background:var(--badbg);border-color:var(--bad)}
.grid button.part{background:var(--partbg);border-color:var(--part)}
.badge{display:inline-block;font-size:11px;font-weight:bold;padding:2px 8px;border-radius:99px;margin-right:4px;color:#fff;vertical-align:middle}
.b-lit{background:#2563eb}.b-num{background:#ea580c}.b-lv{background:#64748b}.b-bt{background:#7c3aed}
.qhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.qno{font-size:20px;font-weight:bold;color:var(--pri)}
.instr{font-size:13px;color:var(--mut);margin:0 0 8px;font-style:italic}
.q{font-weight:bold;margin:10px 0}
table.t{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:#ededed;color:#111}
@media (prefers-color-scheme:dark){table.t th{background:#334155;color:#e2e8f0}}
.tw{overflow-x:auto}
pre{background:var(--codebg);color:var(--code);padding:10px;border-radius:8px;overflow-x:auto;font-size:13px;line-height:1.4;margin:8px 0;border:1px solid var(--line)}
code{font-family:Consolas,Menlo,monospace}
.box{border:1px solid var(--line);border-left:5px solid var(--pri);background:var(--codebg);border-radius:6px;padding:8px 12px;margin:8px 0;font-size:14px}
.boxt{font-weight:bold;color:var(--pri);margin-bottom:4px}
.chat{background:var(--codebg);border-radius:10px;padding:8px;margin:8px 0}
.chat .ct{font-weight:bold;color:var(--pri);padding:4px 8px}
.msg{background:var(--card);border-radius:10px;padding:6px 10px;margin:6px 0;max-width:92%;border:1px solid var(--line)}
.msg.dev{margin-left:auto;background:#dcfce7;color:#14532d}
.msg b{display:block;font-size:12px;color:var(--pri)}
.msg.dev b{color:#166534}
.fig{margin:10px 0;text-align:center}
.fig svg{background:#fff;border-radius:8px;border:1px solid var(--line)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--selb)}
.opt.sel{background:var(--sel);border-color:var(--selb)}
.opt .l{font-weight:bold;min-width:22px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;flex-wrap:wrap}
.row .txt{flex:1 1 260px}
.row select{width:auto;min-width:120px}
.bsb{display:flex;gap:6px}
.bsb button.on{background:var(--sel);border-color:var(--selb);font-weight:bold}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap}
.status{display:inline-block;font-weight:bold;padding:3px 10px;border-radius:99px;font-size:13px}
.s-ok{background:var(--okbg);color:var(--ok)}.s-bad{background:var(--badbg);color:var(--bad)}.s-part{background:var(--partbg);color:var(--part)}.s-kos{background:var(--line);color:var(--mut)}
.score{font-size:44px;font-weight:bold;color:var(--pri);line-height:1}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.kv div{background:var(--codebg);border-radius:8px;padding:8px;text-align:center}
.kv b{display:block;font-size:20px}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--pri)}
textarea{width:100%;height:80px;font-family:Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card);color:var(--ink)}
.small{font-size:13px;color:var(--mut)}
.warn{background:var(--partbg);color:var(--part);border-radius:8px;padding:8px 12px;font-size:14px}

/* --- proteksi & tampilan HP --- */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
body.noprint .wrap{display:none}
.bar{gap:8px}
.bar button{padding:7px 10px;font-size:14px}
.opt{min-height:46px;padding:12px}
.opt.ro{cursor:default;opacity:.85}
.opt.ro:hover{border-color:var(--line)}
.opt.ro.sel{opacity:1}
.fig svg{max-width:100%;height:auto}
.fb{margin-top:12px}
.fbmsg{border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:15px;font-weight:normal}
button.cek{width:100%;padding:12px;font-size:16px}
.nav.sticky{position:sticky;bottom:0;z-index:5;background:var(--bg);padding:8px 0 calc(8px + env(safe-area-inset-bottom));margin-top:4px}
.nav.sticky button{flex:1;padding:12px 6px}
button.flagon{background:var(--badbg);border-color:var(--bad);color:var(--bad);font-weight:bold}
.gridcard{padding:8px 12px}
.legend{margin:4px 0 0}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin:0 3px 0 8px}
.lg.done{background:var(--sel);border-color:var(--selb)}.lg.ok{background:var(--okbg);border-color:var(--ok)}.lg.part{background:var(--partbg);border-color:var(--part)}.lg.bad{background:var(--badbg);border-color:var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btnrow button{flex:1 1 140px}
.big{width:100%;padding:14px;font-size:17px;margin-top:8px}
a.btn{display:block;text-align:center;text-decoration:none;border-radius:8px;box-sizing:border-box}
a.btn.pri{background:var(--pri);color:#fff}
.emailcard{border:2px solid var(--pri)}
.hasil{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.msg-err{color:var(--bad);font-size:14px;min-height:1em}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .mbox{background:var(--card);color:var(--ink);border-radius:12px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
#modal .mbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#modal .mbtn button{flex:1;padding:12px}
#modal textarea{height:200px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:.92}
@media (max-width:600px){
 body{font-size:15px}
 .wrap{padding:8px}
 header.top{padding:10px 12px}
 header.top h1{font-size:15px}
 header.top small{font-size:12px}
 .card{padding:12px;border-radius:8px}
 .bar{padding:6px 8px;font-size:14px}
 .bar .timer{flex:1 1 100%;text-align:center}
 .bar span{flex:1}
 .qno{font-size:17px}
 table.t{font-size:13px}
 table.t th,table.t td{padding:5px 6px}
 .row .txt{flex:1 1 100%}
 .row select{width:100%;padding:10px}
 .bsb{width:100%}
 .bsb button{flex:1;padding:10px}
 .score{font-size:40px}
 .kv{grid-template-columns:repeat(4,1fr);gap:5px}
 .kv div{padding:6px 2px;font-size:12px}
 .gcol{display:none}
 pre{font-size:12px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(36px,1fr))}
 .grid button{padding:8px 0}
}
@media print{.bar,.nav,button,.emailcard{display:none}}
.pembcard{border:2px solid #7c3aed}
.pembbox{margin-top:10px;background:var(--codebg);border-left:4px solid #7c3aed;border-radius:8px;padding:10px 12px;font-size:15px}
.pembbox div+div{margin-top:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.pembtxt{line-height:1.6}
.pembtxt b{color:var(--ink)}
</style>
</head>

n dengan perubahan aturan di lingkungannya"]}, {"no": 3, "tp": "TP 4.5 (Konsep AI)", "materi": "Kemampuan AI dalam layanan digital", "level": "C2", "kat": "LOTS", "la": "Literasi", "type": "pg", "maks": 1, "stim": [["p", "Sebuah toko batik daring di Bandung menyediakan fitur “cari dengan foto”. Pembeli memotret kain batik yang disukainya, lalu dalam beberapa detik aplikasi menampilkan produk dengan motif yang mirip, walaupun pembeli tidak mengetik nama motifnya."]], "q": "Teknologi yang paling tepat menjelaskan kemampuan aplikasi mengenali kemiripan motif tersebut adalah …", "opts": ["Internet of Things, karena kamera ponsel merupakan perangkat yang terhubung ke internet", "kecerdasan artifisial (visi komputer), karena sistem mengenali pola gambar dari data", "cloud computing, karena foto pembeli dikirim dan disimpan di server daring", "big data, karena toko menyimpan data ribuan transaksi pembeli setiap bulan", "pemindai kode batang, karena label harga pada kain dibaca untuk mencari produk"]}, {"no": 4, "tp": "TP 4.2.2", "materi": "Kesalahan logika off-by-one", "level": "C3", "kat": "MOTS", "la": "-", "type": "pg", "maks": 1, "stim": [["p", "Berikut rancangan Pemantau Suhu Rumah Kaca. Desk-check dengan daftar_suhu = [30, 34, 35], n = 3, dan ambang = 33 menghasilkan \"NORMAL\", padahal rata-rata seharusnya 33 sehingga hasil harapannya \"PANAS\"."], ["code", "1  FUNGSI cek_suhu(daftar_suhu, n, ambang)\n2    jumlah ← 0\n3    UNTUK i DARI 2 SAMPAI n LAKUKAN\n4      jumlah ← jumlah + daftar_suhu[i]\n5    AKHIR UNTUK\n6    rata ← jumlah / n\n7    JIKA rata ≥ ambang MAKA\n8      KEMBALIKAN \"PANAS\"\n9    SELAIN ITU\n10     KEMBALIKAN \"NORMAL\"\n11   AKHIR JIKA\n12 AKHIR FUNGSI"]], "q": "Baris penyebab hasil keliru beserta perbaikannya adalah …", "opts": ["baris 3, perulangan harus dimulai DARI 1 agar data pertama ikut dijumlahkan", "baris 6, rata dibagi n − 1 karena data yang dijumlahkan hanya n − 1 buah", "baris 7, tanda ≥ diganti > agar rata-rata 33 dianggap \"NORMAL\"", "baris 2, nilai awal jumlah diubah menjadi 1 agar hasilnya tidak nol", "baris 4, penjumlahan memakai daftar_suhu[i + 1] agar data terakhir terbaca"]}, {"no": 5, "tp": "TP 4.2.2", "materi": "Desk-check dengan tabel jejak", "level": "C3", "kat": "MOTS", "la": "Numerasi", "type": "pg", "maks": 1, "stim": [["p", "Algoritma berikut menghitung banyak data sensor yang melewati ambang."], ["code", "hitung ← 0\nUNTUK i DARI 1 SAMPAI 5 LAKUKAN\n  JIKA data[i] > ambang MAKA\n    hitung ← hitung + 1\n  AKHIR JIKA\nAKHIR UNTUK\nTULIS hitung"], ["p", "Desk-check dilakukan dengan data = [62, 75, 75, 48, 80] dan ambang = 75."]], "q": "Keluaran algoritma berdasarkan tabel jejak adalah …", "opts": ["0", "1", "2", "3", "5"]}, {"no": 6, "tp": "TP 4.2.2", "materi": "Flowchart percabangan", "level": "C3", "kat": "MOTS", "la": "-", "type": "pg", "maks": 1, "stim": [["p", "Pengukur suhu tubuh di gerbang sekolah memakai aturan: suhu ≥ 37,5 °C → \"PERIKSA\" (diarahkan ke UKS); selain itu → \"MASUK\". Perhatikan flowchart yang dibuat sebuah kelompok."], ["img", "v1_fc6", "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 470' width='100%' style='max-width:600px' role='img' font-family='Arial,Helvetica,sans-serif'><defs><marker id='a6' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2937'/></marker></defs><rect x='85.0' y='20' width='130' height='40' rx='20' fill='#e8f0fe' stroke='#1f2937' stroke-width='2'/><text x='150' y='45' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>Mulai</text><line x1='150' y1='60' x2='150' y2='88' stroke='#1f2937' stroke-width='2' marker-end='url(#a6)'/><polygon points='53.0,90 283.0,90 247.0,134 17.0,134' fill='#fef9c3' stroke='#1f2937' stroke-width='2'/><text x='150' y='117' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>Masukkan suhu</text><line x1='150' y1='134' x2='150' y2='165' stroke='#1f2937' stroke-width='2' marker-end='url(#a6)'/><polygon points='150,167.0 250.0,212 150,257.0 50.0,212' fill='#fee2e2' stroke='#1f2937' stroke-width='2'/><text x='150' y='217' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>suhu ≥ 37,5 ?</text><line x1='250' y1='212' x2='320' y2='212' stroke='#1f2937' stroke-width='2' marker-end='url(#a6)'/><text x='285' y='202' font-size='14' text-anchor='middle' font-weight='bold' fill='#15803d'>Ya</text><polygon points='348.0,190 568.0,190 532.0,234 312.0,234' fill='#fef9c3' stroke='#1f2937' stroke-width='2'/><text x='440' y='217' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>Tampilkan &quot;MASUK&quot;</text><line x1='150' y1='257' x2='150' y2='300' stroke='#1f2937' stroke-width='2' marker-end='url(#a6)'/><text x='172' y='285' font-size='14' text-anchor='start' font-weight='bold' fill='#b91c1c'>Tidak</text><polygon points='58.0,302 278.0,302 242.0,346 22.0,346' fill='#fef9c3' stroke='#1f2937' stroke-width='2'/><text x='150' y='329' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>Tampilkan &quot;PERIKSA&quot;</text><line x1='150' y1='346' x2='150' y2='380' stroke='#1f2937' stroke-width='2' marker-end='url(#a6)'/><rect x='85.0' y='380' width='130' height='40' rx='20' fill='#e8f0fe' stroke='#1f2937' stroke-width='2'/><text x='150' y='405' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>Selesai</text><polyline points='440,234 440,400 217,400' fill='none' stroke='#1f2937' stroke-width='2' marker-end='url(#a6)'/><text x='300' y='455' font-size='14' text-anchor='middle' font-weight='bold' fill='#1d4ed8'>Aturan: suhu ≥ 37,5 → &quot;PERIKSA&quot;; selain itu &quot;MASUK&quot;</text></svg>"]], "q": "Saat desk-check dengan suhu = 38, keluaran flowchart dan kesimpulan yang tepat adalah …", "opts": ["\"PERIKSA\"; flowchart sudah sesuai dengan aturan pengukur suhu", "\"MASUK\"; flowchart sudah sesuai karena 38 lebih dari 37,5", "\"PERIKSA\"; flowchart keliru karena kondisi harus suhu > 37,5", "\"MASUK\"; flowchart keliru karena isi cabang Ya dan Tidak tertukar", "tidak ada keluaran karena suhu 38 tidak memenuhi kedua cabang"]}, {"no": 7, "tp": "TP 4.5 (Konsep AI)", "materi": "Peran data dalam machine learning", "level": "C3", "kat": "MOTS", "la": "Numerasi", "type": "pg", "maks": 1, "stim": [["p", "Sebuah kelompok melatih model pengenal daun tanaman obat (sehat, berbintik, kering) dengan Teachable Machine. Model diuji dengan 25 gambar baru yang sama pada setiap percobaan."], ["table", ["Percobaan", "Data latih per kelas", "Jawaban benar dari 25 uji"], [["1", "10 gambar", "14"], ["2", "25 gambar", "19"], ["3", "50 gambar", "21"]], null], ["p", "Data ilustrasi."]], "q": "Kesimpulan yang paling tepat tentang peran data berdasarkan tabel tersebut adalah …", "opts": ["model pasti selalu benar bila dilatih dengan 50 gambar per kelas karena akurasinya tertinggi", "banyak data latih tidak berpengaruh karena model AI bekerja dengan aturan yang ditulis pemrogram", "data latih membantu model mengenali pola; akurasi naik dari 56% ke 84%, tetapi belum 100%", "akurasi naik dua kali lipat ketika data latih per kelas ditambah dari 10 menjadi 50 gambar", "penambahan dari 25 ke 50 gambar menaikkan akurasi lebih besar daripada dari 10 ke 25 gambar"]}, {"no": 8, "tp": "TP 4.2.3", "materi": "Eksperimen jabat tangan", "level": "C3", "kat": "MOTS", "la": "Numerasi", "type": "pg", "maks": 1, "stim": [["p", "Pada Eksperimen Jabat Tangan, tiga kelompok digabung sehingga ada n = 15 murid. Cara A: setiap murid berjabat tangan dengan semua murid lain tepat satu kali. Cara B: setiap murid selain ketua hanya menyalami ketua."]], "q": "Banyak jabat tangan pada Cara A dan Cara B berturut-turut adalah …", "opts": ["105 dan 15", "120 dan 14", "210 dan 14", "105 dan 14", "225 dan 15"]}, {"no": 9, "tp": "TP 4.5 (IoT/Robotika)", "materi": "Konversi nilai sensor analog", "level": "C3", "kat": "MOTS", "la": "Numerasi", "type": "pg", "maks": 1, "stim": [["p", "Sebuah potensiometer terhubung ke pin analog Arduino UNO yang membaca nilai 0–1023. Tegangan dihitung dengan rumus berikut."], ["box", "Rumus", "tegangan = (nilai ÷ 1023) × 5 volt"], ["p", "Saat kenop diputar, Arduino membaca nilai 614."]], "q": "Tegangan yang terbaca (dibulatkan satu desimal) adalah …", "opts": ["0,6 volt", "2,0 volt", "3,0 volt", "4,1 volt", "6,1 volt"]}, {"no": 10, "tp": "TP 4.2.3", "materi": "Penyempurnaan perfektif v1.1 → v1.2", "level": "C4", "kat": "HOTS", "la": "Numerasi", "type": "pg", "maks": 1, "stim": [["p", "Sensor suhu rumah kaca mengirim 1 data setiap 15 menit selama 10 jam, jadi ada n = 40 data per hari. Setiap kali data baru datang, sistem menampilkan rata-rata kumulatif."], ["table", ["Versi", "Cara menghitung jumlah setiap kali data baru datang"], [["v1.1", "menjumlah ulang dari data pertama sampai data terbaru (1 + 2 + … + n penjumlahan)"], ["v1.2", "menyimpan jumlah berjalan, lalu cukup menambahkan data terbaru (1 penjumlahan per data)"]], null]], "q": "Kesimpulan yang tepat tentang kedua versi untuk data satu hari adalah …", "opts": ["kedua versi sama efisien karena keluaran rata-rata kumulatifnya sama persis", "v1.2 lebih efisien: 40 penjumlahan dibanding 820 pada v1.1, dengan keluaran yang sama", "v1.2 lebih efisien: 40 penjumlahan dibanding 1.600 pada v1.1, dengan keluaran yang sama", "v1.1 lebih efisien karena menjumlah ulang dari data pertama sehingga hasilnya lebih teliti", "v1.2 lebih efisien karena barisnya lebih sedikit, walaupun keluaran rekapnya berbeda"]}, {"no": 11, "tp": "TP 4.2.4", "materi": "Memilih strategi algoritmik", "level": "C3", "kat": "MOTS", "la": "-", "type": "pg", "maks": 1, "stim": [["p", "Kartu Permintaan Klien (Tema UMKM): “Kasir warung ingin aplikasi menghitung kembalian dengan jumlah lembar dan koin sesedikit mungkin, memakai pecahan rupiah yang umum.”"]], "q": "Strategi algoritmik yang paling tepat untuk fitur tersebut adalah …", "opts": ["pencarian biner, karena daftar pecahan rupiah sudah terurut dari kecil ke besar", "brute force, karena semua kombinasi pecahan harus dicoba agar hasilnya pasti benar", "merge sort, karena pecahan uang harus dibagi dua lalu digabungkan kembali", "pencarian beruntun, karena setiap pecahan diperiksa satu per satu dari yang terkecil", "greedy, karena setiap langkah memilih pecahan terbesar yang masih muat dalam sisa kembalian"]}, {"no": 12, "tp": "TP 4.2.4", "materi": "Langkah pencarian biner", "level": "C3", "kat": "MOTS", "la": "Numerasi", "type": "pg", "maks": 1, "stim": [["p", "Kartu Permintaan Klien (Tema Pendidikan): guru ingin mencari data seorang murid dengan cepat dari 500 NIS yang sudah terurut. Kelompok memilih pencarian biner."]], "q": "Paling banyak berapa kali NIS diperiksa sampai data ditemukan atau dipastikan tidak ada?", "opts": ["8 kali", "9 kali", "10 kali", "250 kali", "500 kali"]}, {"no": 13, "tp": "TP 4.2.4", "materi": "Analisis kegagalan uji regresi", "level": "C4", "kat": "HOTS", "la": "-", "type": "pg", "maks": 1, "stim": [["p", "Fitur baru Katalog Perpustakaan v2.0 mencari buku berdasarkan nomor panggil memakai pencarian biner. Daftar nomor[1..n] sudah terurut."], ["code", "kiri ← 2\nkanan ← n\nSELAMA kiri ≤ kanan LAKUKAN\n  tengah ← (kiri + kanan) DIV 2\n  JIKA nomor[tengah] = dicari MAKA KEMBALIKAN tengah\n  JIKA nomor[tengah] < dicari MAKA kiri ← tengah + 1\n  SELAIN ITU kanan ← tengah − 1\nAKHIR SELAMA\nKEMBALIKAN \"tidak ditemukan\""], ["p", "Pada uji regresi, empat kasus lulus, tetapi kasus “buku pertama dalam daftar” menghasilkan \"tidak ditemukan\"."]], "q": "Penyebab kegagalan uji regresi tersebut adalah …", "opts": ["nilai awal kiri seharusnya 1 agar buku pertama masuk rentang pencarian", "daftar nomor belum terurut sehingga pencarian biner tidak dapat dipakai", "kondisi perulangan harus kiri < kanan agar pencarian berhenti lebih cepat", "perhitungan tengah harus memakai pembagian biasa agar indeksnya tepat", "pencarian biner tidak cocok untuk buku sehingga harus diganti strategi greedy"]}, {"no": 14, "tp": "TP 4.5 (IoT/Robotika)", "materi": "Menentukan ambang cahaya", "level": "C3", "kat": "MOTS", "la": "Numerasi", "type": "pg", "maks": 1, "stim": [["p", "Sebuah kelompok membaca nilai sensor kelembapan tanah pada tiga kondisi (semakin kering, semakin besar nilainya)."], ["table", ["Kondisi tanah", "Kering", "Lembap", "Basah"], [["Nilai sensor", "850", "520", "260"]], null], ["p", "Pompa harus menyala ketika tanah kering dan padam ketika tanah lembap atau basah. Potongan kode Arduino:"], ["code", "if ( ……… ) {\n  digitalWrite(POMPA, HIGH); // pompa menyala\n} else {\n  digitalWrite(POMPA, LOW);  // pompa padam\n}"]], "q": "Kondisi yang tepat untuk mengisi bagian titik-titik adalah …", "opts": ["nilai < 700", "nilai > 900", "nilai < 300", "nilai == 850", "nilai > 700"]}, {"no": 15, "tp": "TP 4.2.5", "materi": "Membaca dokumentasi fungsi modul AI", "level": "C3", "kat": "MOTS", "la": "Literasi", "type": "pg", "maks": 1, "stim": [["p", "Bacalah dokumentasi fungsi modul AI berikut (dokumentasi ilustratif)."], ["box", "deteksi_spam(pesan) → (label, keyakinan)", "Parameter : isi pesan masuk, maksimal 1.000 karakter.\nKeluaran : label (\"spam\" atau \"bukan_spam\") dan keyakinan 0,0–1,0.\nCatatan : disarankan ambang keyakinan ≥ 0,80. Pesan dengan keyakinan di bawah ambang dipindahkan ke folder “Perlu Dicek” untuk dibaca admin."], ["p", "Kotak pesan sekolah menerima pesan “Selamat! Nomor Anda memenangkan undian, klik tautan ini.” Modul mengeluarkan label \"spam\" dengan keyakinan 0,96."]], "q": "Tindakan program yang paling tepat sesuai dokumentasi adalah …", "opts": ["memindahkan pesan ke folder “Perlu Dicek” karena semua pesan spam harus dibaca admin", "menaikkan ambang menjadi 0,99 agar tidak ada pesan yang dipindahkan otomatis", "memindahkan pesan ke folder spam secara otomatis karena keyakinan 0,96 ≥ 0,80", "menghapus modul karena label spam dapat diberikan tanpa skor keyakinan", "menganggap pesan bukan spam karena keyakinan belum mencapai 1,0"]}, {"no": 16, "tp": "TP 4.2.5", "materi": "Akurasi modul NLP", "level": "C3", "kat": "MOTS", "la": "Numerasi", "type": "pg", "maks": 1, "stim": [["p", "Tabel berikut adalah hasil modul NLP yang memilah pesan pelanggan toko kue (data ilustratif)."], ["table", ["No", "Teks pesan", "Label modul", "Keyakinan", "Label sebenarnya"], [["1", "Kuenya enak, anak saya suka.", "positif", "0,94", "positif"], ["2", "Kotaknya penyok waktu sampai.", "negatif", "0,87", "negatif"], ["3", "Pesanan saya sudah dikirim belum?", "negatif", "0,55", "netral"], ["4", "Brownies-nya lembut pisan!", "positif", "0,81", "positif"], ["5", "Harganya sesuai, pengiriman cepat.", "positif", "0,90", "positif"], ["6", "Rasanya terlalu manis buat saya.", "positif", "0,61", "negatif"], ["7", "Kurirnya ramah dan tepat waktu.", "positif", "0,92", "positif"], ["8", "Kuenya basi, kecewa.", "negatif", "0,95", "negatif"], ["9", "Jam buka toko sampai jam berapa?", "positif", "0,52", "netral"], ["10", "Mantap, langganan terus.", "positif", "0,88", "positif"]], null]], "q": "Akurasi modul pada kesepuluh pesan tersebut adalah …", "opts": ["30%", "60%", "80%", "70%", "90%"]}, {"no": 17, "tp": "TP 4.5 (Konsep AI)", "materi": "Peluang dan tantangan AI", "level": "C2", "kat": "LOTS", "la": "Literasi", "type": "pg", "maks": 1, "stim": [["p", "Bacalah teks berikut (ilustrasi)."], ["p", "Sebuah rumah sakit di Bandung memakai AI untuk membaca foto rontgen paru dan menandai bagian yang dicurigai. Sebelumnya, dokter harus memeriksa ratusan foto satu per satu sehingga antrean hasil pemeriksaan bisa berhari-hari. Kini dokter tetap memastikan setiap hasil AI dan mengikuti pelatihan cara membaca tanda dari sistem, sementara foto dan data pasien tersimpan di server rumah sakit."]], "q": "Pasangan peluang dan tantangan penerapan AI yang paling tepat berdasarkan teks tersebut adalah …", "opts": ["hasil pemeriksaan lebih cepat — dokter tidak lagi dibutuhkan di rumah sakit", "jumlah pasien berkurang — AI tidak memerlukan data untuk bekerja", "biaya rumah sakit menjadi nol — penggunaan AI tidak memerlukan aturan etika", "pemeriksaan lebih cepat dan membantu dokter — dokter perlu dilatih dan data pasien wajib dijaga kerahasiaannya", "hasil AI selalu benar — pemeriksaan tidak perlu diawasi oleh siapa pun"]}, {"no": 18, "tp": "TP 4.5 (Library AI)", "materi": "Alur kerja modul AI", "level": "C2", "kat": "LOTS", "la": "-", "type": "pg", "maks": 1, "stim": [["p", "Perhatikan alur kerja aplikasi Saklar Suara Kelas berikut. Satu komponen sengaja dikosongkan."], ["img", "v1_pipe", "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 380 462' width='100%' style='max-width:380px' role='img' font-family='Arial,Helvetica,sans-serif'><defs><marker id='a18' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2937'/></marker></defs><rect x='10' y='8' width='360' height='86' rx='10' fill='#e8f0fe' stroke='#1f2937' stroke-width='2'/><text x='190.0' y='34' font-size='18' text-anchor='middle' font-weight='bold' fill='#1f2937'>(1) Masukan</text><text x='190.0' y='66' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>Mikrofon merekam ucapan “nyala”</text><line x1='190.0' y1='96' x2='190.0' y2='126' stroke='#1f2937' stroke-width='2' marker-end='url(#a18)'/><rect x='10' y='128' width='360' height='86' rx='10' fill='#fff7ed' stroke='#c2410c' stroke-width='2'/><text x='190.0' y='154' font-size='18' text-anchor='middle' font-weight='bold' fill='#1f2937'>(2)</text><text x='190.0' y='198' font-size='36' text-anchor='middle' font-weight='bold' fill='#c2410c'>?</text><line x1='190.0' y1='216' x2='190.0' y2='246' stroke='#1f2937' stroke-width='2' marker-end='url(#a18)'/><rect x='10' y='248' width='360' height='86' rx='10' fill='#e8f0fe' stroke='#1f2937' stroke-width='2'/><text x='190.0' y='274' font-size='18' text-anchor='middle' font-weight='bold' fill='#1f2937'>(3) Label + skor</text><text x='190.0' y='306' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>“nyala” 0,93</text><line x1='190.0' y1='336' x2='190.0' y2='366' stroke='#1f2937' stroke-width='2' marker-end='url(#a18)'/><rect x='10' y='368' width='360' height='86' rx='10' fill='#e8f0fe' stroke='#1f2937' stroke-width='2'/><text x='190.0' y='394' font-size='18' text-anchor='middle' font-weight='bold' fill='#1f2937'>(4) Aksi aplikasi</text><text x='190.0' y='426' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>Lampu kelas menyala</text></svg>"]], "q": "Komponen yang tepat untuk mengisi kotak (2) adalah …", "opts": ["kumpulan rekaman suara yang dipakai untuk melatih model sebelum aplikasi dibuat", "nilai ambang keyakinan 0,85 yang ditulis pada kode", "model terlatih yang mencocokkan pola suara masukan dengan pola yang telah dipelajari", "kabel USB yang menghubungkan laptop dengan Arduino", "tulisan “Lampu MENYALA” yang tampil di layar"]}, {"no": 19, "tp": "TP 4.5 (Library AI)", "materi": "Mengatasi masalah integrasi model", "level": "C4", "kat": "HOTS", "la": "-", "type": "pg", "maks": 1, "stim": [["p", "Saat praktikum Lab AI Mini, di bawah video muncul tulisan “Kertas 88%”, tetapi pesan “Masukkan ke TEMPAT KERTAS” tidak pernah muncul. Berikut bagian kode yang diisi kelompok."], ["code", "let ambang = 0.8;\n...\nif (label == \"kertas\" && confidence >= ambang) {\n  fill(0, 150, 0); textSize(36);\n  text(\"Masukkan ke TEMPAT KERTAS\", 20, 60);\n}"]], "q": "Penyebab yang paling mungkin dari masalah tersebut adalah …", "opts": ["tautan model belum ditempel sehingga model belum termuat ke aplikasi", "izin kamera belum diberikan sehingga video tidak terbaca oleh model", "ambang 0.8 terlalu tinggi karena confidence 0,88 belum mencapainya", "koneksi internet terputus sehingga aplikasi masih menunggu hasil model", "nama label di kode ditulis \"kertas\", sedangkan label model \"Kertas\" (huruf besar berbeda)"]}, {"no": 20, "tp": "TP 4.5 (Library AI)", "materi": "Membaca kode p5.js + ml5.js", "level": "C4", "kat": "HOTS", "la": "Literasi", "type": "pg", "maks": 1, "stim": [["p", "Perhatikan potongan kode aplikasi Robot Perintah Suara berikut."], ["code", "let ambang = 0.75;\n...\nif (label == \"maju\" && confidence >= ambang) {\n  text(\"Robot MAJU\", 20, 60);\n} else if (label == \"mundur\" && confidence >= ambang) {\n  text(\"Robot MUNDUR\", 20, 60);\n} else {\n  text(\"Ulangi perintah\", 20, 60);\n}"], ["p", "Seorang murid mengucapkan “mundur”. Model mengeluarkan label \"mundur\" dengan confidence 0.72."]], "q": "Reaksi aplikasi berdasarkan kode tersebut adalah …", "opts": ["muncul “Ulangi perintah” karena confidence 0.72 lebih kecil dari ambang 0.75", "muncul “Robot MUNDUR” karena label sudah sesuai dengan kata yang diucapkan", "muncul “Robot MAJU” karena kondisi pertama selalu diperiksa lebih dulu", "tidak muncul tulisan apa pun karena kedua kondisi tidak terpenuhi", "aplikasi berhenti dengan pesan error karena confidence bukan bilangan bulat"]}, {"no": 21, "tp": "TP 4.5 (Konsep AI)", "materi": "Penerapan AI dalam kehidupan sehari-hari", "level": "C3", "kat": "MOTS", "la": "Literasi", "type": "pgk", "maks": 2, "stim": [["p", "Bacalah catatan kegiatan seorang murid SMA di Bandung dalam satu hari (ilustrasi)."], ["p", "(a) Ia menjumlahkan uang belanja dengan aplikasi kalkulator. (b) Kamera ponsel memasang filter yang mengikuti posisi wajahnya. (c) Aplikasi surel memindahkan pesan penipuan ke folder spam secara otomatis. (d) Mesin cuci berhenti setelah 45 menit sesuai pengatur waktu. (e) Aplikasi peta menyarankan rute tercepat berdasarkan pola lalu lintas saat itu."]], "q": "Kegiatan yang memanfaatkan kecerdasan artifisial (AI) adalah … (jawaban benar lebih dari satu)", "opts": ["kegiatan (a) kalkulator menjumlahkan uang belanja", "kegiatan (b) filter kamera mengikuti posisi wajah", "kegiatan (c) surel penipuan dipindahkan ke folder spam", "kegiatan (d) mesin cuci berhenti sesuai pengatur waktu", "kegiatan (e) peta menyarankan rute dari pola lalu lintas"]}, {"no": 22, "tp": "TP 4.2.2", "materi": "Detektif Bug rancangan v1.0", "level": "C3", "kat": "MOTS", "la": "-", "type": "pgk", "maks": 2, "stim": [["p", "Berikut rancangan v1.0 Pemantau Suhu Rumah Kaca (aturan: rata-rata ≥ ambang dianggap PANAS). Desk-check memakai data daftar_suhu = [36, 30, 36], n = 3, dan ambang = 34."], ["code", "FUNGSI cek_suhu(daftar_suhu, n, ambang)\n  jumlah ← 0\n  UNTUK i DARI 2 SAMPAI n LAKUKAN\n    jumlah ← jumlah + daftar_suhu[i]\n  AKHIR UNTUK\n  rata ← jumlah / n\n  JIKA rata > ambang MAKA\n    KEMBALIKAN \"PANAS\"\n  SELAIN ITU\n    KEMBALIKAN \"NORMAL\"\n  AKHIR JIKA\nAKHIR FUNGSI"]], "q": "Pernyataan yang benar tentang rancangan tersebut adalah … (jawaban benar lebih dari satu)", "opts": ["Kesalahan pada rancangan ini termasuk kesalahan sintaks karena program tidak dapat berjalan.", "Keluaran v1.0 untuk data uji tersebut adalah \"NORMAL\", padahal harapannya \"PANAS\".", "Perulangan DARI 2 membuat data pertama (36) tidak ikut dijumlahkan.", "Walaupun batas perulangan sudah diperbaiki, kondisi rata > ambang tetap menghasilkan \"NORMAL\".", "Menambah pemeriksaan JIKA n = 0 merupakan perbaikan korektif atas hasil keliru pada data uji ini."]}, {"no": 23, "tp": "TP 4.2.3", "materi": "O(n) dibanding O(n²)", "level": "C4", "kat": "HOTS", "la": "Numerasi", "type": "pgk", "maks": 2, "stim": [["p", "Dua algoritma dipakai untuk mencari nomor peserta yang terdaftar ganda. Algoritma P membandingkan setiap pasangan data (perulangan bersarang). Algoritma Q memakai tabel penanda sehingga setiap data cukup diperiksa satu kali."], ["table", ["Banyak data (n)", "Langkah P = n(n − 1)/2", "Langkah Q = n"], [["20", "190", "20"], ["200", "19.900", "200"], ["2.000", "1.999.000", "2.000"]], null]], "q": "Pernyataan yang benar berdasarkan tabel tersebut adalah … (jawaban benar lebih dari satu)", "opts": ["Saat n naik 10 kali (200 → 2.000), langkah P naik sekitar 100 kali.", "Pola pertumbuhan langkah P adalah O(n²), sedangkan Q adalah O(n).", "Untuk n = 20, selisih langkah kedua algoritma sudah lebih dari 1.000.", "Untuk n = 2.000, langkah P sekitar 1.000 kali langkah Q.", "Saat n naik 10 kali, langkah Q juga naik sekitar 100 kali."]}, {"no": 24, "tp": "TP 4.2.4", "materi": "Changelog dan uji regresi", "level": "C4", "kat": "HOTS", "la": "Literasi", "type": "pgk", "maks": 2, "stim": [["p", "Bacalah changelog berikut (ilustrasi)."], ["box", "Changelog Presensi Kelas Digital", "v1.3 — korektif: memperbaiki jam presensi yang tercatat mundur 1 jam.\nv2.0 — fitur baru: rekap keterlambatan mingguan.\nHasil uji regresi v2.0: lulus 9 dari 12 kasus uji lama; kasus \"murid tanpa data presensi\" membuat aplikasi berhenti."]], "q": "Pernyataan yang benar berdasarkan changelog tersebut adalah … (jawaban benar lebih dari satu)", "opts": ["Persentase kasus uji regresi yang lulus adalah 75%.", "v2.0 layak dirilis karena tiga perempat kasus uji lama sudah lulus.", "Perubahan v1.3 termasuk pemeliharaan korektif karena memperbaiki kesalahan pencatatan jam.", "Uji regresi memastikan fitur lama tetap berjalan setelah fitur baru ditambahkan.", "Perubahan v2.0 termasuk pemeliharaan adaptif karena mengikuti aturan pemerintah."]}, {"no": 25, "tp": "TP 4.2.5", "materi": "Keterbatasan, bias, dan privasi", "level": "C2", "kat": "LOTS", "la": "Literasi", "type": "pgk", "maks": 2, "stim": [["p", "Bacalah dokumentasi modul presensi wajah berikut (dokumentasi ilustratif)."], ["box", "kenali_wajah(foto) → (nama, keyakinan)", "Model dilatih dengan 5 foto setiap murid yang diambil di ruang kelas terang tanpa masker.\nAkurasi dapat turun bila murid memakai masker atau berdiri membelakangi cahaya.\nFoto dihapus setelah dicocokkan; hanya nama dan jam yang disimpan.\nPemakaian wajib disetujui murid dan orang tua."]], "q": "Pernyataan yang merupakan keterbatasan atau risiko etis sesuai dokumentasi tersebut adalah … (jawaban benar lebih dari satu)", "opts": ["Hasil pengenalan dapat keliru saat murid memakai masker.", "Modul pasti selalu benar karena wajah setiap orang berbeda.", "Foto wajah termasuk data pribadi sehingga pemakaiannya memerlukan persetujuan.", "Foto wajah disimpan permanen di server sehingga memori cepat penuh.", "Data latih hanya diambil di kelas terang sehingga cahaya dari belakang dapat menurunkan akurasi."]}, {"no": 26, "tp": "TP 4.2.6", "materi": "Rancangan integrasi v3.0", "level": "C4", "kat": "HOTS", "la": "-", "type": "pgk", "maks": 2, "stim": [["p", "Berikut rancangan integrasi Pintu Kelas Pintar v3.0 yang memakai modul pengenal wajah."], ["code", "jarak ← baca_sensor_jarak()\nJIKA jarak < 50 MAKA\n  foto ← ambil_foto()\n  label, keyakinan ← kenali_wajah(foto)  // \"murid_terdaftar\", \"tamu\"\n  JIKA keyakinan ≥ 0,85 DAN label = \"murid_terdaftar\" MAKA\n    buka_pintu()\n  SELAIN ITU JIKA keyakinan < 0,85 MAKA\n    panggil_petugas_piket()\n  AKHIR JIKA\n  hapus(foto)\n  simpan_ke_cloud(label, waktu)\nAKHIR JIKA"]], "q": "Pernyataan yang benar tentang rancangan tersebut adalah … (jawaban benar lebih dari satu)", "opts": ["Panggilan ke petugas piket berperan sebagai jalur cadangan ketika AI tidak yakin.", "Modul AI hanya dipanggil bila ada orang dalam jarak kurang dari 50 cm.", "Bila label \"murid_terdaftar\" dengan keyakinan 0,80, pintu tetap terbuka.", "Foto wajah ikut dikirim ke cloud bersama label dan waktu.", "Bila label \"tamu\" dengan keyakinan 0,95, pintu tidak terbuka dan petugas tidak dipanggil."]}, {"no": 27, "tp": "TP 4.5 (Library AI)", "materi": "Pratinjau skor Teachable Machine", "level": "C3", "kat": "MOTS", "la": "Numerasi", "type": "pgk", "maks": 2, "stim": [["p", "Pada demonstrasi Teachable Machine, sebuah benda diarahkan ke kamera dan pratinjau skor berikut muncul. Ambang aplikasi ditetapkan 0,70."], ["img", "v1_tm", "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 570 226' width='100%' style='max-width:570px' role='img' font-family='Arial,Helvetica,sans-serif'><defs><marker id='a27' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2937'/></marker></defs><rect x='5' y='5' width='560' height='216' rx='10' fill='#ffffff' stroke='#cbd5e1' stroke-width='2'/><text x='25' y='38' font-size='17' text-anchor='start' font-weight='bold' fill='#1f2937'>Preview — Pemilah Sampah Kelas</text><text x='545' y='38' font-size='14' text-anchor='end' font-weight='normal' fill='#64748b'>Output</text><text x='25' y='85' font-size='16' text-anchor='start' font-weight='normal' fill='#1f2937'>Kaleng</text><rect x='120' y='64' width='420' height='30' fill='#eef2f7'/><rect x='120' y='64' width='268.8' height='30' fill='#f97316'/><text x='380.8' y='85' font-size='15' text-anchor='end' font-weight='bold' fill='#ffffff'>64%</text><text x='25' y='137' font-size='16' text-anchor='start' font-weight='normal' fill='#1f2937'>Botol</text><rect x='120' y='116' width='420' height='30' fill='#eef2f7'/><rect x='120' y='116' width='113.4' height='30' fill='#ec4899'/><text x='225.4' y='137' font-size='15' text-anchor='end' font-weight='bold' fill='#ffffff'>27%</text><text x='25' y='189' font-size='16' text-anchor='start' font-weight='normal' fill='#1f2937'>Kertas</text><rect x='120' y='168' width='420' height='30' fill='#eef2f7'/><rect x='120' y='168' width='37.8' height='30' fill='#8b5cf6'/><text x='165.8' y='189' font-size='15' text-anchor='start' font-weight='bold' fill='#1f2937'>9%</text></svg>"]], "q": "Pernyataan yang benar berdasarkan pratinjau tersebut adalah … (jawaban benar lebih dari satu)", "opts": ["Jumlah skor ketiga label adalah 100%.", "Selisih skor Kaleng dan Botol adalah 37 poin persen.", "Dengan ambang 0,70, aplikasi menjalankan aksi untuk Kaleng.", "Label dengan skor tertinggi adalah Kaleng.", "Bila ambang diturunkan menjadi 0,60, aksi untuk Kaleng dijalankan."]}, {"no": 28, "tp": "TP 4.5 (IoT/Robotika)", "materi": "Sensor dan aktuator", "level": "C2", "kat": "LOTS", "la": "-", "type": "pgk", "maks": 2, "stim": [["p", "Sebuah kit Arduino berisi komponen berikut: (a) sensor ultrasonik HC-SR04, (b) LED, (c) potensiometer, (d) motor servo, dan (e) sensor gerak PIR."]], "q": "Komponen yang berfungsi sebagai masukan (sensor/input) adalah … (jawaban benar lebih dari satu)", "opts": ["(a) sensor ultrasonik HC-SR04", "(b) LED", "(c) potensiometer", "(d) motor servo", "(e) sensor gerak PIR"]}, {"no": 29, "tp": "TP 4.5 (Konsep AI)", "materi": "Konsep dasar AI", "level": "C2", "kat": "LOTS", "la": "-", "type": "jodoh", "maks": 2, "stim": [["p", "Pasangkan setiap istilah di kolom kiri dengan penjelasan yang paling tepat di kolom kanan."]], "q": "", "left": ["Machine learning", "AI generatif", "Deep learning", "Data latih"], "right": ["kumpulan contoh berlabel yang dipelajari model, misalnya foto daun sehat dan daun kering", "AI yang membuat konten baru, seperti teks, gambar, atau musik, dari perintah pengguna", "cara komputer belajar mengenali pola dari contoh data, bukan dari aturan yang ditulis satu per satu", "cabang machine learning yang memakai jaringan saraf tiruan berlapis banyak untuk pola rumit", "perangkat sensor yang mengirim data ke internet secara terus-menerus"]}, {"no": 30, "tp": "TP 4.2.4", "materi": "Permintaan klien dan strategi algoritmik", "level": "C3", "kat": "MOTS", "la": "-", "type": "jodoh", "maks": 2, "stim": [["p", "Pasangkan setiap Kartu Permintaan Klien di kolom kiri dengan strategi algoritmik yang paling sesuai di kolom kanan."]], "q": "", "left": ["Kurir paket ingin rute antar yang selalu memilih alamat terdekat berikutnya dari posisinya sekarang.", "Guru ingin mencari nilai seorang murid dari 1.000 NIS yang sudah terurut.", "Panitia ingin memeriksa semua kemungkinan susunan 4 petugas upacara untuk memilih susunan terbaik.", "Relawan ingin mengurutkan ribuan data donasi dengan membagi data menjadi dua bagian, mengurutkan masing-masing, lalu menggabungkannya."], "right": ["Pencarian beruntun", "Greedy", "Brute force (mencoba semua kemungkinan)", "Pencarian biner", "Divide and conquer (merge sort)"]}, {"no": 31, "tp": "TP 4.2.5", "materi": "Jenis modul AI dan kegunaannya", "level": "C2", "kat": "LOTS", "la": "-", "type": "jodoh", "maks": 2, "stim": [["p", "Pasangkan setiap jenis modul AI di kolom kiri dengan kegunaan yang paling sesuai di kolom kanan."]], "q": "", "left": ["Visi komputer", "Pengenal suara", "Pemrosesan bahasa alami (NLP)"], "right": ["mengukur suhu ruangan dengan sensor DHT11", "menilai apakah ulasan pembeli bernada positif atau negatif", "menghitung pengunjung yang masuk perpustakaan dari rekaman kamera", "mengubah perintah lisan menjadi teks untuk asisten digital"]}, {"no": 32, "tp": "TP 4.5 (IoT/Robotika)", "materi": "Fungsi komponen rangkaian", "level": "C2", "kat": "LOTS", "la": "-", "type": "jodoh", "maks": 2, "stim": [["p", "Pasangkan setiap komponen rangkaian Penyiram Tanaman Otomatis di kolom kiri dengan fungsinya di kolom kanan."]], "q": "", "left": ["Sensor kelembapan tanah", "Arduino UNO", "Relay", "Pompa air mini"], "right": ["menjalankan program dan memutuskan kapan pompa dinyalakan", "mengalirkan air ke tanaman", "membaca kadar air tanah dan mengirimkannya sebagai nilai analog", "menampilkan gambar dan video kepada pengguna", "saklar elektronik yang menyambung arus pompa sesuai perintah Arduino"]}, {"no": 33, "tp": "TP 4.2.1", "materi": "Arsitektur alur data solusi 4.0", "level": "C3", "kat": "MOTS", "la": "-", "type": "urut", "maks": 2, "stim": [["p", "Berikut kejadian pada solusi Kebun Hidroponik Pintar yang disajikan secara acak."]], "q": "Urutkan kejadian tersebut sesuai alur data sensor → cloud → big data → AI → aksi.", "items": ["Pompa menyiram tanaman dan notifikasi dikirim ke HP pengurus kebun", "Sensor kelembapan membaca 28%", "Model AI memprediksi tanah akan kering dalam 2 jam", "Data dikirim ke server cloud setiap 10 menit", "Data kelembapan dan cuaca beberapa musim diolah untuk menemukan pola"]}, {"no": 34, "tp": "TP 4.5 (Konsep AI)", "materi": "Sejarah perkembangan AI", "level": "C2", "kat": "LOTS", "la": "-", "type": "urut", "maks": 2, "stim": [["p", "Berikut tonggak perkembangan kecerdasan artifisial yang disajikan secara acak."]], "q": "Urutkan tonggak tersebut dari yang paling awal sampai yang paling baru.", "items": ["Komputer Deep Blue mengalahkan juara dunia catur Garry Kasparov", "Frank Rosenblatt memperkenalkan perceptron, model jaringan saraf tiruan sederhana", "AlphaGo mengalahkan pemain Go profesional Lee Sedol", "Alan Turing mengajukan pertanyaan “dapatkah mesin berpikir?” dan gagasan uji Turing", "ChatGPT dirilis dan AI generatif menjadi populer di seluruh dunia"]}, {"no": 35, "tp": "TP 4.2.6", "materi": "Pseudocode integrasi modul AI", "level": "C3", "kat": "MOTS", "la": "-", "type": "urut", "maks": 2, "stim": [["p", "Berikut baris-baris pseudocode integrasi Pintu Kelas Pintar yang disajikan secara acak."]], "q": "Urutkan baris tersebut agar menjadi algoritma yang logis.", "items": ["simpan_ke_cloud(label, waktu)  // tanpa menyimpan foto", "label, keyakinan ← kenali_wajah(foto)", "TUNGGU sampai tombol bel pintu ditekan", "JIKA keyakinan ≥ 0,85 MAKA buka_pintu() SELAIN ITU panggil_petugas_piket() AKHIR JIKA", "foto ← ambil_foto(kamera)"]}, {"no": 36, "tp": "TP 4.5 (IoT/Robotika)", "materi": "Alur sensor–proses–aktuator", "level": "C2", "kat": "LOTS", "la": "-", "type": "urut", "maks": 2, "stim": [["p", "Berikut kejadian pada kipas angin otomatis berbasis Arduino yang disajikan secara acak."]], "q": "Urutkan kejadian tersebut sesuai alur sensor–proses–aktuator.", "items": ["Kipas berputar", "Suhu kelas naik pada siang hari", "Sensor suhu membaca 33 °C dan mengirimkannya ke Arduino", "Arduino membandingkan 33 dengan ambang 30 di dalam program", "Arduino mengirim sinyal HIGH ke relay kipas"]}, {"no": 37, "tp": "TP 4.2.2", "materi": "Jenis kesalahan dan kasus uji", "level": "C2", "kat": "LOTS", "la": "-", "type": "bs", "maks": 2, "stim": [["p", "Perhatikan pernyataan tentang jenis kesalahan program dan kasus uji berikut."]], "q": "Tentukan Benar atau Salah setiap pernyataan berikut.", "stmts": ["Kesalahan logika membuat program tetap berjalan, tetapi hasilnya keliru.", "Lupa menutup tanda kurung kurawal pada kode Arduino termasuk kesalahan sintaks.", "Data uji suhu = 37,5 untuk aturan suhu ≥ 37,5 termasuk kasus uji normal.", "Data uji umur = −5 pada formulir pendaftaran termasuk kasus uji tidak valid.", "Runtime error selalu terdeteksi sebelum program mulai dijalankan."]}, {"no": 38, "tp": "TP 4.5 (Konsep AI)", "materi": "Penggunaan AI oleh pelajar", "level": "C3", "kat": "MOTS", "la": "Literasi & Numerasi", "type": "bs", "maks": 2, "stim": [["p", "Diagram berikut adalah hasil survei aplikasi AI yang dipakai murid di satu kelas XII yang berisi 32 murid."], ["img", "v1_hbar", "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 580 374' width='100%' style='max-width:580px' role='img' font-family='Arial,Helvetica,sans-serif'><defs><marker id='a38' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2937'/></marker></defs><text x='290' y='28' font-size='16' text-anchor='middle' font-weight='bold' fill='#1f2937'>Aplikasi AI yang dipakai dalam sepekan terakhir — satu kelas XII (ilustrasi)</text><text x='165' y='79.0' font-size='16' text-anchor='end' font-weight='normal' fill='#1f2937'>Penerjemah</text><rect x='175' y='56' width='270.7' height='36' fill='#60a5fa'/><text x='453.6666666666667' y='79.0' font-size='17' text-anchor='start' font-weight='normal' fill='#1f2937'>28 murid</text><text x='165' y='131.0' font-size='16' text-anchor='end' font-weight='normal' fill='#1f2937'>Rekomendasi video</text><rect x='175' y='108' width='232.0' height='36' fill='#60a5fa'/><text x='415.0' y='131.0' font-size='17' text-anchor='start' font-weight='normal' fill='#1f2937'>24 murid</text><text x='165' y='175.0' font-size='16' text-anchor='end' font-weight='normal' fill='#1f2937'>AI generatif</text><text x='165' y='191.0' font-size='16' text-anchor='end' font-weight='normal' fill='#1f2937'>( eight='18' rx='3' fill='#ffffff' opacity='0.92'/><text x='349.0' y='85.0' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2937'>0,95</text><rect x='378' y='164.0' width='32' height='18' rx='3' fill='#ffffff' opacity='0.92'/><text x='394.0' y='178.0' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2937'>0,64</text><rect x='423' y='107.0' width='32' height='18' rx='3' fill='#ffffff' opacity='0.92'/><text x='439.0' y='121.0' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2937'>0,83</text><rect x='468' y='143.0' width='32' height='18' rx='3' fill='#ffffff' opacity='0.92'/><text x='484.0' y='157.0' font-size='14' text-anchor='middle' font-weight='bold' fill='#1f2937'>0,71</text><line x1='50' y1='40' x2='50' y2='350' stroke='#1f2937' stroke-width='1.5'/><line x1='50' y1='350' x2='508' y2='350' stroke='#1f2937' stroke-width='1.5'/><text x='18' y='200.0' font-size='13' text-anchor='middle' transform='rotate(-90 18 200.0)' fill='#1f2937'>Skor keyakinan</text></svg>"]], "q": "Tentukan Benar atau Salah setiap pernyataan berikut.", "stmts": ["Sampel S9 diterima pada kedua ambang.", "Pada ambang 0,65, sebanyak 8 sampel diterima dan 2 sampel dialihkan ke petugas.", "Menaikkan ambang dari 0,65 menjadi 0,85 menambah beban petugas sebanyak 5 sampel.", "Pada ambang 0,85, sampel yang dialihkan ke petugas lebih banyak daripada sampel yang diterima.", "Ambang 0,65 lebih aman bila sampah berbahaya tidak boleh salah dipilah."]}, {"no": 40, "tp": "TP 4.5 (Library AI)", "materi": "Evaluasi ambang Saklar Suara", "level": "C5", "kat": "HOTS", "la": "Numerasi", "type": "bs", "maks": 2, "stim": [["p", "Sebuah kelompok menguji Kunci Pintu Suara untuk gudang alat laboratorium sebanyak 20 kali pada dua nilai ambang (data ilustrasi)."], ["table", ["Ambang", "Reaksi benar", "Reaksi keliru (pintu terbuka tanpa perintah yang benar)", "Tidak bereaksi"], [["0,6", "16", "4", "0"], ["0,9", "17", "0", "3"]], null]], "q": "Tentukan Benar atau Salah setiap pernyataan berikut.", "stmts": ["Akurasi pada ambang 0,6 adalah 80%.", "Akurasi pada ambang 0,9 adalah 85%.", "Pada ambang 0,9, pintu gudang pernah terbuka tanpa perintah yang benar.", "Ambang 0,6 lebih tepat karena aplikasi selalu bereaksi.", "Ambang 0,9 lebih tepat karena pintu terbuka tanpa perintah lebih berbahaya daripada murid harus mengulang perintah."]}, {"no": 41, "tp": "TP 4.2.1", "materi": "Konsep ide berteknologi 4.0 yang dipamerkan", "level": "C4", "kat": "HOTS", "la": "Literasi", "type": "pg", "maks": 8, "stim": [["p", "Pada gallery walk kelas, sebuah kelompok memamerkan konsep ide “Tas Sekolah Pintar”."], ["box", "Kartu Konsep Ide", "Masalah: banyak murid membawa tas terlalu berat karena membawa buku yang tidak dipakai hari itu.\nPengguna: murid dan orang tua.\nData pendukung: survei kelompok, 21 dari 30 teman sekelas mengeluh pegal setelah pulang sekolah.\nCara kerja: sensor berat dan GPS pada tas mengirim data ke server daring; data berat tas dan jadwal pelajaran ribuan murid diolah untuk menemukan pola; sistem memberi saran buku yang tidak perlu dibawa besok; orang tua menerima notifikasi bila tas melebihi 15% berat badan anak."]], "q": "Pemetaan peran teknologi Revolusi Industri 4.0 yang paling tepat untuk ide tersebut adalah …", "opts": ["IoT: memberi saran buku yang tidak perlu dibawa; cloud: mengukur berat tas; big data: mengirim notifikasi; AI: menyimpan data di server", "IoT: menyimpan data jadwal di server; cloud: mengolah pola ribuan murid; big data: sensor berat; AI: mengirim notifikasi ke orang tua", "IoT: mengolah data ribuan murid; cloud: memberi saran buku; big data: sensor GPS; AI: menyimpan data berat tas", "IoT: sensor berat dan GPS yang mengirim data; cloud: server daring tempat data disimpan dan diakses; big data: pengolahan data ribuan murid menjadi pola; AI: saran buku dari pola jadwal dan berat tas", "IoT dan AI sama-sama berperan mengukur berat tas, sedangkan cloud dan big data tidak diperlukan karena datanya sedikit"]}, {"no": 42, "tp": "TP 4.2.2", "materi": "Rancangan cara kerja konsep ide (masukan–proses–keluaran)", "level": "C6", "kat": "HOTS", "la": "-", "type": "pg", "maks": 8, "stim": [["p", "Kelompok merancang “Chatbot Info Kantin” agar murid tidak perlu antre hanya untuk bertanya menu dan stok. Berikut lima usulan rancangan cara kerja (masukan → proses → keluaran) dari anggota kelompok."]], "q": "Rancangan yang paling logis dan lengkap untuk mengatasi masalah tersebut adalah …", "opts": ["Masukan: jawaban chatbot di layar; Proses: murid mengetik pertanyaan; Keluaran: data menu dan stok di server kantin", "Masukan: pertanyaan murid yang diketik dan data menu serta stok dari server kantin; Proses: chatbot mengenali maksud pertanyaan lalu mencari jawaban di data, pertanyaan yang tidak dikenali diteruskan ke penjual; Keluaran: jawaban menu, harga, dan stok langsung tampil di HP murid", "Masukan: pertanyaan murid; Proses: penjual kantin membaca dan membalas setiap pesan satu per satu; Keluaran: jawaban dari penjual setelah jam istirahat", "Masukan: data menu; Proses: data menu disimpan di server; Keluaran: data menu tersimpan dengan aman", "Masukan: foto wajah murid; Proses: chatbot mengenali wajah; Keluaran: daftar menu yang paling disukai semua murid"]}, {"no": 43, "tp": "TP 4.2.3", "materi": "Flowchart penyempurnaan perfektif (jumlah berjalan)", "level": "C6", "kat": "HOTS", "la": "Literasi", "type": "pg", "maks": 8, "stim": [["p", "Sensor kebisingan kantin mengirim 1 data setiap 5 menit. Rancangan v1.2 memakai jumlah berjalan untuk menampilkan rata-rata kumulatif setiap kali data baru datang, sampai seluruh n data diproses. Satu kotak proses pada flowchart berikut sengaja dikosongkan."], ["img", "v1_fc43", "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 660' width='100%' style='max-width:500px' role='img' font-family='Arial,Helvetica,sans-serif'><defs><marker id='a43' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d eight='normal' fill='#1f2937'>Masukkan db</text><line x1='200' y1='362' x2='200' y2='388' stroke='#1f2937' stroke-width='2' marker-end='url(#a43)'/><rect x='85.0' y='388' width='230' height='44' fill='#fff7ed' stroke='#c2410c' stroke-width='2'/><text x='200' y='415' font-size='17' text-anchor='middle' font-weight='bold' fill='#1f2937'>? ? ?</text><line x1='200' y1='432' x2='200' y2='458' stroke='#1f2937' stroke-width='2' marker-end='url(#a43)'/><rect x='85.0' y='458' width='230' height='44' fill='#e0f2fe' stroke='#1f2937' stroke-width='2'/><text x='200' y='485' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>rata ← jumlah / i</text><line x1='200' y1='502' x2='200' y2='528' stroke='#1f2937' stroke-width='2' marker-end='url(#a43)'/><polygon points='103.0,528 333.0,528 297.0,572 67.0,572' fill='#fef9c3' stroke='#1f2937' stroke-width='2'/><text x='200' y='555' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>Tampilkan rata</text><line x1='200' y1='572' x2='200' y2='598' stroke='#1f2937' stroke-width='2' marker-end='url(#a43)'/><rect x='85.0' y='598' width='230' height='44' fill='#e0f2fe' stroke='#1f2937' stroke-width='2'/><text x='200' y='625' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>i ← i + 1</text><polyline points='85,620 40,620 40,252 120,252' fill='none' stroke='#1f2937' stroke-width='2' marker-end='url(#a43)'/></svg>"]], "q": "Isi kotak proses yang kosong agar flowchart v1.2 benar dan efisien adalah …", "opts": ["jumlah ← 0", "jumlah ← db", "UNTUK k DARI 1 SAMPAI i: jumlah ← jumlah + data[k]", "jumlah ← jumlah + db", "rata ← jumlah / n"]}, {"no": 44, "tp": "TP 4.2.6", "materi": "Memilih ambang berbasis data", "level": "C5", "kat": "HOTS", "la": "Literasi & Numerasi", "type": "pg", "maks": 8, "stim": [["p", "Pemindai Telur Koperasi Sekolah memotret telur, lalu modul AI memberi label (utuh/retak) dan skor keyakinan. Telur dengan keyakinan di bawah ambang dialihkan ke petugas. Telur retak tidak boleh lolos sebagai telur utuh. Hasil uji 10 sampel (data ilustrasi):"], ["table", ["Sampel", "Label AI", "Keyakinan", "Label sebenarnya"], [["1", "utuh", "0,96", "utuh"], ["2", "utuh", "0,81", "retak"], ["3", "retak", "0,92", "retak"], ["4", "utuh", "0,93", "utuh"], ["5", "retak", "0,70", "retak"], ["6", "utuh", "0,78", "utuh"], ["7", "utuh", "0,91", "utuh"], ["8", "retak", "0,88", "retak"], ["9", "utuh", "0,73", "retak"], ["10", "utuh", "0,95", "utuh"]], null]], "q": "Ambang 0,75 atau 0,9? Pilihan dan alasan berbasis data yang paling tepat adalah …", "opts": ["0,75, karena 8 telur diterima otomatis dengan label benar 100% sehingga petugas hanya memeriksa 2 telur", "0,75, karena label benar 7 dari 8 (87,5%) sudah tinggi dan petugas tidak terlalu sibuk", "0,9, karena 4 telur diterima dengan label benar 100%, sedangkan 6 telur dialihkan ke petugas", "0,9, karena semua telur diterima otomatis sehingga petugas tidak perlu memeriksa telur sama sekali", "0,9, karena 5 telur diterima dan semuanya benar (100%), sampel 2 (telur retak berlabel utuh) dialihkan; petugas memeriksa 5 telur, bertambah 3"]}, {"no": 45, "tp": "TP 4.2.4", "materi": "Pameran rancangan dan evaluasi risiko ide", "level": "C5", "kat": "HOTS", "la": "-", "type": "pg", "maks": 8, "stim": [["p", "Sebuah kelompok memamerkan konsep ide “Nebeng Aman”, aplikasi berbagi tumpangan antarmurid ke sekolah, memakai prototipe halaman web dan video teaser. Aplikasi menampilkan lokasi langsung pengemudi dan penumpang selama perjalanan. Seorang pengunjung bertanya, “Bagaimana kalau lokasi murid bisa dilihat orang yang tidak dikenal?”"]], "q": "Evaluasi risiko beserta cara mengatasinya yang paling tepat untuk ide tersebut adalah …", "opts": ["Risiko privasi dan keselamatan karena lokasi murid terbuka; diatasi dengan menambah warna dan animasi pada aplikasi", "Tidak ada risiko karena aplikasi hanya dipakai murid satu sekolah, sehingga lokasi boleh dilihat semua pengguna", "Risiko privasi dan keselamatan karena lokasi murid terbuka; diatasi dengan membagikan lokasi hanya kepada akun terverifikasi dan orang tua, menghapus riwayat lokasi setelah perjalanan, serta meminta persetujuan orang tua", "Risiko biaya server; diatasi dengan menyimpan seluruh riwayat lokasi selamanya agar mudah dilacak", "Risiko aplikasi lambat; diatasi dengan menghapus fitur lokasi sehingga pengemudi dan penumpang tidak dapat bertemu"]}];

function blocks(bl){return bl.map(b=>{
 if(b[0]==="p")return "<p>"+mk(b[1])+"</p>";
 if(b[0]==="table"){return '<div class="tw"><table class="t"><thead><tr>'+b[1].map(h=>"<th>"+mk(h)+"</th>").join("")+"</tr></thead><tbody>"+b[2].map(r=>"<tr>"+r.map(c=>"<td>"+mk(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>";}
 if(b[0]==="code")return "<pre><code>"+esc(b[1])+"</code></pre>";
 if(b[0]==="box")return '<div class="box"><div class="boxt">'+esc(b[1])+"</div><div>"+mk(b[2])+"</div></div>";
 if(b[0]==="img")return '<figure class="fig">'+b[2]+"</figure>";
 if(b[0]==="chat")return '<div class="chat"><div class="ct">'+esc(b[1])+"</div>"+b[2].map(m=>'<div class="msg'+(/Tim Pengembang/.test(m[0])?" dev":"")+'"><b>'+esc(m[0])+"</b>"+mk(m[1])+"</div>").join("")+"</div>";
 return "";}).join("");}

try{KEYS=JSON.parse(decodeURIComponent(escape(atob(KEYB64))));}catch(e){KEYS=[];}
let PEMB=[];

function emailGuru(k){const m=CFG.EMAIL_KELAS||{};k=k||(S&&S.ident?S.ident.kelas:"");return m[k]||CFG.EMAIL_GURU;}
const T_BUKA=CFG.BUKA?Date.parse(CFG.BUKA):0, T_TUTUP=CFG.TUTUP?Date.parse(CFG.TUTUP):Infinity;
const BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"],HARI=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
function tglWIB(t){const d=new Date(t+7*3600000);return HARI[d.getUTCDay()]+", "+d.getUTCDate()+" "+BULAN[d.getUTCMonth()]+" "+d.getUTCFullYear()+" pukul "+String(d.getUTCHours()).padStart(2,"0")+"."+String(d.getUTCMinutes()).padStart(2,"0")+" WIB";}
function belumBuka(){return Date.now()<T_BUKA;}
function sudahTutup(){return Date.now()>T_TUTUP;}
const LSK="psas_"+CFG.TINGKAT.toLowerCase()+"_v"+CFG.VERSI;
const LSA="psas_"+CFG.TINGKAT.toLowerCase()+"_percobaan";

function fresh(ident){return{phase:"start",ident:ident||{nama:"",kelas:CFG.KELAS[0],absen:""},ans:{},flag:{},chk:{},cur:1,t0:null,dur:CFG.DURASI,res:null,rev:null,keluar:0,id:"",ke:1,kirim:null,grid:window.innerWidth>700};}
let S=fresh();
let timerId=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function mk(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");}
function $(id){return document.getElementById(id);}
function save(){try{localStorage.setItem(LSK,JSON.stringify({S:S}));}catch(e){}}
function load(){try{const r=localStorage.getItem(LSK);if(r){const o=JSON.parse(r);return o.S;}}catch(e){}return null;}
function clearSave(){try{localStorage.removeItem(LSK);}catch(e){}}
function pad(n){return String(n).padStart(2,"0");}
function stamp(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());}
function num(x){return String(Math.round(x*100)/100).replace(".",",");}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function siswaKey(k,a){return String(k).trim().toUpperCase()+"|"+(parseInt(a,10)||String(a).trim());}

/* ---------- proteksi: salin-tempel, klik kanan, pindah halaman ---------- */
function elOf(t){return t&&t.nodeType===1?t:(t&&t.parentElement);}
function bolehKetik(e){if(CFG.MODE==="guru")return true;const t=elOf(e.target);return S.phase!=="quiz"&&t&&t.closest&&t.closest("input,textarea");}
["copy","cut","paste","contextmenu","selectstart","dragstart","drop"].forEach(ev=>document.addEventListener(ev,e=>{if(bolehKetik(e))return;e.preventDefault();if(ev==="copy"||ev==="paste"||ev==="cut")toast("Salin/tempel tidak diizinkan pada latihan ini.");},true));
document.addEventListener("keydown",e=>{const k=(e.key||"").toLowerCase();const mod=e.ctrlKey||e.metaKey;
 if(k==="f12"||(mod&&e.shiftKey&&["i","j","c"].includes(k))||(mod&&["u","s","p"].includes(k))||(mod&&["c","x","v","a"].includes(k)&&!bolehKetik(e))){e.preventDefault();e.stopPropagation();}},true);

/* ---------- elemen bantu tampilan ---------- */
function toast(t){let el=$("toast");if(!el){el=document.createElement("div");el.id="toast";document.body.appendChild(el);}el.textContent=t;el.className="show";clearTimeout(el._t);el._t=setTimeout(()=>el.className="",2200);}
function modal(html,label,onClose,label2,on2){let m=$("modal");if(m)m.remove();m=document.createElement("div");m.id="modal";
 m.innerHTML='<div class="mbox">'+html+'<div class="mbtn">'+(label2?'<button id="m2">'+label2+"</button>":"")+'<button id="m1" class="pri">'+label+"</button></div></div>";
 document.body.appendChild(m);$("m1").onclick=()=>{m.remove();onClose&&onClose();};if(label2)$("m2").onclick=()=>{m.remove();on2&&on2();};}
function tanya(html,ya,onYa,tidak){modal(html,ya,onYa,tidak||"Batal",null);}

/* ---------- catatan percobaan di perangkat ---------- */
function attLoad(){try{return JSON.parse(localStorage.getItem(LSA)||"{}");}catch(e){return{};}}
function attCount(key){const a=attLoad()[key];return a?a.length:0;}
function attAdd(key,id){const all=attLoad();all[key]=all[key]||[];if(!all[key].some(x=>x.id===id))all[key].push({id:id,v:CFG.VERSI,t:Date.now()});try{localStorage.setItem(LSA,JSON.stringify(all));}catch(e){}return all[key].length;}

/* ---------- komunikasi dengan rekap Google Sheet (JSONP) ---------- */
function jsonp(params,ms){return new Promise((res,rej)=>{
 if(!CFG.URL_REKAP){rej(new Error("nonaktif"));return;}
 const cb="psascb_"+uid();const s=document.createElement("script");let done=false;
 const fin=(f,v)=>{if(done)return;done=true;window[cb]=function(){};s.remove();f(v);};
 window[cb]=d=>fin(res,d);s.onerror=()=>fin(rej,new Error("jaringan"));
 setTimeout(()=>fin(rej,new Error("waktu habis")),ms||15000);
 const q=new URLSearchParams(Object.assign({},params,{callback:cb}));
 s.src=CFG.URL_REKAP+(CFG.URL_REKAP.indexOf("?")>=0?"&":"?")+q.toString();document.body.appendChild(s);});}

/* ---------- jawaban & penilaian ---------- */
function answered(it){const a=S.ans[it.no];if(a==null)return false;
 if(it.type==="pg")return true;
 if(it.type==="pgk")return a.length>0;
 return a.some(x=>x!=null);}
function lengkap(it){const a=S.ans[it.no];if(!answered(it))return false;if(it.type==="pg"||it.type==="pgk")return true;return a.every(x=>x!=null);}
function ansStr(it,a){
 if(a==null)return "";
 if(it.type==="pg")return L[a];
 if(it.type==="pgk")return a.length?[...a].sort().map(i=>L[i]).join(","):"";
 if(it.type==="jodoh")return a.some(x=>x!=null)?a.map((x,i)=>(i+1)+"-"+(x==null?"?":L[x])).join(";"):"";
 if(it.type==="urut")return a.some(x=>x!=null)?a.map(x=>x==null?"?":L[x]).join("-"):"";
 if(it.type==="bs")return a.some(x=>x!=null)?a.map(x=>x==null?"?":(x?"B":"S")).join(";"):"";
 return "";}
function scoreItem(it){
 const a=S.ans[it.no],k=KEYS[it.no-1];let skor=0;
 if(!answered(it))return{skor:0,status:"Kosong",jawab:""};
 if(it.type==="pg"){skor=a===k?it.maks:0;}
 else if(it.type==="pgk"){const set=new Set(a),ks=new Set(k);let t=0;for(let i=0;i<5;i++)if(set.has(i)===ks.has(i))t++;skor=it.maks*t/5;}
 else{let t=0;k.forEach((x,i)=>{if(a[i]===x)t++;});skor=it.maks*t/k.length;}
 skor=Math.round(skor*1000)/1000;
 const status=skor>=it.maks-1e-9?"Benar":(skor<=1e-9?"Salah":"Sebagian");
 return{skor,status,jawab:ansStr(it,a)};}
function hitung(){
 const rows=ITEMS.map(it=>{const r=scoreItem(it);return Object.assign({it},r);});
 const total=Math.round(rows.reduce((s,r)=>s+r.skor,0)*100)/100;
 return{rows,total};}

/* ---------- pemeriksaan per soal (maks CFG.MAKS_CEK kali, tanpa kunci) ---------- */
function cek(no){return S.chk[no]||null;}
function terkunci(it){const c=cek(it.no);return !!c&&(c.st==="Benar"||c.n>=CFG.MAKS_CEK);}
function berubah(it){const c=cek(it.no);return !c||c.last!==JSON.stringify(S.ans[it.no]);}
function periksa(it){
 if(terkunci(it)||!lengkap(it)||!berubah(it))return;
 const r=scoreItem(it);const c=S.chk[it.no]||{n:0};
 c.n++;c.last=JSON.stringify(S.ans[it.no]);c.st=r.status;c.skor=r.skor;S.chk[it.no]=c;save();renderQuiz();
 const fb=$("fb");if(fb)fb.scrollIntoView({behavior:"smooth",block:"center"});}
function feedback(it){
 const c=cek(it.no),sisa=CFG.MAKS_CEK-(c?c.n:0);
 let h="";
 if(c){const cls={Benar:"s-ok",Sebagian:"s-part",Salah:"s-bad"}[c.st];
  const judul={Benar:"✓ Jawabanmu benar!",Sebagian:"◐ Jawabanmu sebagian benar.",Salah:"✗ Jawabanmu belum tepat."}[c.st];
  h+='<div class="fbmsg '+cls+'"><b>'+judul+'</b> Skor soal ini: '+num(c.skor)+" dari "+it.maks+".";
  if(c.st!=="Benar")h+=sisa>0?"<br>Sisa kesempatan memeriksa: <b>"+sisa+"</b>. Ubah jawabanmu, lalu periksa lagi.":"<br>Kesempatan memeriksa sudah habis. Jawaban ini yang dinilai.";
  h+="</div>";}
 if(!terkunci(it)){
  const bisa=lengkap(it)&&berubah(it);
  const lbl=!lengkap(it)?(answered(it)?"Lengkapi semua bagian dulu":"Pilih jawaban dulu"):(!berubah(it)?"Ubah jawaban untuk memeriksa lagi":(c?"Periksa lagi":"Periksa jawaban")+" ("+sisa+"× tersisa)");
  h+='<button id="btnCek" class="cek'+(bisa?" pri":"")+'" '+(bisa?"":"disabled")+">"+lbl+"</button>";}
 return '<div id="fb" class="fb">'+h+"</div>";}

/* ---------- widget jawaban ---------- */
function widget(it,ro,show){
 const a=S.ans[it.no];let h="";const dis=ro?"disabled":"";const k=KEYS[it.no-1];
 const mark=(ok,kt)=>show?(ok?' <span class="status s-ok">benar</span>':' <span class="status s-bad">kunci: '+kt+"</span>"):"";
 if(it.type==="pg"){
  h=it.opts.map((o,i)=>'<div class="opt'+(a===i?" sel":"")+(ro?" ro":"")+(show?(i===k?" right":(a===i?" wrong":"")):"")+'" data-act="pg" data-i="'+i+'"><span class="l">'+L[i]+'.</span><span>'+mk(o)+"</span></div>").join("");}
 else if(it.type==="pgk"){
  const set=new Set(a||[]);
  h=it.opts.map((o,i)=>'<div class="opt'+(set.has(i)?" sel":"")+(ro?" ro":"")+(show?(k.includes(i)?" right":(set.has(i)?" wrong":"")):"")+'" data-act="pgk" data-i="'+i+'"><span class="l">'+(set.has(i)?"☑":"☐")+" "+L[i]+'.</span><span>'+mk(o)+"</span></div>").join("");}
 else if(it.type==="jodoh"){
  h='<div class="tw"><table class="t"><thead><tr><th>Pilihan di kolom kanan</th></tr></thead><tbody>'+it.right.map((r,i)=>"<tr><td><b>"+L[i]+".</b> "+mk(r)+"</td></tr>").join("")+"</tbody></table></div>";
  h+=it.left.map((l,i)=>{const v=a?a[i]:null;
   return '<div class="row"><div class="txt"><b>'+(i+1)+".</b> "+mk(l)+"</div><select "+dis+' data-act="jodoh" data-k="'+i+'"><option value="">– pilih –</option>'+it.right.map((r,j)=>'<option value="'+j+'"'+(v===j?" selected":"")+">"+L[j]+"</option>").join("")+"</select>"+mark(v===k[i],L[k[i]])+"</div>";}).join("");}
 else if(it.type==="urut"){
  h='<div class="tw"><table class="t"><tbody>'+it.items.map((r,i)=>"<tr><td><b>("+L[i]+")</b> "+mk(r)+"</td></tr>").join("")+"</tbody></table></div><p class='small'>Pilih huruf untuk tiap urutan (1 = paling awal).</p>";
  h+=it.items.map((_,i)=>{const v=a?a[i]:null;
   return '<div class="row"><div class="txt"><b>Urutan ke-'+(i+1)+"</b></div><select "+dis+' data-act="urut" data-k="'+i+'"><option value="">– pilih –</option>'+it.items.map((r,j)=>'<option value="'+j+'"'+(v===j?" selected":"")+">"+L[j]+"</option>").join("")+"</select>"+mark(v===k[i],L[k[i]])+"</div>";}).join("");
  if(a){const used=a.filter(x=>x!=null);if(new Set(used).size!==used.length)h+='<div class="warn">Ada huruf yang dipakai lebih dari satu kali. Periksa kembali urutanmu.</div>';}}
 else if(it.type==="bs"){
  h='<div class="tw"><table class="t"><thead><tr><th>No</th><th>Pernyataan</th></tr></thead><tbody>'+it.stmts.map((s,i)=>"<tr><td>"+(i+1)+"</td><td>"+mk(s)+"</td></tr>").join("")+"</tbody></table></div>";
  h+=it.stmts.map((s,i)=>{const v=a?a[i]:null;
   return '<div class="row"><div class="txt"><b>Pernyataan '+(i+1)+'</b></div><div class="bsb"><button '+dis+' class="'+(v===true?"on":"")+'" data-act="bs" data-k="'+i+'" data-v="1">Benar</button><button '+dis+' class="'+(v===false?"on":"")+'" data-act="bs" data-k="'+i+'" data-v="0">Salah</button></div>'+mark(v===k[i],k[i]?"Benar":"Salah")+'</div>';}).join("");}
 return h;}

function instr(it){
 return {pg:"Pilih satu jawaban yang paling tepat.",pgk:"Pilih SEMUA jawaban yang benar (lebih dari satu).",jodoh:"Pasangkan setiap pernyataan dengan satu pilihan. Ada pilihan yang tidak terpakai.",urut:"Susun urutan yang benar dengan memilih huruf pada tiap urutan.",bs:"Tentukan setiap pernyataan Benar atau Salah."}[it.type];}
function badges(it){let h='<span class="badge b-bt">'+BNAMA[it.type]+'</span><span class="badge b-lv">'+it.level+"</span>";
 if(it.la.indexOf("Literasi")>=0)h+='<span class="badge b-lit">LITERASI</span>';
 if(it.la.indexOf("Numerasi")>=0)h+='<span class="badge b-num">NUMERASI</span>';return h;}
function qcard(it,ro,fb,show){
 return '<div class="card qcard"><div class="qhead"><span class="qno">Soal '+it.no+' <span class="small">/ '+N+'</span></span><span>'+badges(it)+'</span></div><p class="instr">'+instr(it)+" (skor maks "+it.maks+")</p>"+blocks(it.stim)+(it.q?'<p class="q">'+mk(it.q)+"</p>":"")+widget(it,ro,show)+(fb?feedback(it):"")+"</div>";}
