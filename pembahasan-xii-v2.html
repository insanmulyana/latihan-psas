<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pembahasan Latihan PSAS Ganjil – Informatika XII – Versi 2</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1f2937;--mut:#64748b;--line:#d9dee5;--pri:#0f766e;--pri2:#115e59;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--part:#b45309;--partbg:#fef3c7;--sel:#e0f2fe;--selb:#0284c7;--code:#0f172a;--codebg:#f1f5f9}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--ink:#e2e8f0;--mut:#94a3b8;--line:#334155;--pri:#2dd4bf;--pri2:#5eead4;--ok:#86efac;--okbg:#14532d;--bad:#fca5a5;--badbg:#7f1d1d;--part:#fcd34d;--partbg:#78350f;--sel:#0c4a6e;--selb:#38bdf8;--code:#e2e8f0;--codebg:#0b1220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:12px}
header.top{background:var(--pri);color:#fff;padding:12px 16px;border-radius:10px;margin-bottom:12px}
header.top h1{margin:0;font-size:18px}
header.top small{opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:bold;margin:10px 0 4px}
input[type=text],input[type=number],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:var(--card);color:var(--ink)}
button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:8px;border:1px solid var(--line);padding:9px 14px;background:var(--card);color:var(--ink)}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.pri:hover{background:var(--pri2)}
button:disabled{opacity:.5;cursor:not-allowed}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.timer{font-weight:bold;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin:8px 0}
.grid button{padding:6px 0;font-size:13px;position:relative}
.grid button.done{background:var(--sel);border-color:var(--selb)}
.grid button.cur{outline:2px solid var(--pri);font-weight:bold}
.grid button.flag::after{content:"⚑";position:absolute;top:-6px;right:-2px;font-size:11px;color:var(--bad)}
.grid button.ok{background:var(--okbg);border-color:var(--ok)}
.grid button.bad{background:var(--badbg);border-color:var(--bad)}
.grid button.part{background:var(--partbg);border-color:var(--part)}
.badge{display:inline-block;font-size:11px;font-weight:bold;padding:2px 8px;border-radius:99px;margin-right:4px;color:#fff;vertical-align:middle}
.b-lit{background:#2563eb}.b-num{background:#ea580c}.b-lv{background:#64748b}.b-bt{background:#7c3aed}
.qhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.qno{font-size:20px;font-weight:bold;color:var(--pri)}
.instr{font-size:13px;color:var(--mut);margin:0 0 8px;font-style:italic}
.q{font-weight:bold;margin:10px 0}
table.t{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:#ededed;color:#111}
@media (prefers-color-scheme:dark){table.t th{background:#334155;color:#e2e8f0}}
.tw{overflow-x:auto}
pre{background:var(--codebg);color:var(--code);padding:10px;border-radius:8px;overflow-x:auto;font-size:13px;line-height:1.4;margin:8px 0;border:1px solid var(--line)}
code{font-family:Consolas,Menlo,monospace}
.box{border:1px solid var(--line);border-left:5px solid var(--pri);background:var(--codebg);border-radius:6px;padding:8px 12px;margin:8px 0;font-size:14px}
.boxt{font-weight:bold;color:var(--pri);margin-bottom:4px}
.chat{background:var(--codebg);border-radius:10px;padding:8px;margin:8px 0}
.chat .ct{font-weight:bold;color:var(--pri);padding:4px 8px}
.msg{background:var(--card);border-radius:10px;padding:6px 10px;margin:6px 0;max-width:92%;border:1px solid var(--line)}
.msg.dev{margin-left:auto;background:#dcfce7;color:#14532d}
.msg b{display:block;font-size:12px;color:var(--pri)}
.msg.dev b{color:#166534}
.fig{margin:10px 0;text-align:center}
.fig svg{background:#fff;border-radius:8px;border:1px solid var(--line)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--selb)}
.opt.sel{background:var(--sel);border-color:var(--selb)}
.opt .l{font-weight:bold;min-width:22px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;flex-wrap:wrap}
.row .txt{flex:1 1 260px}
.row select{width:auto;min-width:120px}
.bsb{display:flex;gap:6px}
.bsb button.on{background:var(--sel);border-color:var(--selb);font-weight:bold}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap}
.status{display:inline-block;font-weight:bold;padding:3px 10px;border-radius:99px;font-size:13px}
.s-ok{background:var(--okbg);color:var(--ok)}.s-bad{background:var(--badbg);color:var(--bad)}.s-part{background:var(--partbg);color:var(--part)}.s-kos{background:var(--line);color:var(--mut)}
.score{font-size:44px;font-weight:bold;color:var(--pri);line-height:1}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.kv div{background:var(--codebg);border-radius:8px;padding:8px;text-align:center}
.kv b{display:block;font-size:20px}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--pri)}
textarea{width:100%;height:80px;font-family:Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card);color:var(--ink)}
.small{font-size:13px;color:var(--mut)}
.warn{background:var(--partbg);color:var(--part);border-radius:8px;padding:8px 12px;font-size:14px}

/* --- proteksi & tampilan HP --- */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
body.noprint .wrap{display:none}
.bar{gap:8px}
.bar button{padding:7px 10px;font-size:14px}
.opt{min-height:46px;padding:12px}
.opt.ro{cursor:default;opacity:.85}
.opt.ro:hover{border-color:var(--line)}
.opt.ro.sel{opacity:1}
.fig svg{max-width:100%;height:auto}
.fb{margin-top:12px}
.fbmsg{border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:15px;font-weight:normal}
button.cek{width:100%;padding:12px;font-size:16px}
.nav.sticky{position:sticky;bottom:0;z-index:5;background:var(--bg);padding:8px 0 calc(8px + env(safe-area-inset-bottom));margin-top:4px}
.nav.sticky button{flex:1;padding:12px 6px}
button.flagon{background:var(--badbg);border-color:var(--bad);color:var(--bad);font-weight:bold}
.gridcard{padding:8px 12px}
.legend{margin:4px 0 0}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin:0 3px 0 8px}
.lg.done{background:var(--sel);border-color:var(--selb)}.lg.ok{background:var(--okbg);border-color:var(--ok)}.lg.part{background:var(--partbg);border-color:var(--part)}.lg.bad{background:var(--badbg);border-color:var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btnrow button{flex:1 1 140px}
.big{width:100%;padding:14px;font-size:17px;margin-top:8px}
a.btn{display:block;text-align:center;text-decoration:none;border-radius:8px;box-sizing:border-box}
a.btn.pri{background:var(--pri);color:#fff}
.emailcard{border:2px solid var(--pri)}
.hasil{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.msg-err{color:var(--bad);font-size:14px;min-height:1em}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .mbox{background:var(--card);color:var(--ink);border-radius:12px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
#modal .mbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#modal .mbtn button{flex:1;padding:12px}
#modal textarea{height:200px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:.92}
@media (max-width:600px){
 body{font-size:15px}
 .wrap{padding:8px}
 header.top{padding:10px 12px}
 header.top h1{font-size:15px}
 header.top small{font-size:12px}
 .card{padding:12px;border-radius:8px}
 .bar{padding:6px 8px;font-size:14px}
 .bar .timer{flex:1 1 100%;text-align:center}
 .bar span{flex:1}
 .qno{font-size:17px}
 table.t{font-size:13px}
 table.t th,table.t td{padding:5px 6px}
 .row .txt{flex:1 1 100%}
 .row select{width:100%;padding:10px}
 .bsb{width:100%}
 .bsb button{flex:1;padding:10px}
 .score{font-size:40px}
 .kv{grid-template-columns:repeat(4,1fr);gap:5px}
 .kv div{padding:6px 2px;font-size:12px}
 .gcol{display:none}
 pre{font-size:12px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(36px,1fr))}
 .grid button{padding:8px 0}
}
@media print{.bar,.nav,button,.emailcard{display:none}}
.pembcard{border:2px solid #7c3aed}
.pembbox{margin-top:10px;background:var(--codebg);border-left:4px solid #7c3aed;border-radius:8px;padding:10px 12px;font-size:15px}
.pembbox div+div{margin-top:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.pembtxt{line-height:1.6}
.pembtxt b{color:var(--ink)}
</style>
</head>

<script>

};
const ITEMS=[{"no": 1, "tp": "TP 4.2.1", "materi": "Pilar cloud computing dalam solusi kota", "level": "C2", "kat": "LOTS", "la": "Literasi", "type": "pg", "maks": 1, "stim": [["p", "Bacalah cerita berikut (ilustrasi)."], ["p", "Area parkir motor sekolah selalu penuh sebelum pukul 06.45 sehingga murid sering terlambat masuk kelas. Dirancang solusi 4.0: sensor di setiap petak parkir mengirim status terisi/kosong setiap menit ke server daring; data parkir satu semester diolah untuk menemukan pola jam paling ramai; model AI memprediksi kapan parkir akan penuh; lalu aplikasi menampilkan saran berangkat lebih awal atau parkir di lokasi cadangan."]], "q": "Pada rancangan solusi tersebut, peran pilar cloud computing adalah …", "opts": ["mendeteksi petak parkir yang terisi atau kosong melalui sensor di setiap petak", "mengolah data parkir satu semester untuk menemukan pola jam paling ramai", "memprediksi kapan area parkir akan penuh dari pola data", "menyimpan kiriman status parkir di server daring sehingga dapat diolah dan diakses aplikasi kapan saja", "menampilkan saran berangkat lebih awal di aplikasi sebagai aksi akhir"]}, {"no": 2, "tp": "TP 4.2.1", "materi": "Jenis pemeliharaan perangkat lunak", "level": "C2", "kat": "LOTS", "la": "-", "type": "pg", "maks": 1, "stim": [["p", "Aplikasi Kantin Daring sekolah sudah berjalan tanpa keluhan. Tiket perubahan berikut masuk ke tim pengembang."], ["box", "Tiket #21", "Kode fungsi pembayaran sangat panjang dan tanpa komentar. Pisahkan menjadi beberapa fungsi kecil, tambahkan komentar, dan buat dokumentasi agar mudah dirawat dan tidak menimbulkan masalah saat pengembang berganti."]], "q": "Jenis pemeliharaan yang sesuai untuk tiket tersebut adalah …", "opts": ["preventif, karena kode dirapikan dan didokumentasikan untuk mencegah masalah di kemudian hari", "korektif, karena aplikasi memiliki bug yang membuat pembayaran keliru", "adaptif, karena aplikasi disesuaikan dengan aturan pajak yang baru", "perfektif, karena aplikasi ditamb kan hanya n − 1 buah", "baris 2, nilai awal jumlah diubah menjadi daftar_lembap[n]", "baris 3, batas perulangan menjadi SAMPAI n agar data terakhir terhitung", "baris 4, penjumlahan memakai daftar_lembap[i − 1] agar urutan data bergeser"]}, {"no": 5, "tp": "TP 4.2.2", "materi": "Desk-check dengan tabel jejak", "level": "C3", "kat": "MOTS", "la": "Numerasi", "type": "pg", "maks": 1, "stim": [["p", "Algoritma berikut menghitung banyak data sensor yang berada di bawah ambang."], ["code", "hitung ← 0\nUNTUK i DARI 1 SAMPAI 6 LAKUKAN\n  JIKA data[i] < ambang MAKA\n    hitung ← hitung + 1\n  AKHIR JIKA\nAKHIR UNTUK\nTULIS hitung"], ["p", "Desk-check dilakukan dengan data = [21, 18, 25, 25, 30, 17] dan ambang = 25."]], "q": "Keluaran algoritma berdasarkan tabel jejak adalah …", "opts": ["2", "3", "4", "5", "6"]}, {"no": 6, "tp": "TP 4.2.2", "materi": "Flowchart percabangan", "level": "C3", "kat": "MOTS", "la": "-", "type": "pg", "maks": 1, "stim": [["p", "Penyiram tanaman otomatis memakai aturan: kelembapan tanah < 40 → \"SIRAM\"; selain itu → \"CUKUP\". Perhatikan flowchart yang dibuat sebuah kelompok."], ["img", "v2_fc6", "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 470' width='100%' style='max-width:600px' role='img' font-family='Arial,Helvetica,sans-serif'><defs><marker id='b6' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2937'/></marker></defs><rect x='85.0' y='20' width='130' height='40' rx='20' fill='#e8f0fe' stroke='#1f2937' stroke-width='2'/><text x='150' y='45' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>Mulai</text><line x1='150' y1='60' x2='150' y2='88' stroke='#1f2937' stroke-width='2' marker-end='url(#b6)'/><polygon points='53.0,90 283.0,90 247.0,134 17.0,134' fill='#fef9c3' stroke='#1f2937' stroke-width='2'/><text x='150' y='117' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>Masukkan kelembapan</text><line x1='150' y1='134' x2='150' y2='165' stroke='#1f2937' stroke-width='2' marker-end='url(#b6)'/><polygon points='150,167.0 250.0,212 150,257.0 50.0,212' fill='#fee2e2' stroke='#1f2937' stroke-width='2'/><text x='150' y='217' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>kelembapan ≤ 40 ?</text><line x1='250' y1='212' x2='320' y2='212' stroke='#1f2937' stroke-width='2' marker-end='url(#b6)'/><text x='285' y='202' font-size='14' text-anchor='middle' font-weight='bold' fill='#15803d'>Ya</text><polygon points='348.0,190 568.0,190 532.0,234 312.0,234' fill='#fef9c3' stroke='#1f2937' stroke-width='2'/><text x='440' y='217' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>Tampilkan &quot;SIRAM&quot;</text><line x1='150' y1='257' x2='150' y2='300' stroke='#1f2937' stroke-width='2' marker-end='url(#b6)'/><text x='172' y='285' font-size='14' text-anchor='start' font-weight='bold' fill='#b91c1c'>Tidak</text><polygon points='58.0,302 278.0,302 242.0,346 22.0,346' fill='#fef9c3' stroke='#1f2937' stroke-width='2'/><text x='150' y='329' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>Tampilkan &quot;CUKUP&quot;</text><line x1='150' y1='346' x2='150' y2='380' stroke='#1f2937' stroke-width='2' marker-end='url(#b6)'/><rect x='85.0' y='380' width='130' height='40' rx='20' fill='#e8f0fe' stroke='#1f2937' stroke-width='2'/><text x='150' y='405' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>Selesai</text><polyline points='440,234 440,400 217,400' fill='none' stroke='#1f2937' stroke-width='2' marker-end='url(#b6)'/><text x='300' y='455' font-size='14' text-anchor='middle' font-weight='bold' fill='#1d4ed8'>Aturan: kelembapan &lt; 40 → &quot;SIRAM&quot;; selain itu &quot;CUKUP&quot;</text></svg>"]], "q": "Saat desk-check dengan kelembapan = 40, keluaran flowchart dan kesimpulan yang tepat adalah …", "opts": ["\"CUKUP\"; flowchart sudah sesuai dengan aturan penyiram", "\"SIRAM\"; flowchart keliru, kondisi harus menjadi kelembapan < 40", "\"SIRAM\"; flowchart sudah sesuai karena 40 termasuk tanah kering", "\"CUKUP\"; flowchart keliru karena cabang Ya dan Tidak tertukar", "tidak ada keluaran karena kelembapan 40 tidak memenuhi kedua cabang"]}, {"no": 7, "tp": "TP 4.5 (Konsep AI)", "materi": "Peran data dalam machine learning", "level": "C3", "kat": "MOTS", "la": "Numerasi", "type": "pg", "maks": 1, "stim": [["p", "Sebuah kelompok melatih model pengenal ekspresi wajah (senang, sedih, terkejut) dengan Teachable Machine. Model diuji dengan 40 foto baru yang sama pada setiap percobaan."], ["table", ["Percobaan", "Data latih per kelas", "Jawaban benar dari 40 uji"], [["1", "15 foto", "22"], ["2", "40 foto", "32"], ["3", "80 foto", "35"]], null], ["p", "Data ilustrasi."]], "q": "Kesimpulan yang paling tepat tentang peran data berdasarkan tabel tersebut adalah …", "opts": ["penambahan dari 40 ke 80 foto menaikkan akurasi lebih besar daripada dari 15 ke 40 foto", "model pasti selalu benar bila dilatih dengan 80 foto per kelas karena akurasinya tertinggi", "banyak data latih tidak berpengaruh karena model AI bekerja dengan aturan jika–maka", "akurasi naik tepat dua kali lipat ketika data latih ditambah dari 15 menjadi 80 foto", "data latih membantu model mengenali pola; akurasi naik dari 55% ke 87,5%, tetapi belum 100%"]}, {"no": 8, "tp": "TP 4.2.3", "materi": "Eksperimen jabat tangan", "level": "C3", "kat": "MOTS", "la": "Numerasi", "type": "pg", "maks": 1, "stim": [["p", "Pada rapat ketua kelas, hadir n = 20 ketua kelas. Cara A: setiap ketua kelas berjabat tangan dengan semua ketua kelas lain tepat satu kali. Cara B: setiap ketua kelas selain ketua OSIS hanya menyalami ketua OSIS (ketua OSIS termasuk dalam 20 orang tersebut)."]], "q": "Banyak jabat tangan pada Cara A dan Cara B berturut-turut adalah …", "opts": ["190 dan 19", "190 dan 20", "380 dan 19", "400 dan 20", "200 dan 19"]}, {"no": 9, "tp": "TP 4.5 (IoT/Robotika)", "materi": "Konversi nilai sensor analog", "level": "C3", "kat": "MOTS", "la": "Numerasi", "type": "pg", "maks": 1, "stim": [["p", "Sensor suhu terhubung ke pin analog Arduino UNO yang membaca nilai 0–1023. Tegangan dihitung dengan rumus berikut."], ["box", "Rumus", "tegangan = (nilai ÷ 1023) × 5 volt"], ["p", "Pada siang hari, Arduino membaca nilai 818 dari sensor."]], "q": "Tegangan yang terbaca pada sensor (dibulatkan satu desimal) adalah …", "opts": ["0,8 volt", "2,5 volt", "3,2 volt", "4,0 volt", "8,2 volt"]}, {"no": 10, "tp": "TP 4.2.3", "materi": "Penyempurnaan perfektif v1.1 → v1.2", "level": "C4", "kat": "HOTS", "la": "Numerasi", "type": "pg", "maks": 1, "stim": [["p", "Sensor kualitas udara kelas mengirim 1 data setiap 6 menit selama 8 jam, jadi ada n = 80 data per hari. Setiap kali data baru datang, sistem menampilkan rata-rata kumulatif."], ["table", ["Versi", "Cara menghitung jumlah setiap kali data baru datang"], [["v1.1", "menjumlah ulang dari data pertama sampai data terbaru (1 + 2 + … + n penjumlahan)"], ["v1.2", "menyimpan jumlah berjalan, lalu cukup menambahkan data terbaru (1 penjumlahan per data)"]], null]], "q": "Kesimpulan yang tepat tentang kedua versi untuk data satu hari adalah …", "opts": ["v1.2 lebih efisien: 80 penjumlahan dibanding 6.400 pada v1.1, dengan keluaran yang sama", "v1.1 lebih efisien karena menjumlah ulang dari data pertama sehingga hasilnya lebih teliti", "v1.2 lebih efisien: 80 penjumlahan dibanding 3.240 pada v1.1, dengan keluaran yang sama", "kedua versi sama efisien karena keluaran rata-rata kumulatifnya sama persis", "v1.2 lebih efisien karena barisnya lebih sedikit, walaupun keluaran rekapnya berbeda"]}, {"no": 11, "tp": "TP 4.2.4", "materi": "Memilih strategi algoritmik", "level": "C3", "kat": "MOTS", "la": "-", "type": "pg", "maks": 1, "stim": [["p", "Kartu Permintaan Klien (Tema Perpustakaan): “Petugas ingin mencari data anggota berdasarkan nomor anggota. Ada 1.200 anggota dan daftarnya sudah terurut menurut nomor anggota.”"]], "q": "Strategi algoritmik yang paling tepat untuk fitur tersebut adalah …", "opts": ["greedy, karena aplikasi selalu memilih anggota yang paling sering meminjam buku", "pencarian beruntun, karena memeriksa satu per satu paling cepat untuk daftar terurut", "merge sort, karena daftar anggota harus dibagi dua lalu digabungkan sebelum dicari", "pencarian biner, karena daftar nomor sudah terurut dan dapat dibagi dua tiap langkah", "brute force, karena semua kemungkinan nomor anggota harus dicoba"]}, {"no": 12, "tp": "TP 4.2.4", "materi": "Langkah pencarian biner", "level": "C3", "kat": "MOTS", "la": "Numerasi", "type": "pg", "maks": 1, "stim": [["p", "Kartu Permintaan Klien (Tema Kesehatan): klinik ingin mencari rekam medis dengan cepat dari 5.000 nomor pasien yang sudah terurut. Kelompok memilih pencarian biner."]], "q": "Paling banyak berapa kali nomor pasien diperiksa sampai data ditemukan atau dipastikan tidak ada?", "opts": ["12 kali", "13 kali", "14 kali", "2.500 kali", "5.000 kali"]}, {"no": 13, "tp": "TP 4.2.4", "materi": "Analisis kegagalan uji regresi", "level": "C4", "kat": "HOTS", "la": "-", "type": "pg", "maks": 1, "stim": [["p", "Fitur baru Kamus Sunda Digital v2.0 mencari kata memakai pencarian biner. Daftar kata[1..n] sudah terurut abjad."], ["code", "kiri ← 1\nkanan ← n\nSELAMA kiri ≤ kanan LAKUKAN\n  tengah ← (kiri + kanan) DIV 2\n  JIKA kata[tengah] = dicari MAKA KEMBALIKAN tengah\n  JIKA kata[tengah] < dicari MAKA kanan ← tengah − 1\n  SELAIN ITU kiri ← tengah + 1\nAKHIR SELAMA\nKEMBALIKAN \"tidak ditemukan\""], ["p", "Pada uji regresi, hanya kasus “kata yang tepat berada di tengah daftar” yang lulus; kasus lain menghasilkan \"tidak ditemukan\"."]], "q": "Penyebab kegagalan uji regresi tersebut adalah …", "opts": ["daftar kata belum terurut sehingga pencarian biner tidak dapat dipakai", "nilai awal kanan seharusnya n − 1 agar indeks tidak melewati batas", "kondisi perulangan harus kiri < kanan agar pencarian berhenti lebih cepat", "perhitungan tengah harus dibulatkan ke atas agar kata di tengah terbaca", "arah pergeseran tertukar: bila kata[tengah] < dicari, seharusnya kiri ← tengah + 1"]}, {"no": 14, "tp": "TP 4.5 (IoT/Robotika)", "materi": "Menentukan ambang cahaya", "level": "C3", "kat": "MOTS", "la": "Numerasi", "type": "pg", "maks": 1, "stim": [["p", "Sebuah kelompok membaca nilai sensor suhu pada tiga kondisi ruangan (semakin panas, semakin besar nilainya)."], ["table", ["Kondisi ruangan", "Sejuk", "Hangat", "Panas"], [["Nilai sensor", "280", "410", "620"]], null], ["p", "Kipas harus menyala ketika ruangan hangat atau panas dan padam ketika sejuk. Potongan kode Arduino:"], ["code", "if ( ……… ) {\n  digitalWrite(KIPAS, HIGH); // kipas menyala\n} else {\n  digitalWrite(KIPAS, LOW);  // kipas padam\n}"]], "q": "Kondisi yang tepat untuk mengisi bagian titik-titik adalah …", "opts": ["nilai > 350", "nilai < 350", "nilai > 500", "nilai < 300", "nilai == 410"]}, {"no": 15, "tp": "TP 4.2.5", "materi": "Membaca dokumentasi fungsi modul AI", "level": "C3", "kat": "MOTS", "la": "Literasi", "type": "pg", "maks": 1, "stim": [["p", "Bacalah dokumentasi fungsi modul AI berikut (dokumentasi ilustratif)."], ["box", "baca_kuitansi(foto) → (nominal, keyakinan)", "Parameter : foto kuitansi pembayaran, maksimal 5 MB.\nKeluaran : nominal yang terbaca dan keyakinan 0,0–1,0.\nCatatan : akurasi dapat turun pada tulisan tangan dan foto buram. Disarankan ambang keyakinan ≥ 0,90. Hasil di bawah ambang sebaiknya diperiksa bendahara."], ["p", "Bendahara kelas mengunggah foto kuitansi tulisan tangan yang agak buram. Modul membaca nominal Rp75.000 dengan keyakinan 0,62."]], "q": "Tindakan program yang paling tepat sesuai dokumentasi adalah …", "opts": ["mencatat Rp75.000 otomatis karena nominal sudah terbaca oleh modul", "menghapus foto karena tulisan tangan tidak dapat dibaca AI", "meneruskan hasil ke bendahara untuk diperiksa karena keyakinan di bawah ambang 0,90", "mengubah ambang menjadi 0,6 agar semua kuitansi dicatat otomatis", "mencatat nominal Rp0 karena keyakinan belum mencapai 1,0"]}, {"no": 16, "tp": "TP 4.2.5", "materi": "Akurasi modul NLP", "level": "C3", "kat": "MOTS", "la": "Numerasi", "type": "pg", "maks": 1, "stim": [["p", "Tabel berikut adalah hasil modul NLP yang memilah komentar pada video profil sekolah (data ilustratif)."], ["table", ["No", "Teks komentar", "Label modul", "Keyakinan", "Label sebenarnya"], [["1", "Sekolahnya keren, gurunya inspiratif!", "positif", "0,95", "positif"], ["2", "Videonya buram dan suaranya kecil.", "negatif", "0,84", "negatif"], ["3", "Pendaftaran dibuka bulan apa?", "positif", "0,51", "netral"], ["4", "Bangga jadi alumni Kartika!", "positif", "0,92", "positif"], ["5", "Lumayan lah.", "negatif", "0,57", "netral"], ["6", "Parah, parkirnya sempit pisan.", "negatif", "0,88", "negatif"], ["7", "Ekskulnya banyak, mantap.", "positif", "0,90", "positif"], ["8", "Henteu resep, musikna ganggu.", "positif", "0,49", "negatif"]], null]], "q": "Akurasi modul pada kedelapan komentar tersebut adalah …", "opts": ["37,5%", "50,0%", "62,5%", "75,0%", "87,5%"]}, {"no": 17, "tp": "TP 4.5 (Konsep AI)", "materi": "Peluang dan tantangan AI", "level": "C2", "kat": "LOTS", "la": "Literasi", "type": "pg", "maks": 1, "stim": [["p", "Bacalah teks berikut (ilustrasi)."], ["p", "Kelompok tani teh di Pangalengan mulai memakai drone berkamera. Modul AI menganalisis foto kebun dan menandai petak yang daunnya terserang hama, sehingga penyemprotan cukup dilakukan pada petak tersebut. Sebelumnya, petani berkeliling kebun berhari-hari dan sering terlambat menemukan hama. Kini petani perlu belajar menerbangkan drone dan membaca peta hasil AI, sementara foto kebun dan data panen disimpan di server koperasi."]], "q": "Pasangan peluang dan tantangan penerapan AI yang paling tepat berdasarkan teks tersebut adalah …", "opts": ["hama ditemukan lebih cepat — petani tidak perlu belajar hal baru", "panen pasti berlipat ganda — AI tidak memerlukan data kebun", "hama ditemukan lebih cepat dan penyemprotan lebih tepat sasaran — petani perlu belajar teknologi baru dan data kebun perlu dijaga", "drone menggantikan seluruh petani — biaya perawatan kebun menjadi nol", "hasil AI selalu benar — peta hama tidak perlu dicek oleh petani"]}, {"no": 18, "tp": "TP 4.5 (Library AI)", "materi": "Alur kerja modul AI", "level": "C2", "kat": "LOTS", "la": "-", "type": "pg", "maks": 1, "stim": [["p", "Perhatikan alur kerja aplikasi Pengenal Angka Tulisan Tangan berikut. Satu komponen sengaja dikosongkan."], ["img", "v2_pipe", "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 380 462' width='100%' style='max-width:380px' role='img' font-family='Arial,Helvetica,sans-serif'><defs><marker id='b18' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2937'/></marker></defs><rect x='10' y='8' width='360' height='86' rx='10' fill='#fff7ed' stroke='#c2410c' stroke-width='2'/><text x='190.0' y='34' font-size='18' text-anchor='middle' font-weight='bold' fill='#1f2937'>(1)</text><text x='190.0' y='78' font-size='36' text-anchor='middle' font-weight='bold' fill='#c2410c'>?</text><line x1='190.0' y1='96' x2='190.0' y2='126' stroke='#1f2937' stroke-width='2' marker-end='url(#b18)'/><rect x='10' y='128' width='360' height='86' rx='10' fill='#e8f0fe' stroke='#1f2937' stroke-width='2'/><text x='190.0' y='154' font-size='18' text-anchor='middle' font-weight='bold' fill='#1f2937'>(2) Model terlatih</text><text x='190.0' y='186' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>Mencocokkan pola tulisan dengan data latih</text><line x1='190.0' y1='216' x2='190.0' y2='246' stroke='#1f2937' stroke-width='2' marker-end='url(#b18)'/><rect x='10' y='248' width='360' height='86' rx='10' fill='#e8f0fe' stroke='#1f2937' stroke-width='2'/><text x='190.0' y='274' font-size='18' text-anchor='middle' font-weight='bold' fill='#1f2937'>(3) Label + skor</text><text x='190.0' y='306' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>“7” 0,88</text><line x1='190.0' y1='336' x2='190.0' y2='366' stroke='#1f2937' stroke-width='2' marker-end='url(#b18)'/><rect x='10' y='368' width='360' height='86' rx='10' fill='#e8f0fe' stroke='#1f2937' stroke-width='2'/><text x='190.0' y='394' font-size='18' text-anchor='middle' font-weight='bold' fill='#1f2937'>(4) Aksi aplikasi</text><text x='190.0' y='426' font-size='17' text-anchor='middle' font-weight='normal' fill='#1f2937'>Angka 7 tampil di kolom nilai</text></svg>"]], "q": "Komponen yang tepat untuk mengisi kotak (1) adalah …", "opts": ["nilai ambang keyakinan 0,80 pada kode program", "kamera memotret angka yang ditulis tangan di kertas", "tulisan “Angka 7 tampil di kolom nilai”", "tautan model hasil ekspor dari Teachable Machine", "label \"7\" dengan skor keyakinan 0,88"]}, {"no": 19, "tp": "TP 4.5 (Library AI)", "materi": "Mengatasi masalah integrasi model", "level": "C4", "kat": "HOTS", "la": "-", "type": "pg", "maks": 1, "stim": [["p", "Saat praktikum Lab AI Mini, kelompok menguji pemilah sampah. Ketika kertas diarahkan ke kamera, di bawah video muncul “Kertas 95%”, tetapi pesan “Masukkan ke TEMPAT KALENG” juga ikut muncul. Berikut bagian kode yang diisi kelompok."], ["code", "let ambang = 0.8;\n...\nif (label == \"Kaleng\" || confidence >= ambang) {\n  fill(0, 150, 0); textSize(36);\n  text(\"Masukkan ke TEMPAT KALENG\", 20, 60);\n}"]], "q": "Penyebab yang paling mungkin dari masalah tersebut adalah …", "opts": ["ambang 0.8 terlalu rendah sehingga harus diubah menjadi 80", "operator || membuat pesan muncul bila salah satu syarat terpenuhi; seharusnya && agar label dan confidence sama-sama memenuhi", "model belum termuat sehingga label selalu dianggap \"Kaleng\"", "kamera belum diizinkan sehingga aplikasi menebak secara acak", "nama label \"Kaleng\" harus ditulis dengan huruf kecil semua"]}, {"no": 20, "tp": "TP 4.5 (Library AI)", "materi": "Membaca kode p5.js + ml5.js", "level": "C4", "kat": "HOTS", "la": "Literasi", "type": "pg", "maks": 1, "stim": [["p", "Perhatikan potongan kode aplikasi Lampu Taman Suara berikut."], ["code", "let ambang = 0.8;\n...\nif (label == \"nyala\" && confidence >= ambang) {\n  text(\"Lampu MENYALA\", 20, 60);\n}\nif (confidence >= ambang) {\n  text(\"Perintah diterima\", 20, 100);\n}"], ["p", "Seorang murid mengucapkan “nyala”. Model mengeluarkan label \"nyala\" dengan confidence 0.9."]], "q": "Reaksi aplikasi berdasarkan kode tersebut adalah …", "opts": ["hanya muncul “Lampu MENYALA” karena kondisi kedua tidak diperiksa lagi", "hanya muncul “Perintah diterima” karena kondisi kedua ditulis paling akhir", "tidak muncul tulisan apa pun karena confidence 0.9 belum mencapai 1", "muncul “Lampu MENYALA” dan “Perintah diterima” karena kedua kondisi if terpenuhi", "aplikasi berhenti dengan pesan error karena ada dua perintah text"]}, {"no": 21, "tp": "TP 4.5 (Konsep AI)", "materi": "Penerapan AI dalam kehidupan sehari-hari", "level": "C3", "kat": "MOTS", "la": "Literasi", "type": "pgk", "maks": 2, "stim": [["p", "Bacalah catatan kegiatan sebuah keluarga di Bandung pada akhir pekan (ilustrasi)."], ["p", "(a) Kakak menerjemahkan menu berbahasa Jepang dengan memotretnya di aplikasi penerjemah. (b) Lampu jalan di depan rumah menyala karena sensor cahaya membaca gelap. (c) Ayah membuka kunci HP dengan memindai wajah. (d) AC menjaga suhu kamar tetap 24 °C sesuai angka yang disetel. (e) Aplikasi belanja menampilkan rekomendasi produk berdasarkan riwayat belanja Ibu."]], "q": "Kegiatan yang memanfaatkan kecerdasan artifisial (AI) adalah … (jawaban benar lebih dari satu)", "opts": ["kegiatan (a) menerjemahkan teks dari foto menu", "kegiatan (b) lampu jalan menyala saat sensor membaca gelap", "kegiatan (c) membuka kunci HP dengan memindai wajah", "kegiatan (d) AC menjaga suhu sesuai angka yang disetel", "kegiatan (e) rekomendasi produk dari riwayat belanja"]}, {"no": 22, "tp": "TP 4.2.2", "materi": "Detektif Bug rancangan v1.0", "level": "C3", "kat": "MOTS", "la": "-", "type": "pgk", "maks": 2, "stim": [["p", "Berikut rancangan v1.0 Pemantau Kebisingan Kantin (aturan: rata-rata ≥ ambang dianggap BISING). Desk-check memakai data daftar_db = [60, 70, 80], n = 3, dan ambang = 70."], ["code", "FUNGSI cek_bising(daftar_db, n, ambang)\n  jumlah ← 0\n  UNTUK i DARI 1 SAMPAI n − 1 LAKUKAN\n    jumlah ← jumlah + daftar_db[i]\n  AKHIR UNTUK\n  rata ← jumlah / n\n  JIKA rata > ambang MAKA\n    KEMBALIKAN \"BISING\"\n  SELAIN ITU\n    KEMBALIKAN \"TENANG\"\n  AKHIR JIKA\nAKHIR FUNGSI"]], "q": "Pernyataan yang benar tentang rancangan tersebut adalah … (jawaban benar lebih dari satu)", "opts": ["Keluaran v1.0 untuk data uji tersebut adalah \"TENANG\", padahal harapannya \"BISING\".", "Perulangan SAMPAI n − 1 membuat data terakhir (80) tidak ikut dijumlahkan.", "Kesalahan ini termasuk kesalahan logika: program berjalan, tetapi hasilnya keliru.", "Cukup memperbaiki batas perulangan menjadi SAMPAI n, maka hasil desk-check langsung benar.", "Kesalahan pada rancangan ini termasuk kesalahan sintaks karena program tidak dapat berjalan."]}, {"no": 23, "tp": "TP 4.2.3", "materi": "O(n) dibanding O(n²)", "level": "C4", "kat": "HOTS", "la": "Numerasi", "type": "pgk", "maks": 2, "stim": [["p", "Dua algoritma dipakai untuk mencari nilai ujian yang sama (ganda). Algoritma P membandingkan setiap pasangan data (perulangan bersarang). Algoritma Q bekerja pada data yang sudah terurut dan cukup membandingkan setiap data dengan data di sebelahnya."], ["table", ["Banyak data (n)", "Langkah P = n(n − 1)/2", "Langkah Q = n − 1"], [["50", "1.225", "49"], ["500", "124.750", "499"], ["5.000", "12.497.500", "4.999"]], null]], "q": "Pernyataan yang benar berdasarkan tabel tersebut adalah … (jawaban benar lebih dari satu)", "opts": ["Algoritma Q dapat langsung dipakai pada data acak tanpa langkah tambahan apa pun.", "Saat n naik 10 kali (500 → 5.000), langkah P naik sekitar 100 kali.", "Untuk n = 5.000, langkah P sekitar 2.500 kali langkah Q.", "Untuk n = 50, selisih langkah kedua algoritma sudah lebih dari 10.000.", "Pola pertumbuhan langkah P adalah O(n²), sedangkan Q adalah O(n)."]}, {"no": 24, "tp": "TP 4.2.4", "materi": "Changelog dan uji regresi", "level": "C4", "kat": "HOTS", "la": "Literasi", "type": "pgk", "maks": 2, "stim": [["p", "Bacalah changelog berikut (ilustrasi)."], ["box", "Changelog Kantin Daring", "v1.4 — adaptif: menyesuaikan perhitungan pajak dengan tarif baru dari pemerintah.\nv2.0 — fitur baru: pencarian menu berdasarkan nama (pencarian biner).\nHasil uji regresi v2.0: lulus 15 dari 16 kasus uji lama; kasus \"keranjang kosong\" membuat aplikasi berhenti."]], "q": "Pernyataan yang benar berdasarkan changelog tersebut adalah … (jawaban benar lebih dari satu)", "opts": ["Persentase kasus uji regresi yang lulus adalah 93,75%.", "Perubahan v1.4 termasuk pemeliharaan adaptif karena menyesuaikan aturan dari luar sistem.", "v2.0 layak dirilis karena hanya satu kasus uji yang gagal.", "Kasus yang gagal harus diperbaiki, lalu seluruh uji regresi diulang sebelum rilis.", "Changelog hanya perlu ditulis ketika aplikasi memiliki bug."]}, {"no": 25, "tp": "TP 4.2.5", "materi": "Keterbatasan, bias, dan privasi", "level": "C2", "kat": "LOTS", "la": "Literasi", "type": "pgk", "maks": 2, "stim": [["p", "Bacalah dokumentasi modul pembaca pelat nomor di gerbang parkir sekolah berikut (dokumentasi ilustratif)."], ["box", "kenali_plat(foto) → (nomor, keyakinan)", "Model dilatih dengan 2.000 foto pelat nomor kendaraan berkode D yang diambil pada siang hari.\nAkurasi dapat turun pada malam hari dan pada pelat dari luar daerah.\nFoto kendaraan dihapus setelah 24 jam; hanya nomor dan jam masuk yang disimpan.\nArahkan kamera ke pelat nomor, bukan ke wajah pengendara."]], "q": "Pernyataan yang merupakan keterbatasan atau risiko etis sesuai dokumentasi tersebut adalah … (jawaban benar lebih dari satu)", "opts": ["Modul pasti benar untuk semua pelat nomor di Indonesia.", "Pelat dari luar daerah dapat salah dikenali karena jarang ada di data latih.", "Foto kendaraan disimpan selamanya sehingga server cepat penuh.", "Pembacaan pelat dapat keliru pada malam hari.", "Kamera yang menyorot wajah pengendara dapat merekam data pribadi."]}, {"no": 26, "tp": "TP 4.2.6", "materi": "Rancangan integrasi v3.0", "level": "C4", "kat": "HOTS", "la": "-", "type": "pgk", "maks": 2, "stim": [["p", "Berikut rancangan integrasi Lampu Lorong Pintar v3.0 yang memakai modul pengenal suara."], ["code", "gerak ← baca_PIR()\nJIKA gerak = 1 MAKA\n  rekaman ← rekam_suara(3 detik)\n  label, keyakinan ← kenali_suara(rekaman)  // \"langkah\", \"kucing\", \"angin\"\n  JIKA keyakinan ≥ 0,75 DAN label = \"langkah\" MAKA\n    nyalakan_lampu()\n  SELAIN ITU JIKA keyakinan < 0,75 MAKA\n    kirim_notifikasi_satpam()\n  AKHIR JIKA\n  hapus(rekaman)\nAKHIR JIKA"]], "q": "Pernyataan yang benar tentang rancangan tersebut adalah … (jawaban benar lebih dari satu)", "opts": ["Bila label \"kucing\" dengan keyakinan 0,90, lampu tidak menyala dan notifikasi tidak dikirim.", "Modul AI dipanggil terus-menerus walaupun sensor PIR tidak mendeteksi gerakan.", "Bila label \"langkah\" dengan keyakinan 0,70, satpam menerima notifikasi.", "Rekaman suara disimpan untuk melatih ulang model.", "Notifikasi kepada satpam berperan sebagai jalur cadangan ketika AI tidak yakin."]}, {"no": 27, "tp": "TP 4.5 (Library AI)", "materi": "Pratinjau skor Teachable Machine", "level": "C3", "kat": "MOTS", "la": "Numerasi", "type": "pgk", "maks": 2, "stim": [["p", "Pada demonstrasi Teachable Machine, sebuah benda diarahkan ke kamera dan pratinjau skor berikut muncul. Ambang aplikasi ditetapkan 0,85."], ["img", "v2_tm", "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 570 226' width='100%' style='max-width:570px' role='img' font-family='Arial,Helvetica,sans-serif'><defs><marker id='b27' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1f2937'/></marker></defs><rect x='5' y='5' width='560' height='216' rx='10' fill='#ffffff' stroke='#cbd5e1' stroke-width='2'/><text x='25' y='38' font-size='17' text-anchor='start' font-weight='bold' fill='#1f2937'>Preview — Pemilah Sampah Taman</text><text x='545' y='38' font-size='14' text-anchor='end' font-weight='normal' fill='#64748b'>Output</text><text x='25' y='85' font-size='16' text-anchor='start' font-weight='normal' fill='#1f2937'>Organik</text><rect x='120' y='64' width='420' height='30' fill='#eef2f7'/><rect x='120' y='64' width='344.4' height='30' fill='#22c55e'/><text x='456.4' y='85' font-size='15' text-anchor='end' font-weight='bold' fill='#ffffff'>82%</text><text x='25' y='137' font-size='16' text-anchor='start' font-weight='normal' fill='#1f2937'>Kertas</text><rect x='120' y='116' width='420' height='30' fill='#eef2f7'/><rect x='120' y='116' width='46.2' height='30' fill='#ec4899'/><text x='174.2' y='137' font-size='15' text-anchor='start' font-weight='bold' fill='#1f2937'>11%</text><text x='25' y='189' font-size='16' text-anchor='start' font-weight='normal' fill='#1f2937'>Plastik</text><rect x='120' y='168' width='420' height='30' fill='#eef2f7'/><rect x='120' y='168' width='29.4' height='30' fill='#8b5cf6'/><text x='157.4' y='189' font-size='15' text-anchor='start' font-weight='bold' fill='#1f2937'>7%</text></svg>"]], "q": "Pernyataan yang benar berdasarkan pratinjau tersebut adalah … (jawaban benar lebih dari satu)", "opts": ["Label dengan skor tertinggi adalah Organik.", "Dengan ambang 0,85, aplikasi menjalankan aksi untuk Organik.", "Selisih skor Organik dan Kertas adalah 71 poin persen.", "Jumlah skor ketiga label adalah 100%.", "Bila ambang diturunkan menjadi 0,80, aksi untuk Kertas dijalankan."]}, {"no": 28, "tp": "TP 4.5 (IoT/Robotika)", "materi": "Sensor dan aktuator", "level": "C2", "kat": "LOTS", "la": "-", "type": "pgk", "maks": 2, "stim": [["p", "Sebuah kit Arduino berisi komponen berikut: (a) sensor kelembapan tanah, (b) pompa air mini, (c) buzzer, (d) sensor ultrasonik, dan (e) motor servo."]], "q": "Komponen yang termasuk aktuator adalah … (jawaban benar lebih dari satu)", "opts": ["(a) sensor kelembapan tanah", "(b) pompa air mini", "(c) buzzer", "(d) sensor ultrasonik", "(e) motor servo"]}, {"no": 29, "tp": "TP 4.5 (Konsep AI)", "materi": "Konsep dasar AI", "level": "C2", "kat": "LOTS", "la": "-", "type": "jodoh", "maks": 2, "stim": [["p", "Pasangkan setiap istilah di kolom kiri dengan penjelasan yang paling tepat di kolom kanan."]], "q": "", "left": ["Kecerdasan artifisial (AI)", "Model terlatih", "Label", "Skor keyakinan"], "right": ["angka 0–1 yang menunjukkan seberapa yakin model terhadap hasil pengenalannya", "kemampuan mesin meniru kecerdasan manusia, misalnya memahami, belajar, dan mengambil keputusan", "hasil proses belajar yang dipakai untuk mengenali data baru", "aturan jika–maka yang ditulis pemrogram satu per satu tanpa belajar dari data", "nama kategori hasil pengenalan, misalnya \"Botol\" atau \"Kertas\""]}, {"no": 30, "tp": "TP 4.2.4", "materi": "Permintaan klien dan strategi algoritmik", "level": "C3", "kat": "MOTS", "la": "-", "type": "jodoh", "maks": 2, "stim": [["p", "Pasangkan setiap Kartu Permintaan Klien di kolom kiri dengan strategi algoritmik yang paling sesuai di kolom kanan."]], "q": "", "left": ["Panitia ingin memastikan nama seorang tamu ada di daftar hadir yang urutannya acak.", "Kasir ingin memberi kembalian dengan selalu memilih pecahan uang terbesar yang masih muat.", "Murid ingin mencari arti sebuah kata dalam kamus digital yang sudah terurut abjad.", "Teknisi ingin membuka gembok koper 3 digit yang lupa kodenya dengan mencoba 000 sampai 999."], "right": ["Brute force (mencoba semua kemungkinan)", "Pencarian biner", "Greedy", "Pencarian beruntun", "Divide and conquer (merge sort)"]}, {"no": 31, "tp": "TP 4.2.5", "materi": "Jenis modul AI dan kegunaannya", "level": "C2", "kat": "LOTS", "la": "-", "type": "jodoh", "maks": 2, "stim": [["p", "Pasangkan setiap jenis modul AI di kolom kiri dengan kegunaan yang paling sesuai di kolom kanan."]], "q": "", "left": ["Pemrosesan bahasa alami (NLP)", "Visi komputer", "Pengenal suara"], "right": ["mengenali kata “buka” yang diucapkan untuk membuka gerbang", "mendeteksi pengendara yang tidak memakai helm dari foto", "memahami pertanyaan tertulis murid pada chatbot sekolah", "mengukur jarak kendaraan dengan sensor ultrasonik"]}, {"no": 32, "tp": "TP 4.5 (IoT/Robotika)", "materi": "Fungsi komponen rangkaian", "level": "C2", "kat": "LOTS", "la": "-", "type": "jodoh", "maks": 2, "stim": [["p", "Pasangkan setiap komponen rangkaian Palang Parkir Otomatis di kolom kiri dengan fungsinya di kolom kanan."]], "q": "", "left": ["Sensor ultrasonik", "Motor servo", "Kabel jumper dan breadboard", "LED"], "right": ["memutar palang pada sudut tertentu", "menghubungkan komponen tanpa perlu disolder", "mengukur jarak benda dengan memantulkan gelombang suara", "memberi tanda cahaya bahwa palang terbuka", "membaca suhu dan kelembapan udara"]}, {"no": 33, "tp": "TP 4.2.1", "materi": "Arsitektur alur data solusi 4.0", "level": "C3", "kat": "MOTS", "la": "-", "type": "urut", "maks": 2, "stim": [["p", "Berikut kejadian pada solusi Parkir Pintar Sekolah yang disajikan secara acak."]], "q": "Urutkan kejadian tersebut sesuai alur data sensor → cloud → big data → AI → aksi.", "items": ["Data parkir satu semester diolah untuk menemukan pola jam paling ramai", "Aplikasi menampilkan saran parkir di lokasi cadangan", "Sensor di petak parkir mendeteksi motor yang masuk", "Model AI memprediksi parkir akan penuh 15 menit lagi", "Status petak parkir dikirim ke server cloud setiap menit"]}, {"no": 34, "tp": "TP 4.5 (Konsep AI)", "materi": "Sejarah perkembangan AI", "level": "C2", "kat": "LOTS", "la": "-", "type": "urut", "maks": 2, "stim": [["p", "Berikut tonggak perkembangan kecerdasan artifisial yang disajikan secara acak."]], "q": "Urutkan tonggak tersebut dari yang paling awal sampai yang paling baru.", "items": ["Asisten suara Siri hadir di ponsel pintar", "ELIZA, program percakapan (chatbot) awal, dibuat di MIT", "Istilah “Artificial Intelligence” diperkenalkan pada konferensi Dartmouth", "Komputer Deep Blue mengalahkan juara dunia catur Garry Kasparov", "AlphaGo mengalahkan pemain Go profesional Lee Sedol"]}, {"no": 35, "tp": "TP 4.2.6", "materi": "Pseudocode integrasi modul AI", "level": "C3", "kat": "MOTS", "la": "-", "type": "urut", "maks": 2, "stim": [["p", "Berikut baris-baris pseudocode integrasi Saklar Suara Kelas yang disajikan secara acak."]], "q": "Urutkan baris tersebut agar menjadi algoritma yang logis.", "items": ["label, keyakinan ← kenali_suara(rekaman)", "JIKA keyakinan ≥ 0,85 MAKA atur_lampu(label) SELAIN ITU tampilkan(\"Ulangi perintah\") AKHIR JIKA", "TUNGGU sampai suara di kelas melebihi 50 dB", "rekaman ← rekam_suara(2 detik)", "hapus(rekaman); simpan_log(label, waktu)"]}, {"no": 36, "tp": "TP 4.5 (IoT/Robotika)", "materi": "Alur sensor–proses–aktuator", "level": "C2", "kat": "LOTS", "la": "-", "type": "urut", "maks": 2, "stim": [["p", "Berikut kejadian pada palang parkir otomatis berbasis Arduino yang disajikan secara acak."]], "q": "Urutkan kejadian tersebut sesuai alur sensor–proses–aktuator.", "items": ["Motor servo memutar palang 90° sehingga palang terbuka", "Sebuah motor mendekati palang parkir", "Arduino mengirim sinyal sudut ke motor servo", "Sensor ultrasonik mengukur jarak 15 cm dan mengirimkannya ke Arduino", "Arduino membandingkan jarak 15 cm dengan batas 20 cm di dalam program"]}, {"no": 37, "tp": "TP 4.2.2", "materi": "Jenis kesalahan dan kasus uji", "level": "C2", "kat": "LOTS", "la": "-", "type": "bs", "maks": 2, "stim": [["p", "Perhatikan pernyataan tentang jenis kesalahan program dan kasus uji berikut."]], "q": "Tentukan Benar atau Salah setiap pernyataan berikut.", "stmts": ["Program yang berhenti karena indeks daftar di luar jangkauan mengalami runtime error.", "Kesalahan sintaks membuat program tetap berjalan, tetapi hasilnya keliru.", "Untuk aturan nilai ≥ 75 dinyatakan lulus, data uji nilai keliru (lampu menyala tanpa perintah)", "Tidak bereaksi"], [["0,5", "11", "4", "0"], ["0,8", "12", "0", "3"]], null]], "q": "Tentukan Benar atau Salah setiap pernyataan berikut.", "stmts": ["Akurasi pada ambang 0,5 sekitar 73%.", "Akurasi pada ambang 0,8 adalah 80%.", "Pada ambang 0,5, lampu taman pernah menyala tanpa ada perintah.", "Pada ambang 0,8 terjadi 3 reaksi keliru berupa lampu menyala tanpa perintah.", "Ambang 0,5 lebih tepat karena jumlah reaksi benarnya lebih banyak."]}, {"no": 41, "tp": "TP 4.2.1", "materi": "Konsep ide berteknologi 4.0 yang dipamerkan", "level": "C4", "kat": "HOTS", "la": "Literasi", "type": "pg", "maks": 8, "stim": [["p", "Pada gallery walk kelas, sebuah kelompok memamerkan kartu konsep ide berikut."], ["box", "Kartu Konsep Ide “Halte Pintar Bandung”", "Masalah: penumpang angkot dan bus tidak tahu kapan kendaraan berikutnya datang sehingga menunggu lama di halte.\nPengguna: pelajar, pekerja, dan lansia yang memakai angkutan umum.\nCara kerja: GPS di setiap kendaraan (IoT) mengirim lokasi ke server daring (cloud); data perjalanan berbulan-bulan diolah untuk menemukan pola kemacetan (big data); AI memperkirakan waktu tiba; layar di halte dan aplikasi menampilkan perkiraan waktu tiba."]], "q": "Bagian kartu konsep yang masih perlu dilengkapi agar konsep ide lebih meyakinkan adalah …", "opts": ["masalah yang ingin diatasi, karena kartu belum menyebut kesulitan penumpang", "pengguna atau pihak yang terdampak, karena kartu belum menyebut siapa yang memakai", "peran teknologi 4.0, karena kartu belum menjelaskan fungsi IoT, cloud, big data, dan AI", "data atau alasan pendukung, misalnya hasil survei lama menunggu penumpang di halte", "tidak ada; kartu sudah lengkap sehingga tidak perlu ditambah apa pun"]}, {"no": 42, "tp": "TP 4.2.2", "materi": "Rancangan cara kerja konsep ide (masukan–proses–keluaran)", "level": "C6", "kat": "HOTS", "la": "-", "type": "pg", "maks": 8, "stim": [["p", "Kelompok merancang “Sepatu Pintar Pelajar” agar orang tua tahu anaknya sudah sampai di sekolah atau di rumah. Berikut rancangan cara kerja yang ditulis kelompok."], ["table", ["Bagian", "Isi rancangan"], [["Masukan", "lokasi GPS dari sol sepatu; jumlah langkah; notifikasi “sudah sampai sekolah” di HP orang tua"], ["Proses", "lokasi dikirim ke server; sistem membandingkan lokasi dengan titik sekolah dan rumah"], ["Keluaran", "riwayat perjalanan harian dapat dibuka orang tua"]], null]], "q": "Evaluasi yang paling tepat terhadap rancangan tersebut adalah …", "opts": ["rancangan sudah benar karena semua bagian sudah terisi", "jumlah langkah seharusnya menjadi keluaran karena dihitung oleh sepatu", "notifikasi “sudah sampai sekolah” seharusnya menjadi keluaran atau aksi, bukan masukan, karena dihasilkan setelah lokasi dibandingkan", "server seharusnya menjadi masukan karena data disimpan di sana", "GPS seharusnya menjadi keluaran karena orang tua melihat lokasi anak"]}, {"no": 43, "tp": "TP 4.2.3", "materi": "Flowchart penyempurnaan perfektif (jumlah berjalan)", "level": "C6", "kat": "HOTS", "la": "Literasi", "type": "pg", "maks": 8, "stim": [["p", "Sensor suhu ruang server mengirim 1 data setiap 10 menit. Rancangan v1.2 memakai jumlah berjalan untuk menampilkan rata-rata kumulatif setiap kali data baru datang. Berikut alur yang ditulis sebuah kelompok."], ["code", "1. Mulai\n2. jumlah ← 0 ; i ← 1\n3. Masukkan n\n4. Selama i ≤ n:\n5.    Masukkan suhu\n6.    jumlah ← jumlah + suhu\n7.    rata ← jumlah / n\n8.    Tampilkan rata\n9.    i ← i + 1\n10. Selesai"], ["p", "Saat diuji dengan n = 4 dan data pertama 30, layar menampilkan rata-rata 7,5, padahal seharusnya 30."]], "q": "Kesalahan pada alur tersebut beserta perbaikannya adalah …", "opts": ["langkah 2, jumlah harus diberi nilai awal 1 agar tidak nol", "langkah 6, jumlah harus dihitung ulang dari data pertama setiap kali data baru datang", "langkah 9, penghitung harus bertambah 2 agar perulangan lebih cepat", "langkah 4, perulangan harus berjalan selama i < n", "langkah 7, rata dibagi n padahal baru i data yang masuk; seharusnya rata ← jumlah / i"]}, {"no": 44, "tp": "TP 4.2.6", "materi": "Memilih ambang berbasis data", "level": "C5", "kat": "HOTS", "la": "Literasi & Numerasi", "type": "pg", "maks": 8, "stim": [["p", "Gerbang parkir sekolah memakai modul AI pendeteksi helm. Foto pengendara diberi label (berhelm/tanpa_helm) dan skor keyakinan; foto di bawah ambang dialihkan ke satpam. Pengendara tanpa helm tidak boleh lolos sebagai pengendara berhelm. Hasil uji 8 sampel (data ilustrasi):"], ["table", ["Sampel", "Label AI", "Keyakinan", "Label sebenarnya"], [["1", "berhelm", "0,94", "berhelm"], ["2", "berhelm", "0,66", "tanpa_helm"], ["3", "tanpa_helm", "0,85", "tanpa_helm"], ["4", "berhelm", "0,58", "berhelm"], ["5", "berhelm", "0,82", "berhelm"], ["6", "tanpa_helm", "0,71", "tanpa_helm"], ["7", "berhelm", "0,90", "berhelm"], ["8", "berhelm", "0,63", "berhelm"]], null]], "q": "Ambang 0,6 atau 0,8? Pilihan dan alasan berbasis data yang paling tepat adalah …", "opts": ["0,8, karena 4 foto diterima dan semuanya benar (100%), sampel 2 (tanpa helm berlabel berhelm) dialihkan; satpam memeriksa 4 foto, bertambah 3", "0,6, karena 7 foto diterima otomatis dengan label benar 100% sehingga satpam hanya memeriksa 1 foto", "0,6, karena label benar 6 dari 7 (sekitar 86%) sudah tinggi dan satpam tidak terlalu sibuk", "0,8, karena 5 foto diterima dengan label benar 100%, sedangkan 3 foto dialihkan ke satpam", "0,8, karena semua foto diterima otomatis sehingga satpam tidak perlu memeriksa"]}, {"no": 45, "tp": "TP 4.2.4", "materi": "Pameran rancangan dan evaluasi risiko ide", "level": "C5", "kat": "HOTS", "la": "-", "type": "pg", "maks": 8, "stim": [["p", "Sebuah kelompok memamerkan konsep ide “Kamera Antrean Kantin” dengan slide cetak dan prototipe aplikasi. Kamera AI menghitung panjang antrean setiap kios, lalu aplikasi menyarankan kios yang antreannya paling pendek. Seorang pengunjung bertanya, “Wajah murid yang terekam kamera disimpan di mana?”"]], "q": "Tindak lanjut dan cara mengatasi risiko yang paling tepat untuk ide tersebut adalah …", "opts": ["Menjawab bahwa wajah murid boleh disimpan selamanya karena kamera dipasang di lingkungan sekolah sendiri", "Menghapus fitur penghitung antrean sehingga aplikasi hanya menampilkan daftar menu", "Menambah jumlah kamera agar wajah murid terekam lebih jelas dari berbagai sudut", "Kamera hanya menghitung jumlah orang tanpa menyimpan gambar, wajah dikaburkan secara otomatis, dan ada pemberitahuan tertulis di area kantin", "Menyimpan rekaman wajah di cloud dan membagikannya kepada semua pengguna aplikasi agar transparan"]}];

function blocks(bl){return bl.map(b=>{
 if(b[0]==="p")return "<p>"+mk(b[1])+"</p>";
 if(b[0]==="table"){return '<div class="tw"><table class="t"><thead><tr>'+b[1].map(h=>"<th>"+mk(h)+"</th>").join("")+"</tr></thead><tbody>"+b[2].map(r=>"<tr>"+r.map(c=>"<td>"+mk(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>";}
 if(b[0]==="code")return "<pre><code>"+esc(b[1])+"</code></pre>";
 if(b[0]==="box")return '<div class="box"><div class="boxt">'+esc(b[1])+"</div><div>"+mk(b[2])+"</div></div>";
 if(b[0]==="img")return '<figure class="fig">'+b[2]+"</figure>";
 if(b[0]==="chat")return '<div class="chat"><div class="ct">'+esc(b[1])+"</div>"+b[2].map(m=>'<div class="msg'+(/Tim Pengembang/.test(m[0])?" dev":"")+'"><b>'+esc(m[0])+"</b>"+mk(m[1])+"</div>").join("")+"</div>";
 return "";}).join("");}

["copy","cut","paste","contextmenu","selectstart","dragstart","drop"].forEach(ev=>document.addEventListener(ev,e=>{if(bolehKetik(e))return;e.preventDefault();if(ev==="copy"||ev==="paste"||ev==="cut")toast("Salin/tempel tidak diizinkan pada latihan ini.");},true));

/* ---------- komunikasi dengan rekap Google Sheet (JSONP) ---------- */
function jsonp(params,ms){return new Promise((res,rej)=>{
 if(!CFG.URL_REKAP){rej(new Error("nonaktif"));return;}
 const cb="psascb_"+uid();const s=document.createElement("script");let done=false;
 const fin=(f,v)=>{if(done)return;done=true;window[cb]=function(){};s.remove();f(v);};
 window[cb]=d=>fin(res,d);s.onerror=()=>fin(rej,new Error("jaringan"));
 setTimeout(()=>fin(rej,new Error("waktu habis")),ms||15000);
 const q=new URLSearchParams(Object.assign({},params,{callback:cb}));
 s.src=CFG.URL_REKAP+(CFG.URL_REKAP.indexOf("?")>=0?"&":"?")+q.toString();document.body.appendChild(s);});}

/* ---------- jawaban & penilaian ---------- */
function answered(it){const a=S.ans[it.no];if(a==null)return false;
 if(it.type==="pg")return true;
 if(it.type==="pgk")return a.length>0;
 return a.some(x=>x!=null);}
function lengkap(it){const a=S.ans[it.no];if(!answered(it))return false;if(it.type==="pg"||it.type==="pgk")return true;return a.every(x=>x!=null);}
function ansStr(it,a){
 if(a==null)return "";
 if(it.type==="pg")return L[a];
 if(it.type==="pgk")return a.length?[...a].sort().map(i=>L[i]).join(","):"";
 if(it.type==="jodoh")return a.some(x=>x!=null)?a.map((x,i)=>(i+1)+"-"+(x==null?"?":L[x])).join(";"):"";
 if(it.type==="urut")return a.some(x=>x!=null)?a.map(x=>x==null?"?":L[x]).join("-"):"";
 if(it.type==="bs")return a.some(x=>x!=null)?a.map(x=>x==null?"?":(x?"B":"S")).join(";"):"";
 return "";}
function scoreItem(it){
 const a=S.ans[it.no],k=KEYS[it.no-1];let skor=0;
 if(!answered(it))return{skor:0,status:"Kosong",jawab:""};
 if(it.type==="pg"){skor=a===k?it.maks:0;}
 else if(it.type==="pgk"){const set=new Set(a),ks=new Set(k);let t=0;for(let i=0;i<5;i++)if(set.has(i)===ks.has(i))t++;skor=it.maks*t/5;}
 else{let t=0;k.forEach((x,i)=>{if(a[i]===x)t++;});skor=it.maks*t/k.length;}
 skor=Math.round(skor*1000)/1000;
 const status=skor>=it.maks-1e-9?"Benar":(skor<=1e-9?"Salah":"Sebagian");
 return{skor,status,jawab:ansStr(it,a)};}
function hitung(){
 const rows=ITEMS.map(it=>{const r=scoreItem(it);return Object.assign({it},r);});
 const total=Math.round(rows.reduce((s,r)=>s+r.skor,0)*100)/100;
 return{rows,total};}

/* ---------- pemeriksaan per soal (maks CFG.MAKS_CEK kali, tanpa kunci) ---------- */
function cek(no){return S.chk[no]||null;}
function terkunci(it){const c=cek(it.no);return !!c&&(c.st==="Benar"||c.n>=CFG.MAKS_CEK);}
function berubah(it){const c=cek(it.no);return !c||c.last!==JSON.stringify(S.ans[it.no]);}
function periksa(it){
 if(terkunci(it)||!lengkap(it)||!berubah(it))return;
 const r=scoreItem(it);const c=S.chk[it.no]||{n:0};
 c.n++;c.last=JSON.stringify(S.ans[it.no]);c.st=r.status;c.skor=r.skor;S.chk[it.no]=c;save();renderQuiz();
 const fb=$("fb");if(fb)fb.scrollIntoView({behavior:"smooth",block:"center"});}
function feedback(it){
 const c=cek(it.no),sisa=CFG.MAKS_CEK-(c?c.n:0);
 let h="";
 if(c){const cls={Benar:"s-ok",Sebagian:"s-part",Salah:"s-bad"}[c.st];
  const judul={Benar:"✓ Jawabanmu benar!",Sebagian:"◐ Jawabanmu sebagian benar.",Salah:"✗ Jawabanmu belum tepat."}[c.st];
  h+='<div class="fbmsg '+cls+'"><b>'+judul+'</b> Skor soal ini: '+num(c.skor)+" dari "+it.maks+".";
  if(c.st!=="Benar")h+=sisa>0?"<br>Sisa kesempatan memeriksa: <b>"+sisa+"</b>. Ubah jawabanmu, lalu periksa lagi.":"<br>Kesempatan memeriksa sudah habis. Jawaban ini yang dinilai.";
  h+="</div>";}
 if(!terkunci(it)){
  const bisa=lengkap(it)&&berubah(it);
  const lbl=!lengkap(it)?(answered(it)?"Lengkapi semua bagian dulu":"Pilih jawaban dulu"):(!berubah(it)?"Ubah jawaban untuk memeriksa lagi":(c?"Periksa lagi":"Periksa jawaban")+" ("+sisa+"× tersisa)");
  h+='<button id="btnCek" class="cek'+(bisa?" pri":"")+'" '+(bisa?"":"disabled")+">"+lbl+"</button>";}
 return '<div id="fb" class="fb">'+h+"</div>";}

/* ---------- widget jawaban ---------- */
function widget(it,ro,show){
 const a=S.ans[it.no];let h="";const dis=ro?"disabled":"";const k=KEYS[it.no-1];
 const mark=(ok,kt)=>show?(ok?' <span class="status s-ok">benar</span>':' <span class="status s-bad">kunci: '+kt+"</span>"):"";
 if(it.type==="pg"){
  h=it.opts.map((o,i)=>'<div class="opt'+(a===i?" sel":"")+(ro?" ro":"")+(show?(i===k?" right":(a===i?" wrong":"")):"")+'" data-act="pg" data-i="'+i+'"><span class="l">'+L[i]+'.</span><span>'+mk(o)+"</span></div>").join("");}
 else if(it.type==="pgk"){
  const set=new Set(a||[]);
  h=it.opts.map((o,i)=>'<div class="opt'+(set.has(i)?" sel":"")+(ro?" ro":"")+(show?(k.includes(i)?" right":(set.has(i)?" wrong":"")):"")+'" data-act="pgk" data-i="'+i+'"><span class="l">'+(set.has(i)?"☑":"☐")+" "+L[i]+'.</span><span>'+mk(o)+"</span></div>").join("");}
 else if(it.type==="jodoh"){
  h='<div class="tw"><table class="t"><thead><tr><th>Pilihan di kolom kanan</th></tr></thead><tbody>'+it.right.map((r,i)=>"<tr><td><b>"+L[i]+".</b> "+mk(r)+"</td></tr>").join("")+"</tbody></table></div>";
  h+=it.left.map((l,i)=>{const v=a?a[i]:null;
   return '<div class="row"><div class="txt"><b>'+(i+1)+".</b> "+mk(l)+"</div><select "+dis+' data-act="jodoh" data-k="'+i+'"><option value="">– pilih –</option>'+it.right.map((r,j)=>'<option value="'+j+'"'+(v===j?" selected":"")+">"+L[j]+"</option>").join("")+"</select>"+mark(v===k[i],L[k[i]])+"</div>";}).join("");}
 else if(it.type==="urut"){
  h='<div class="tw"><table class="t"><tbody>'+it.items.map((r,i)=>"<tr><td><b>("+L[i]+")</b> "+mk(r)+"</td></tr>").join("")+"</tbody></table></div><p class='small'>Pilih huruf untuk tiap urutan (1 = paling awal).</p>";
  h+=it.items.map((_,i)=>{const v=a?a[i]:null;
   return '<div class="row"><div class="txt"><b>Urutan ke-'+(i+1)+"</b></div><select "+dis+' data-act="urut" data-k="'+i+'"><option value="">– pilih –</option>'+it.items.map((r,j)=>'<option value="'+j+'"'+(v===j?" selected":"")+">"+L[j]+"</option>").join("")+"</select>"+mark(v===k[i],L[k[i]])+"</div>";}).join("");
  if(a){const used=a.filter(x=>x!=null);if(new Set(used).size!==used.length)h+='<div class="warn">Ada huruf yang dipakai lebih dari satu kali. Periksa kembali urutanmu.</div>';}}
 else if(it.type==="bs"){
  h='<div class="tw"><table class="t"><thead><tr><th>No</th><th>Pernyataan</th></tr></thead><tbody>'+it.stmts.map((s,i)=>"<tr><td>"+(i+1)+"</td><td>"+mk(s)+"</td></tr>").join("")+"</tbody></table></div>";
  h+=it.stmts.map((s,i)=>{const v=a?a[i]:null;
   return '<div class="row"><div class="txt"><b>Pernyataan '+(i+1)+'</b></div><div class="bsb"><button '+dis+' class="'+(v===true?"on":"")+'" data-act="bs" data-k="'+i+'" data-v="1">Benar</button><button '+dis+' class="'+(v===false?"on":"")+'" data-act="bs" data-k="'+i+'" data-v="0">Salah</button></div>'+mark(v===k[i],k[i]?"Benar":"Salah")+'</div>';}).join("");}
 return h;}

function instr(it){
 return {pg:"Pilih satu jawaban yang paling tepat.",pgk:"Pilih SEMUA jawaban yang benar (lebih dari satu).",jodoh:"Pasangkan setiap pernyataan dengan satu pilihan. Ada pilihan yang tidak terpakai.",urut:"Susun urutan yang benar dengan memilih huruf pada tiap urutan.",bs:"Tentukan setiap pernyataan Benar atau Salah."}[it.type];}
function badges(it){let h='<span class="badge b-bt">'+BNAMA[it.type]+'</span><span class="badge b-lv">'+it.level+"</span>";
 if(it.la.indexOf("Literasi")>=0)h+='<span class="badge b-lit">LITERASI</span>';
 if(it.la.indexOf("Numerasi")>=0)h+='<span class="badge b-num">NUMERASI</span>';return h;}
function qcard(it,ro,fb,show){
 return '<div class="card qcard"><div class="qhead"><span class="qno">Soal '+it.no+' <span class="small">/ '+N+'</span></span><span>'+badges(it)+'</span></div><p class="instr">'+instr(it)+" (skor maks "+it.maks+")</p>"+blocks(it.stim)+(it.q?'<p class="q">'+mk(it.q)+"</p>":"")+widget(it,ro,show)+(fb?feedback(it):"")+"</div>";}

function app(){return $("app");}
