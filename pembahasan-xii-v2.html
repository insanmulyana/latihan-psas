 if(sv&&sv.phase==="result")resume='<div class="warn" style="margin-bottom:10px">Hasil terakhir atas nama <b>'+esc(sv.ident.nama)+'</b> tersimpan di perangkat ini.<div class="btnrow"><button id="btnShow" class="pri">Lihat hasil</button></div></div>';
 const kel=CFG.MAKS_KELUAR>0?" Jika keluar <b>"+CFG.MAKS_KELUAR+" kali</b>, jawabanmu otomatis dikumpulkan.":"";
 if(belumBuka()||sudahTutup()){
  const info=belumBuka()?'<h2 style="margin-top:0">Versi '+CFG.VERSI+' belum dibuka</h2><p>Latihan ini dibuka <b>'+tglWIB(T_BUKA)+'</b>'+(isFinite(T_TUTUP)?' dan ditutup <b>'+tglWIB(T_TUTUP)+'</b>':'')+'.</p>':'<h2 style="margin-top:0">Latihan sudah ditutup</h2><p>Versi '+CFG.VERSI+' ditutup pada <b>'+tglWIB(T_TUTUP)+'</b>. Kamu masih dapat melihat hasilmu bila sudah pernah mengerjakan di HP ini. Pembahasan lengkap dapat dibuka lewat tombol <b>📖 Pembahasan</b> di halaman depan sesuai jadwal.</p><p style="margin-bottom:0"><a href="index.html">← Ke halaman depan</a></p>';
  const okResume=sv&&sv.phase==="quiz"&&!belumBuka();
  app().innerHTML=header()+'<div class="card">'+info+(okResume||(sv&&sv.phase==="result")?resume:"")+'</div>';
  if($("btnResume"))$("btnResume").onclick=()=>{S=sv;layarPenuh();renderQuiz();};
  if($("btnShow"))$("btnShow").onclick=()=>{S=sv;renderResult();};
  return;}
 const jad=isFinite(T_TUTUP)?'<li>Latihan ini dapat dikerjakan sampai <b>'+tglWIB(T_TUTUP)+'</b>.</li>':'';
 app().innerHTML=header()+'<div class="card">'+resume+'<h2 style="margin-top:0">Petunjuk</h2><ol>'+jad+
 '<li>Isi identitas dengan benar, lalu tekan <b>Mulai</b>. Layar akan berubah menjadi layar penuh.</li>'+
 '<li>Kerjakan '+N+' soal: pilihan ganda, PG kompleks, menjodohkan, mengurutkan, dan benar–salah.</li>'+
 '<li>Setiap soal boleh <b>diperiksa paling banyak '+CFG.MAKS_CEK+' kali</b>. Kamu hanya diberi tahu benar, sebagian benar, atau salah. Kunci jawaban tidak ditampilkan.</li>'+
 '<li>Seluruh latihan boleh dikerjakan <b>paling banyak '+CFG.MAKS_PERCOBAAN+' kali</b>. Semua percobaan tercatat di rekap guru.</li>'+
 '<li><b>Kunci dan pembahasan</b> terbuka setelah kesempatan mengerjakanmu habis'+(isFinite(T_TUTUP)?' atau setelah latihan ditutup':'')+(CFG.PEMB_TUTUP?', dan ditutup kembali pada '+tglWIB(Date.parse(CFG.PEMB_TUTUP))+' (hari ujian PSAS)':'')+'. Kamu juga boleh membukanya lebih awal, tetapi kesempatan mengulang menjadi hangus.</li>'+
 '<li><b>Jangan keluar dari halaman ini</b> (membuka tab lain, aplikasi lain, atau mematikan layar). Setiap kali keluar tercatat dan dilaporkan ke guru.'+kel+'</li>'+
 '<li>Salin-tempel dinonaktifkan selama latihan.</li>'+
 '<li>Setelah menekan <b>Kumpulkan</b>, nilaimu langsung muncul dan otomatis terkirim ke rekap guru. Setelah itu kirim juga hasilmu ke email guru kelasmu (alamatnya muncul di halaman nilai) lewat tombol yang tersedia.</li></ol></div>'+
 '<div class="card"><label for="nm">Nama lengkap</label><input id="nm" type="text" value="'+esc(S.ident.nama)+'" autocomplete="name" maxlength="60"><label for="kl">Kelas</label><select id="kl">'+CFG.KELAS.map(k=>"<option>"+k+"</option>").join("")+'<option>Lainnya</option></select><label for="ab">Nomor absen</label><input id="ab" type="number" inputmode="numeric" min="1" max="60" value="'+esc(S.ident.absen)+'"><label for="du">Waktu pengerjaan</label><select id="du"><option value="120">120 menit (seperti PSAS)</option><option value="90">90 menit</option><option value="60">60 menit</option></select><p id="msg" class="msg-err"></p><button id="btnStart" class="pri big">Mulai</button></div>';
 $("kl").value=S.ident.kelas;
 $("btnStart").onclick=mulai;
 if($("btnResume"))$("btnResume").onclick=()=>{S=sv;layarPenuh();if(CFG.MAKS_KELUAR>0&&S.keluar>=CFG.MAKS_KELUAR){submit(true,"Keluar halaman "+S.keluar+" kali");return;}renderQuiz();if(S.keluar)peringatanKeluar();};
 if($("btnShow"))$("btnShow").onclick=()=>{S=sv;renderResult();};}

async function mulai(){
 if(belumBuka()||sudahTutup()){renderStart();return;}
 const nm=$("nm").value.trim().replace(/\s+/g," "),ab=$("ab").value.trim(),kl=$("kl").value,msg=$("msg");
 if(nm.length<3){msg.textContent="Isi nama lengkap (minimal 3 huruf).";return;}
 if(!/^\d{1,2}$/.test(ab)){msg.textContent="Isi nomor absen dengan angka.";return;}
 layarPenuh();
 const key=siswaKey(kl,ab),id=uid(),lokal=attCount(key);
 const btn=$("btnStart");btn.disabled=true;btn.textContent="Memeriksa kesempatan…";msg.textContent="";
 let ke=lokal+1,boleh=lokal<CFG.MAKS_PERCOBAAN,dariServer=false;
 try{const r=await jsonp({action:"mulai",id:id,kelas:kl,absen:ab,nama:nm,versi:CFG.VERSI,maks:CFG.MAKS_PERCOBAAN},10000);
  if(r&&r.ok){dariServer=true;boleh=!!r.boleh;ke=r.ke;}}catch(e){}
 if(!boleh){btn.disabled=false;btn.textContent="Mulai";keluarLayarPenuh();
  msg.innerHTML="Kesempatan mengerjakan untuk <b>"+esc(kl)+" absen "+esc(ab)+"</b> sudah habis ("+CFG.MAKS_PERCOBAAN+" kali). Hubungi guru jika perlu tambahan kesempatan."+(dariServer?"":"");return;}
 attAdd(key,id);
 S=fresh({nama:nm,kelas:kl,absen:ab});S.phase="quiz";S.t0=Date.now();S.dur=parseInt($("du").value,10);S.id=id;S.ke=ke;
 save();renderQuiz();}

function remaining(){if(!S.dur)return null;return Math.max(0,S.t0+S.dur*60000-Date.now());}
function fmt(ms){const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60);}
function tick(){const el=$("timer");if(!el||S.phase!=="quiz")return;
 const r=remaining();el.textContent="⏱ "+fmt(r);el.className="timer"+(r<600000?" low":"");
 if(r<=0){clearInterval(timerId);submit(true,"Waktu habis");}}
function gridHtml(mode){return '<div class="grid">'+ITEMS.map(it=>{let c="";
 if(mode==="quiz"){const k=cek(it.no);if(k)c+=k.st==="Benar"?" ok":(k.st==="Sebagian"?" part":" bad");else if(answered(it))c+=" done";if(S.flag[it.no])c+=" flag";if(it.no===S.cur)c+=" cur";}
 else{const r=scoreItem(it);c+=r.status==="Benar"?" ok":(r.status==="Sebagian"?" part":" bad");if(it.no===S.rev)c+=" cur";}
 return '<button class="'+c+'" data-go="'+it.no+'">'+it.no+"</button>";}).join("")+"</div>";}
function renderQuiz(){
 const it=ITEMS[S.cur-1];const nAns=ITEMS.filter(answered).length;const ro=terkunci(it);
 app().innerHTML=header()+'<div class="bar"><span class="timer" id="timer"></span><span>Terjawab <b>'+nAns+"</b>/"+N+'</span><button id="btnGrid">'+(S.grid?"Tutup daftar ▴":"Daftar soal ▾")+'</button><button id="btnFin" class="pri">Kumpulkan</button></div>'+
 (S.grid?'<div class="card gridcard">'+gridHtml("quiz")+'<p class="small legend"><i class="lg done"></i>dijawab <i class="lg ok"></i>benar <i class="lg part"></i>sebagian <i class="lg bad"></i>salah ⚑ ragu</p></div>':"")+qcard(it,ro,true)+
 '<div class="nav sticky"><button id="btnPrev" '+(S.cur===1?"disabled":"")+'>← Sebelum</button><button id="btnFlag" class="'+(S.flag[S.cur]?"flagon":"")+'">⚑ '+(S.flag[S.cur]?"Ragu":"Tandai")+'</button><button id="btnNext" class="pri" '+(S.cur===N?"disabled":"")+'>Berikut →</button></div>';
 $("btnPrev").onclick=()=>go(S.cur-1);$("btnNext").onclick=()=>go(S.cur+1);$("btnFin").onclick=()=>submit(false);
 $("btnGrid").onclick=()=>{S.grid=!S.grid;save();renderQuiz();};
 $("btnFlag").onclick=()=>{S.flag[S.cur]=!S.flag[S.cur];save();renderQuiz();};
 if($("btnCek"))$("btnCek").onclick=()=>periksa(it);
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{if(window.innerWidth<=700)S.grid=false;go(parseInt(b.dataset.go,10));});
 if(!ro)bindInputs(it);
 clearInterval(timerId);tick();timerId=setInterval(tick,1000);}
function go(n){if(n<1||n>N)return;S.cur=n;save();renderQuiz();window.scrollTo(0,0);}
function rerenderKeep(){const y=window.scrollY;renderQuiz();window.scrollTo(0,y);}
function bindInputs(it){
 document.querySelectorAll("[data-act]").forEach(el=>{
  const act=el.dataset.act;
  if(act==="pg")el.onclick=()=>{S.ans[it.no]=(S.ans[it.no]===+el.dataset.i)?null:+el.dataset.i;save();rerenderKeep();};
  if(act==="pgk")el.onclick=()=>{const s=new Set(S.ans[it.no]||[]);const i=+el.dataset.i;s.has(i)?s.delete(i):s.add(i);S.ans[it.no]=[...s].sort();save();rerenderKeep();};
  if(act==="jodoh"||act==="urut")el.onchange=()=>{const n=it.type==="jodoh"?it.left.length:it.items.length;const a=S.ans[it.no]||Array(n).fill(null);a[+el.dataset.k]=el.value===""?null:+el.value;S.ans[it.no]=a;save();rerenderKeep();};
  if(act==="bs")el.onclick=()=>{const a=S.ans[it.no]||it.stmts.map(()=>null);const k=+el.dataset.k,v=el.dataset.v==="1";a[k]=(a[k]===v)?null:v;S.ans[it.no]=a;save();rerenderKeep();};});}

function submit(auto,alasan){
 if(S.phase!=="quiz")return;
 const nAns=ITEMS.filter(answered).length;
 const lanjut=()=>{clearInterval(timerId);const h=hitung();
  S.phase="result";S.res={total:h.total,t1:Date.now(),alasan:alasan||"Dikumpulkan siswa"};S.rev=null;S.kirim={st:"proses"};save();
  keluarLayarPenuh();renderResult();window.scrollTo(0,0);kirimRekap();
  if(auto)modal("<h3 style='margin-top:0'>Jawaban dikumpulkan otomatis</h3><p>"+esc(alasan)+".</p>","Lihat nilai");};
 if(auto){lanjut();return;}
 const kosong=N-nAns;
 tanya("<h3 style='margin-top:0'>Kumpulkan jawaban?</h3><p>"+(kosong>0?"Masih ada <b>"+kosong+" soal</b> belum dijawab. ":"")+"Setelah dikumpulkan, jawaban tidak dapat diubah.</p>","Ya, kumpulkan",lanjut);}

/* ---------- hasil ---------- */
function ringkas(){const h=hitung();const c={Benar:0,Sebagian:0,Salah:0,Kosong:0};h.rows.forEach(r=>c[r.status]++);
 const dur=Math.round((S.res.t1-S.t0)/600)/100;let nc=0;Object.values(S.chk).forEach(x=>nc+=x.n);return{h,c,dur,nc};}
function kirimRekap(){
 if(!CFG.URL_REKAP){S.kirim={st:"nonaktif"};save();statusKirim();return;}
 const {h,c,dur,nc}=ringkas();S.kirim={st:"proses"};statusKirim();
 jsonp({action:"kirim",id:S.id,versi:CFG.VERSI,nama:S.ident.nama,kelas:S.ident.kelas,absen:S.ident.absen,ke:S.ke,
  mulai:stamp(new Date(S.t0)),selesai:stamp(new Date(S.res.t1)),durasi:dur,nilai:h.total,benar:c.Benar,sebagian:c.Sebagian,salah:c.Salah,kosong:c.Kosong,
  keluar:S.keluar||0,cek:nc,alasan:S.res.alasan,skor:h.rows.map(r=>r.skor).join("|"),maks:h.rows.map(r=>r.it.maks).join("|"),jawab:h.rows.map(r=>r.jawab).join("|")},20000)
 .then(r=>{S.kirim={st:(r&&r.ok)?"ok":"gagal",t:Date.now(),e:r&&r.error};save();statusKirim();})
 .catch(e=>{S.kirim={st:"gagal",e:String(e.message||e)};save();statusKirim();});}
function statusKirim(){const el=$("kst");if(!el)return;const st=S.kirim?S.kirim.st:"";
 if(st==="ok")el.innerHTML='<div class="fbmsg s-ok">✓ Nilaimu sudah tercatat otomatis di rekap guru.</div>';
 else if(st==="proses")el.innerHTML='<div class="fbmsg s-kos">⏳ Mengirim nilai ke rekap guru…</div>';
 else if(st==="nonaktif")el.innerHTML="";
 else{el.innerHTML='<div class="fbmsg s-bad">⚠ Nilai belum terkirim ke rekap guru (periksa koneksi internet).<div class="btnrow"><button id="btnRetry" class="pri">Kirim ulang</button></div></div>';$("btnRetry").onclick=kirimRekap;}}
function kodeHasil(){const {h}=ringkas();const o={v:CFG.VERSI,n:S.ident.nama,k:S.ident.kelas,a:S.ident.absen,p:S.ke,t:h.total,x:S.keluar||0,w:stamp(new Date(S.res.t1)),s:h.rows.map(r=>r.skor)};
 return "PSAS"+CFG.TINGKAT+":"+btoa(unescape(encodeURIComponent(JSON.stringify(o))));}
function mailtoHref(){const {h,c,dur}=ringkas();
 const subj="Hasil Latihan PSAS Informatika "+CFG.TINGKAT+" V"+CFG.VERSI+" - "+S.ident.kelas+" - "+S.ident.absen+" - "+S.ident.nama;
 const body=["Yth. Bapak/Ibu Guru Informatika,","","Berikut hasil latihan PSAS Ganjil saya.","",
  "Nama: "+S.ident.nama,"Kelas: "+S.ident.kelas,"No. absen: "+S.ident.absen,"Versi soal: "+CFG.VERSI,"Percobaan ke: "+S.ke+" dari "+CFG.MAKS_PERCOBAAN,"",
  "NILAI: "+num(h.total),"Benar penuh: "+c.Benar+" | Sebagian: "+c.Sebagian+" | Salah: "+c.Salah+" | Tidak dijawab: "+c.Kosong,
  "Mulai: "+stamp(new Date(S.t0)),"Selesai: "+stamp(new Date(S.res.t1))+" ("+num(dur)+" menit)","Keluar halaman: "+(S.keluar||0)+" kali","Keterangan: "+S.res.alasan+(S.bukaPemb?" | pembahasan dibuka lebih awal":""),"",
  "Kode hasil (jangan diubah):",kodeHasil(),"","Terima kasih."].join("\n");
 return "mailto:"+emailGuru()+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);}
function csvEsc(v){v=String(v==null?"":v);return /[",;\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCSV(){
 const {h,dur}=ringkas();
 const head=["versi","nama","kelas","no_absen","percobaan_ke","waktu_mulai","waktu_selesai","durasi_menit","keluar_halaman","no_soal","bentuk","kode_tp","materi","level","jawaban_siswa","status","skor","skor_maks","nilai_total"];
 const lines=[head.join(",")];
 h.rows.forEach(r=>{const it=r.it;lines.push([CFG.VERSI,S.ident.nama,S.ident.kelas,S.ident.absen,S.ke,stamp(new Date(S.t0)),stamp(new Date(S.res.t1)),dur,S.keluar||0,it.no,BNAMA[it.type],it.tp,it.materi,it.level,r.jawab,r.status,r.skor,it.maks,h.total].map(csvEsc).join(","));});
 return lines.join("\r\n");}
function download(name,text){const b=new Blob(["﻿"+text],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function safe(s){return String(s).replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,30);}
function persen(a,b){return b?Math.round(a/b*1000)/10:0;}
function renderResult(){
 const {h,c}=ringkas();const rows=h.rows;
 const grp=(keyf)=>{const m={};rows.forEach(r=>{const k=keyf(r.it);m[k]=m[k]||{s:0,m:0};m[k].s+=r.skor;m[k].m+=r.it.maks;});return m;};
 const bar=(m)=>Object.keys(m).sort().map(k=>"<tr><td>"+esc(k)+"</td><td>"+num(m[k].s)+" / "+m[k].m+"</td><td class='gcol'><div class='prog'><i style='width:"+persen(m[k].s,m[k].m)+"%'></i></div></td><td>"+String(persen(m[k].s,m[k].m)).replace(".",",")+"%</td></tr>").join("");
 const tpMap=grp(i=>i.tp);const byBentuk=grp(i=>BNAMA[i.type]);const byKat=grp(i=>i.kat);const byLN=grp(i=>i.la==="-"?"Tanpa muatan khusus":i.la);
 const kk=h.total>=78?"Mencapai KKTP (≥ 78)":"Belum mencapai KKTP (< 78)";
 const sisa=S.bukaPemb?0:CFG.MAKS_PERCOBAAN-S.ke;const pemb=pembTerbuka();
 let body=header()+'<div class="card"><div class="hasil"><div><div class="small">Nilai latihan</div><div class="score">'+num(h.total)+'</div><div class="small">dari 100 • '+kk+'</div></div><div><b>'+esc(S.ident.nama)+'</b><br><span class="small">'+esc(S.ident.kelas)+" • absen "+esc(S.ident.absen)+" • Versi "+CFG.VERSI+"<br>Percobaan ke-"+S.ke+" dari "+CFG.MAKS_PERCOBAAN+" • keluar halaman "+(S.keluar||0)+"×</span></div></div>"+
 '<div class="kv"><div><b style="color:var(--ok)">'+c.Benar+'</b>Benar</div><div><b style="color:var(--part)">'+c.Sebagian+'</b>Sebagian</div><div><b style="color:var(--bad)">'+c.Salah+'</b>Salah</div><div><b>'+c.Kosong+'</b>Kosong</div></div>'+
 (S.res.alasan!=="Dikumpulkan siswa"?'<p class="warn">Dikumpulkan otomatis: '+esc(S.res.alasan)+".</p>":"")+'<div id="kst"></div></div>'+
 '<div class="card emailcard"><h3 style="margin-top:0">📧 Langkah terakhir: kirim hasil ke email guru</h3><p>Tekan tombol di bawah. Aplikasi email (Gmail) akan terbuka dengan isi yang sudah terisi otomatis. Cukup tekan <b>Kirim</b> dan jangan ubah isinya.</p>'+
 '<a id="btnMail" class="btn pri big" href="'+esc(mailtoHref())+'">Kirim ke '+esc(emailGuru())+'</a>'+
 '<div class="btnrow"><button id="btnCsv">⬇ Unduh CSV</button><button id="btnCopy">Salin isi email</button></div><p class="small">Jika aplikasi email tidak terbuka, tekan <b>Salin isi email</b>, lalu tempel dan kirim secara manual ke '+esc(emailGuru())+'.</p></div>'+
 '<div class="card pembcard"><h3 style="margin-top:0">📖 Kunci dan pembahasan</h3>'+(pembLewat()?'<p>Pembahasan sudah <b>ditutup</b> sejak '+tglWIB(Date.parse(CFG.PEMB_TUTUP))+' karena hari ujian PSAS. Selamat mengerjakan ujian!</p>':pemb?'<p><b>Pembahasan sudah terbuka.</b> Ketuk nomor soal pada peta soal di bawah untuk melihat soal, jawabanmu, kunci, dan pembahasannya. Pelajari terutama soal yang berwarna merah dan kuning.</p><button id="btnPemb1" class="pri">Mulai dari soal nomor 1</button>':
   '<p>Kamu masih punya <b>'+sisa+' kesempatan</b> mengulang'+(isFinite(T_TUTUP)?' sampai '+tglWIB(T_TUTUP):'')+'. Kunci dan pembahasan terbuka otomatis setelah kesempatanmu habis'+(isFinite(T_TUTUP)?' atau setelah latihan ditutup':'')+'.</p><div class="btnrow"><button id="btnNew" class="pri">Ulangi latihan</button><button id="btnBukaPemb">Buka pembahasan sekarang</button></div><p class="small">Bila pembahasan dibuka sekarang, kesempatan mengulang <b>hangus</b> dan tercatat di rekap guru.</p>')+'</div>'+
 '<div class="card"><h3 style="margin-top:0">Peta soal</h3><p class="small legend"><i class="lg ok"></i>benar <i class="lg part"></i>sebagian <i class="lg bad"></i>salah/kosong</p>'+gridHtml("res")+'<p class="small">Ketuk nomor untuk melihat kembali soal dan jawabanmu'+(pemb?' beserta kunci dan pembahasannya':'')+'.</p></div>';
 if(S.rev){const it=ITEMS[S.rev-1];const r=scoreItem(it);const cls={Benar:"s-ok",Sebagian:"s-part",Salah:"s-bad",Kosong:"s-kos"}[r.status];
  body+='<div id="revbox">'+qcard(it,true,false,pemb)+'<div class="card"><span class="status '+cls+'">'+r.status+"</span> Skor: <b>"+num(r.skor)+" / "+it.maks+"</b>"+
   (pemb?'<div class="pembbox"><div><b>Kunci:</b> '+esc(keyStr(it))+'</div><div class="pembtxt"><b>Pembahasan</b><br>'+mk(PEMB[it.no-1]||"–")+'</div></div>':'<p class="small">'+(pembLewat()?'Pembahasan sudah ditutup karena hari ujian PSAS.':'Kunci dan pembahasan terbuka setelah kesempatan mengerjakanmu habis.')+'</p>')+
   '<div class="nav"><button id="revPrev" '+(S.rev===1?"disabled":"")+'>← Sebelumnya</button><button id="revNext" class="pri" '+(S.rev===N?"disabled":"")+'>Berikutnya →</button></div></div></div>';}
 body+='<div class="card"><h3 style="margin-top:0">Capaian per Tujuan Pembelajaran</h3><div class="tw"><table class="t"><thead><tr><th>Kode TP</th><th>Skor</th><th class="gcol">Grafik</th><th>%</th></tr></thead><tbody>'+bar(tpMap)+'</tbody></table></div></div>'+
 '<div class="card"><h3 style="margin-top:0">Capaian per bentuk soal dan level</h3><div class="tw"><table class="t"><thead><tr><th>Kelompok</th><th>Skor</th><th class="gcol">Grafik</th><th>%</th></tr></thead><tbody>'+bar(byBentuk)+bar(byKat)+bar(byLN)+'</tbody></table></div></div>';
 app().innerHTML=body;statusKirim();
 $("btnCsv").onclick=()=>download("PSAS-"+CFG.TINGKAT+"-V"+CFG.VERSI+"_"+safe(S.ident.kelas)+"_"+safe(S.ident.absen)+"_"+safe(S.ident.nama)+"_P"+S.ke+".csv",buildCSV());
 $("btnCopy").onclick=()=>{const t=decodeURIComponent(mailtoHref().split("&body=")[1]);const done=()=>toast("Isi email disalin.");
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>modal("<p>Salin teks berikut:</p><textarea readonly>"+esc(t)+"</textarea>","Tutup"));else modal("<p>Salin teks berikut:</p><textarea readonly>"+esc(t)+"</textarea>","Tutup");};
 const lihat=n=>{S.rev=n;save();renderResult();const e=$("revbox");if(e)e.scrollIntoView({behavior:"smooth"});};
 if($("btnPemb1"))$("btnPemb1").onclick=()=>lihat(1);
 if($("revPrev"))$("revPrev").onclick=()=>lihat(S.rev-1);
 if($("revNext"))$("revNext").onclick=()=>lihat(S.rev+1);
 if($("btnBukaPemb"))$("btnBukaPemb").onclick=()=>tanya("<h3 style='margin-top:0'>Buka pembahasan sekarang?</h3><p>Kamu akan melihat kunci dan pembahasan semua soal. <b>Kesempatan mengulang latihan ini hangus</b> dan hal ini tercatat di rekap guru.</p>","Ya, buka pembahasan",bukaPembahasan);
 if($("btnNew"))$("btnNew").onclick=()=>{const belum=!S.kirim||(S.kirim.st!=="ok"&&S.kirim.st!=="nonaktif");
  tanya("<h3 style='margin-top:0'>Ulangi latihan?</h3><p>Ini akan memakai kesempatan ke-"+(S.ke+1)+" dari "+CFG.MAKS_PERCOBAAN+". Hasil ini akan hilang dari layar HP-mu.</p>"+(belum?"<p class='warn'>Hasil ini <b>belum terkirim</b> ke rekap guru. Kirim email dulu atau tekan Kirim ulang sebelum mengulang.</p>":"<p>Pastikan kamu sudah mengirim email hasil ini.</p>"),"Ya, ulangi",()=>{const id=S.ident;clearSave();S=fresh(id);renderStart();window.scrollTo(0,0);});};
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>lihat(parseInt(b.dataset.go,10)));}
function pembLewat(){return !!CFG.PEMB_TUTUP&&Date.now()>Date.parse(CFG.PEMB_TUTUP);}
function pembTerbuka(){return S.phase==="result"&&!pembLewat()&&(S.bukaPemb||S.ke>=CFG.MAKS_PERCOBAAN||sudahTutup());}
function bukaPembahasan(){
 S.bukaPemb=true;const key=siswaKey(S.ident.kelas,S.ident.absen);
 for(let i=attCount(key);i<CFG.MAKS_PERCOBAAN;i++)attAdd(key,"hangus_"+uid());
 save();jsonp({action:"pembahasan",id:S.id,kelas:S.ident.kelas,absen:S.ident.absen},15000).catch(()=>{});
 S.rev=1;save();renderResult();const e=$("revbox");if(e)e.scrollIntoView({behavior:"smooth"});}
function keyStr(it){const k=KEYS[it.no-1];
 if(it.type==="pg")return L[k];
 if(it.type==="pgk")return k.map(i=>L[i]).join(", ");
 if(it.type==="jodoh")return k.map((x,i)=>(i+1)+"–"+L[x]).join(", ");
 if(it.type==="urut")return k.map(x=>L[x]).join(" – ");
 return k.map((x,i)=>(i+1)+"–"+(x?"B":"S")).join(", ");}

/* ---------- halaman pembahasan (mode khusus) ---------- */
function renderPembahasanPage(n){
 const B=CFG.PEMB_BUKA?Date.parse(CFG.PEMB_BUKA):0, T=CFG.PEMB_TUTUP?Date.parse(CFG.PEMB_TUTUP):Infinity, now=Date.now();
 const kembali='<p style="margin:12px 0 0"><a href="index.html">← Kembali ke halaman depan</a></p>';
 const head='<header class="top"><h1>Pembahasan Latihan PSAS Ganjil – Informatika '+CFG.TINGKAT+' – Versi '+CFG.VERSI+'</h1><small>SMA Kartika XIX-1 Bandung • 2026/2027 • '+N+' soal</small></header>';
 if(now<B||now>T){
  app().innerHTML=head+'<div class="card"><h2 style="margin-top:0">'+(now<B?'Pembahasan belum dibuka':'Pembahasan sudah ditutup')+'</h2><p>Pembahasan Versi '+CFG.VERSI+' dapat dibuka mulai <b>'+tglWIB(B)+'</b>'+(isFinite(T)?' sampai <b>'+tglWIB(T)+'</b>':'')+'.</p>'+kembali+'</div>';return;}
 S.phase="pemb";ITEMS.forEach(it=>{S.ans[it.no]=JSON.parse(JSON.stringify(KEYS[it.no-1]));});
 n=Math.min(Math.max(n||1,1),N);const it=ITEMS[n-1];
 const grid='<div class="grid">'+ITEMS.map(x=>'<button class="'+(x.no===n?"cur":"")+'" data-pn="'+x.no+'">'+x.no+'</button>').join("")+'</div>';
 app().innerHTML=head+
  '<div class="card"><p style="margin-top:0">Pelajari setiap soal: jawaban yang benar sudah ditandai, lalu baca pembahasannya. Ketuk nomor untuk berpindah soal.</p>'+grid+
  (isFinite(T)?'<p class="small" style="margin-bottom:0">Pembahasan dapat dibuka sampai '+tglWIB(T)+'.</p>':'')+'</div>'+
  qcard(it,true,false,true)+
  '<div class="card"><div class="pembbox" style="margin-top:0"><div><b>Kunci:</b> '+esc(keyStr(it))+'</div><div class="pembtxt"><b>Pembahasan</b><br>'+mk(PEMB[n-1]||"–")+'</div></div>'+
  '<div class="nav"><button id="pPrev" '+(n===1?"disabled":"")+'>← Sebelumnya</button><button id="pNext" class="pri" '+(n===N?"disabled":"")+'>Berikutnya →</button></div>'+kembali+'</div>';
 const go2=k=>{renderPembahasanPage(k);window.scrollTo(0,0);try{history.replaceState(null,"","#soal-"+k);}catch(e){}};
 document.querySelectorAll("[data-pn]").forEach(b=>b.onclick=()=>go2(+b.dataset.pn));
 $("pPrev").onclick=()=>go2(n-1);$("pNext").onclick=()=>go2(n+1);}
(function init(){
 if(CFG.MODE==="guru"){guruInit();return;}
 if(CFG.MODE==="pembahasan"){const m=/soal-(\d+)/.exec(location.hash||"");renderPembahasanPage(m?+m[1]:1);return;}
 const sv=load();
 if(sv&&sv.phase==="result"){S=Object.assign(fresh(),sv);renderResult();if(!S.kirim||S.kirim.st==="gagal"||S.kirim.st==="proses")kirimRekap();return;}
 renderStart();})();
</script>
