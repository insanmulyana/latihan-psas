<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halaman Guru – Latihan PSAS Ganjil Informatika</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1f2937;--mut:#64748b;--line:#d9dee5;--pri:#0f766e;--pri2:#115e59;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--part:#b45309;--partbg:#fef3c7;--sel:#e0f2fe;--selb:#0284c7;--code:#0f172a;--codebg:#f1f5f9}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--ink:#e2e8f0;--mut:#94a3b8;--line:#334155;--pri:#2dd4bf;--pri2:#5eead4;--ok:#86efac;--okbg:#14532d;--bad:#fca5a5;--badbg:#7f1d1d;--part:#fcd34d;--partbg:#78350f;--sel:#0c4a6e;--selb:#38bdf8;--code:#e2e8f0;--codebg:#0b1220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:12px}
header.top{background:var(--pri);color:#fff;padding:12px 16px;border-radius:10px;margin-bottom:12px}
header.top h1{margin:0;font-size:18px}
header.top small{opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:bold;margin:10px 0 4px}
input[type=text],input[type=number],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:var(--card);color:var(--ink)}
button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:8px;border:1px solid var(--line);padding:9px 14px;background:var(--card);color:var(--ink)}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.pri:hover{background:var(--pri2)}
button:disabled{opacity:.5;cursor:not-allowed}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.timer{font-weight:bold;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin:8px 0}
.grid button{padding:6px 0;font-size:13px;position:relative}
.grid button.done{background:var(--sel);border-color:var(--selb)}
.grid button.cur{outline:2px solid var(--pri);font-weight:bold}
.grid button.flag::after{content:"⚑";position:absolute;top:-6px;right:-2px;font-size:11px;color:var(--bad)}
.grid button.ok{background:var(--okbg);border-color:var(--ok)}
.grid button.bad{background:var(--badbg);border-color:var(--bad)}
.grid button.part{background:var(--partbg);border-color:var(--part)}
.badge{display:inline-block;font-size:11px;font-weight:bold;padding:2px 8px;border-radius:99px;margin-right:4px;color:#fff;vertical-align:middle}
.b-lit{background:#2563eb}.b-num{background:#ea580c}.b-lv{background:#64748b}.b-bt{background:#7c3aed}
.qhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.qno{font-size:20px;font-weight:bold;color:var(--pri)}
.instr{font-size:13px;color:var(--mut);margin:0 0 8px;font-style:italic}
.q{font-weight:bold;margin:10px 0}
table.t{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:#ededed;color:#111}
@media (prefers-color-scheme:dark){table.t th{background:#334155;color:#e2e8f0}}
.tw{overflow-x:auto}
pre{background:var(--codebg);color:var(--code);padding:10px;border-radius:8px;overflow-x:auto;font-size:13px;line-height:1.4;margin:8px 0;border:1px solid var(--line)}
code{font-family:Consolas,Menlo,monospace}
.box{border:1px solid var(--line);border-left:5px solid var(--pri);background:var(--codebg);border-radius:6px;padding:8px 12px;margin:8px 0;font-size:14px}
.boxt{font-weight:bold;color:var(--pri);margin-bottom:4px}
.chat{background:var(--codebg);border-radius:10px;padding:8px;margin:8px 0}
.chat .ct{font-weight:bold;color:var(--pri);padding:4px 8px}
.msg{background:var(--card);border-radius:10px;padding:6px 10px;margin:6px 0;max-width:92%;border:1px solid var(--line)}
.msg.dev{margin-left:auto;background:#dcfce7;color:#14532d}
.msg b{display:block;font-size:12px;color:var(--pri)}
.msg.dev b{color:#166534}
.fig{margin:10px 0;text-align:center}
.fig svg{background:#fff;border-radius:8px;border:1px solid var(--line)}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;margin:6px 0;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--selb)}
.opt.sel{background:var(--sel);border-color:var(--selb)}
.opt .l{font-weight:bold;min-width:22px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;flex-wrap:wrap}
.row .txt{flex:1 1 260px}
.row select{width:auto;min-width:120px}
.bsb{display:flex;gap:6px}
.bsb button.on{background:var(--sel);border-color:var(--selb);font-weight:bold}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap}
.status{display:inline-block;font-weight:bold;padding:3px 10px;border-radius:99px;font-size:13px}
.s-ok{background:var(--okbg);color:var(--ok)}.s-bad{background:var(--badbg);color:var(--bad)}.s-part{background:var(--partbg);color:var(--part)}.s-kos{background:var(--line);color:var(--mut)}
.score{font-size:44px;font-weight:bold;color:var(--pri);line-height:1}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.kv div{background:var(--codebg);border-radius:8px;padding:8px;text-align:center}
.kv b{display:block;font-size:20px}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--pri)}
textarea{width:100%;height:80px;font-family:Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card);color:var(--ink)}
.small{font-size:13px;color:var(--mut)}
.warn{background:var(--partbg);color:var(--part);border-radius:8px;padding:8px 12px;font-size:14px}

/* --- proteksi & tampilan HP --- */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
body.noprint .wrap{display:none}
.bar{gap:8px}
.bar button{padding:7px 10px;font-size:14px}
.opt{min-height:46px;padding:12px}
.opt.ro{cursor:default;opacity:.85}
.opt.ro:hover{border-color:var(--line)}
.opt.ro.sel{opacity:1}
.fig svg{max-width:100%;height:auto}
.fb{margin-top:12px}
.fbmsg{border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:15px;font-weight:normal}
button.cek{width:100%;padding:12px;font-size:16px}
.nav.sticky{position:sticky;bottom:0;z-index:5;background:var(--bg);padding:8px 0 calc(8px + env(safe-area-inset-bottom));margin-top:4px}
.nav.sticky button{flex:1;padding:12px 6px}
button.flagon{background:var(--badbg);border-color:var(--bad);color:var(--bad);font-weight:bold}
.gridcard{padding:8px 12px}
.legend{margin:4px 0 0}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin:0 3px 0 8px}
.lg.done{background:var(--sel);border-color:var(--selb)}.lg.ok{background:var(--okbg);border-color:var(--ok)}.lg.part{background:var(--partbg);border-color:var(--part)}.lg.bad{background:var(--badbg);border-color:var(--bad)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btnrow button{flex:1 1 140px}
.big{width:100%;padding:14px;font-size:17px;margin-top:8px}
a.btn{display:block;text-align:center;text-decoration:none;border-radius:8px;box-sizing:border-box}
a.btn.pri{background:var(--pri);color:#fff}
.emailcard{border:2px solid var(--pri)}
.hasil{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.msg-err{color:var(--bad);font-size:14px;min-height:1em}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .mbox{background:var(--card);color:var(--ink);border-radius:12px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
#modal .mbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#modal .mbtn button{flex:1;padding:12px}
#modal textarea{height:200px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:.92}
@media (max-width:600px){
 body{font-size:15px}
 .wrap{padding:8px}
 header.top{padding:10px 12px}
 header.top h1{font-size:15px}
 header.top small{font-size:12px}
 .card{padding:12px;border-radius:8px}
 .bar{padding:6px 8px;font-size:14px}
 .bar .timer{flex:1 1 100%;text-align:center}
 .bar span{flex:1}
 .qno{font-size:17px}
 table.t{font-size:13px}
 table.t th,table.t td{padding:5px 6px}
 .row .txt{flex:1 1 100%}
 .row select{width:100%;padding:10px}
 .bsb{width:100%}
 .bsb button{flex:1;padding:10px}
 .score{font-size:40px}
 .kv{grid-template-columns:repeat(4,1fr);gap:5px}
 .kv div{padding:6px 2px;font-size:12px}
 .gcol{display:none}
 pre{font-size:12px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(36px,1fr))}
 .grid button{padding:8px 0}
}
@media print{.bar,.nav,button,.emailcard{display:none}}
.pembcard{border:2px solid #7c3aed}
.pembbox{margin-top:10px;background:var(--codebg);border-left:4px solid #7c3aed;border-radius:8px;padding:10px 12px;font-size:15px}
.pembbox div+div{margin-top:6px}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.pembtxt{line-height:1.6}
.pembtxt b{color:var(--ink)}
/* --- halaman guru --- */
.pills{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;background:rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:3px 10px}
.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}
.gtabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding-bottom:2px}
.gtabs button{flex:0 0 auto;padding:9px 12px;border-radius:99px;font-size:14px}
.gtabs button.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:bold}
.gmsg{display:none;border-radius:8px;padding:10px 12px;margin:8px 0;font-size:15px;background:var(--codebg)}
.gmsg.ok{display:block;background:var(--okbg);color:var(--ok)}.gmsg.err{display:block;background:var(--badbg);color:var(--bad)}
.gmsg:not(:empty){display:block}
.editor label{display:block;font-weight:bold;font-size:14px;margin:10px 0 4px;color:var(--ink)}
.eb{border-top:1px dashed var(--line);padding-top:6px;margin-top:8px}
.eb:first-of-type{border-top:0}
.editor textarea,.card textarea{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);resize:vertical}
textarea.mono{font-family:Consolas,Menlo,monospace;font-size:13.5px}
.erow{display:flex;gap:8px;align-items:flex-start;margin:6px 0;flex-wrap:wrap}
.erow textarea{flex:1 1 220px}
.erow select,.erow input{padding:8px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:var(--card);color:var(--ink)}
.erow input{flex:1 1 120px;min-width:0}
.ek{display:inline-flex;align-items:center;gap:4px;font-weight:bold;min-width:34px;padding-top:8px}
.gt td{vertical-align:top}
.gt input[type=datetime-local]{width:100%;box-sizing:border-box;padding:8px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.qb{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}.qb button{font-size:12.5px;padding:5px 8px}
table.rk{font-size:13px}table.rk td.ok{color:var(--ok);font-weight:bold}table.rk td.no{color:var(--bad);font-weight:bold}
table.rk tr.low td{background:var(--badbg)}
.sticky-save{position:sticky;bottom:0;z-index:5;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
details summary{cursor:pointer;font-weight:bold;margin-top:10px}
@media (max-width:600px){.gt thead{display:none}.gt tr{display:block;border-bottom:1px solid var(--line);padding:6px 0}.gt td{display:block;border:0}}
.sticky-save{padding:8px 12px!important}.sticky-save .btnrow{margin:0}
@media (max-width:600px){.sticky-save p.small{display:none}.sticky-save button.big{padding:10px;font-size:15px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
const CFG={
 VERSI:1,
 TINGKAT:"XII",
 KELAS:["XII-F1"],
 BUKA:"",
 TUTUP:"",
 DURASI:120,
 MAKS_CEK:3,
 MAKS_PERCOBAAN:2,
 MAKS_KELUAR:0,
 EMAIL_GURU:"insanmulyana@gmail.com",
 EMAIL_KELAS:{},
 MODE:"guru",
 PEMB_BUKA:"",
 PEMB_TUTUP:"",
 URL_REKAP:""
};
const ITEMS=[];
const KEYB64="W10=";
const PEMB64="W10=";
/* ---------- render blok stimulus ---------- */
function blocks(bl){return bl.map(b=>{
 if(b[0]==="p")return "<p>"+mk(b[1])+"</p>";
 if(b[0]==="table"){return '<div class="tw"><table class="t"><thead><tr>'+b[1].map(h=>"<th>"+mk(h)+"</th>").join("")+"</tr></thead><tbody>"+b[2].map(r=>"<tr>"+r.map(c=>"<td>"+mk(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>";}
 if(b[0]==="code")return "<pre><code>"+esc(b[1])+"</code></pre>";
 if(b[0]==="box")return '<div class="box"><div class="boxt">'+esc(b[1])+"</div><div>"+mk(b[2])+"</div></div>";
 if(b[0]==="img")return '<figure class="fig">'+b[2]+"</figure>";
 if(b[0]==="chat")return '<div class="chat"><div class="ct">'+esc(b[1])+"</div>"+b[2].map(m=>'<div class="msg'+(/Tim Pengembang/.test(m[0])?" dev":"")+'"><b>'+esc(m[0])+"</b>"+mk(m[1])+"</div>").join("")+"</div>";
 return "";}).join("");}

/* =====================================================================
   HALAMAN GURU (/guru)
   - Pratinjau soal + kunci + pembahasan
   - Jadwal & akses (buka/tutup latihan dan pembahasan)
   - Edit soal (disimpan langsung ke repo GitHub lewat API)
   - Rekap nilai (Google Apps Script, dilindungi kata sandi guru)
   ===================================================================== */
const GH={owner:"insanmulyana",repo:"latihan-psas",branch:"main"};
const VERS=[{id:"xi-v1",t:"XI",v:1},{id:"xi-v2",t:"XI",v:2},{id:"xii-v1",t:"XII",v:1},{id:"xii-v2",t:"XII",v:2}];
const JML_SISWA=36;
const KELAS_T={XI:["XI-F1","XI-F2","XI-F3","XI-F5"],XII:["XII-F1","XII-F4","XII-F6","XII-F8"]};
const G={tab:"pratinjau",file:"xii-v1",no:1,data:{},orig:{},index:"",sched:null,schedOrig:"",token:"",rekapUrl:"",kunci:"",ingat:false,rekap:null,busy:false};

/* ---------- utilitas ---------- */
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\s/g,"")),c=>c.charCodeAt(0)));
const b64enc=s=>{const b=new TextEncoder().encode(s);let r="";for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(r);};
const clone=o=>JSON.parse(JSON.stringify(o));
const vinfo=id=>VERS.find(x=>x.id===id);
function gLoadSettings(){try{const raw=localStorage.getItem("psas_guru")||sessionStorage.getItem("psas_guru");const o=raw?JSON.parse(raw):{};G.token=o.token||"";G.rekapUrl=o.rekapUrl||"";G.kunci=o.kunci||"";G.ingat=!!o.ingat;}catch(e){}}
function gSaveSettings(){const o=JSON.stringify({token:G.token,rekapUrl:G.rekapUrl,kunci:G.kunci,ingat:G.ingat});try{localStorage.removeItem("psas_guru");sessionStorage.removeItem("psas_guru");(G.ingat?localStorage:sessionStorage).setItem("psas_guru",o);}catch(e){}}
function isoToLocal(iso){if(!iso)return"";const t=Date.parse(iso);if(isNaN(t))return"";const d=new Date(t+7*3600000);return d.toISOString().slice(0,16);}
function localToIso(v,orig){if(orig&&isoToLocal(orig)===v)return orig;return v?v+":00+07:00":"";}
function nowLocal(){return new Date(Date.now()+7*3600000).toISOString().slice(0,16);}
function addDay(v){if(!v)return v;const t=Date.parse(v+":00+07:00")+86400000;return new Date(t+7*3600000).toISOString().slice(0,16);}
function status(b,t){const n=Date.now(),B=b?Date.parse(b):0,T=t?Date.parse(t):Infinity;return n<B?["Belum dibuka","s-kos"]:(n>T?["Ditutup","s-bad"]:["Dibuka","s-ok"]);}
function flash(msg,kind){const el=$("gmsg");if(!el)return;el.className="gmsg "+(kind||"");el.innerHTML=msg;el.scrollIntoView({behavior:"smooth",block:"nearest"});}

/* ---------- GitHub API ---------- */
async function gh(path,opt){opt=opt||{};
 const r=await fetch("https://api.github.com/repos/"+GH.owner+"/"+GH.repo+path,Object.assign({},opt,{headers:Object.assign({"Accept":"application/vnd.github+json","Authorization":"Bearer "+G.token,"X-GitHub-Api-Version":"2022-11-28"},opt.body?{"Content-Type":"application/json"}:{})}));
 if(!r.ok){let m="";try{m=(await r.json()).message;}catch(e){}const err=new Error(r.status+(m?" – "+m:""));err.status=r.status;throw err;}
 return r.status===204?null:r.json();}
async function ambilFile(name){
 if(G.token){const j=await gh("/contents/"+name+"?ref="+GH.branch);return b64dec(j.content);}
 const r=await fetch(name+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("Gagal memuat "+name+" ("+r.status+")");return r.text();}
async function commitFiles(files,msg){
 const ref=await gh("/git/ref/heads/"+GH.branch);const base=ref.object.sha;
 const c=await gh("/git/commits/"+base);
 const tree=await gh("/git/trees",{method:"POST",body:JSON.stringify({base_tree:c.tree.sha,tree:Object.keys(files).map(p=>({path:p,mode:"100644",type:"blob",content:files[p]}))})});
 const nc=await gh("/git/commits",{method:"POST",body:JSON.stringify({message:msg,tree:tree.sha,parents:[base]})});
 await gh("/git/refs/heads/"+GH.branch,{method:"PATCH",body:JSON.stringify({sha:nc.sha})});
 return nc.sha;}
function errText(e){const s=String(e&&e.message||e);
 if(/^401/.test(s))return "Token GitHub tidak valid atau sudah kedaluwarsa. Buat token baru di tab Pengaturan.";
 if(/^403|^404/.test(s))return "Token tidak punya izin menulis ke repo latihan-psas. Pastikan izin <b>Contents: Read and write</b> untuk repo latihan-psas.";
 if(/^409|^422/.test(s))return "Ada perubahan lain yang tersimpan bersamaan. Muat ulang halaman, lalu coba lagi.";
 return esc(s);}

/* ---------- membaca & menulis isi file latihan ---------- */
function parseFile(txt){
 const cfg=/const CFG=\{[\s\S]*?\n\};/.exec(txt),it=/const ITEMS=(\[[\s\S]*?\]);\nconst KEYB64=/.exec(txt),k=/const KEYB64="([^"]*)"/.exec(txt),p=/const PEMB64="([^"]*)"/.exec(txt);
 if(!cfg||!it||!k||!p)throw new Error("Format file latihan tidak dikenali");
 const f=n=>{const m=new RegExp("\\n "+n+':"([^"]*)"').exec(cfg[0]);return m?m[1]:"";};
 return{cfg:{BUKA:f("BUKA"),TUTUP:f("TUTUP"),PEMB_BUKA:f("PEMB_BUKA"),PEMB_TUTUP:f("PEMB_TUTUP"),URL_REKAP:f("URL_REKAP")},items:JSON.parse(it[1]),keys:JSON.parse(b64dec(k[1])),pemb:JSON.parse(b64dec(p[1]))};}
function applyTo(txt,d){
 if(d.items)txt=txt.replace(/const ITEMS=\[[\s\S]*?\];\nconst KEYB64=/,()=>"const ITEMS="+JSON.stringify(d.items).replace(/<\/script/gi,"<\\/script")+";\nconst KEYB64=");
 if(d.keys)txt=txt.replace(/const KEYB64="[^"]*"/,()=>'const KEYB64="'+b64enc(JSON.stringify(d.keys))+'"');
 if(d.pemb)txt=txt.replace(/const PEMB64="[^"]*"/,()=>'const PEMB64="'+b64enc(JSON.stringify(d.pemb))+'"');

function validasi(it,k){

/* ---------- komunikasi dengan rekap Google Sheet (JSONP) ---------- */
function jsonp(params,ms){
 if(!CFG.URL_REKAP)return Promise.reject(new Error("nonaktif"));
 const cb="psascb_"+uid(),q=new URLSearchParams(Object.assign({},params,{callback:cb}));
 const u=CFG.URL_REKAP+(CFG.URL_REKAP.indexOf("?")>=0?"&":"?")+q.toString();
 /* fetch tanpa cookie: tidak terganggu bila browser login dengan beberapa akun Google */
 const lewatFetch=new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error("waktu habis")),ms||15000);
  fetch(u,{credentials:"omit",cache:"no-store",redirect:"follow"}).then(r=>{if(!r.ok)throw new Error("server "+r.status);return r.text();})
  .then(x=>{const m=/^\s*[\w$]+\(([\s\S]*)\)\s*;?\s*$/.exec(x);if(!m)throw new Error("balasan bukan data");clearTimeout(t);res(JSON.parse(m[1]));})
  .catch(e=>{clearTimeout(t);rej(e);});});
 return lewatFetch.catch(e=>{if(params.action==="tambah"||/waktu habis/.test(e.message))throw e;return jsonpScript(params,ms);});}
function jsonpScript(params,ms){return new Promise((res,rej)=>{
 if(!CFG.URL_REKAP){rej(new Error("nonaktif"));return;}
 const cb="psascb_"+uid();const s=document.createElement("script");let done=false;
 const fin=(f,v)=>{if(done)return;done=true;window[cb]=function(){};s.remove();f(v);};
 window[cb]=d=>fin(res,d);s.onerror=()=>fin(rej,new Error("jaringan"));
 setTimeout(()=>fin(rej,new Error("waktu habis")),ms||15000);
 const q=new URLSearchParams(Object.assign({},params,{callback:cb}));
 s.src=CFG.URL_REKAP+(CFG.URL_REKAP.indexOf("?")>=0?"&":"?")+q.toString();document.body.appendChild(s);});}

function scoreItem(it){
 const a=S.ans[it.no],k=KEYS[it.no-1];let skor=0;
 if(!answered(it))return{skor:0,status:"Kosong",jawab:""};
 if(it.type==="pg"){skor=a===k?it.maks:0;}
 else if(it.type==="pgk"){const set=new Set(a),ks=new Set(k);let t=0;for(let i=0;i<5;i++)if(set.has(i)===ks.has(i))t++;skor=it.maks*t/5;}
 else{let t=0;k.forEach((x,i)=>{if(a[i]===x)t++;});skor=it.maks*t/k.length;}
 skor=Math.round(skor*1000)/1000;
 const status=skor>=it.maks-1e-9?"Benar":(skor<=1e-9?"Salah":"Sebagian");
 return{skor,status,jawab:ansStr(it,a)};}
function hitung(){
 const rows=ITEMS.map(it=>{const r=scoreItem(it);return Object.assign({it},r);});
 const total=Math.round(rows.reduce((s,r)=>s+r.skor,0)*100)/100;
 return{rows,total};}

/* ---------- pemeriksaan per soal (maks CFG.MAKS_CEK kali, tanpa kunci) ---------- */
function cek(no){return S.chk[no]||null;}
function terkunci(it){const c=cek(it.no);return !!c&&(c.st==="Benar"||c.n>=CFG.MAKS_CEK);}
function berubah(it){const c=cek(it.no);return !c||c.last!==JSON.stringify(S.ans[it.no]);}
function periksa(it){
 if(terkunci(it)||!lengkap(it)||!berubah(it))return;
 const r=scoreItem(it);const c=S.chk[it.no]||{n:0};
 c.n++;c.last=JSON.stringify(S.ans[it.no]);c.st=r.status;c.skor=r.skor;S.chk[it.no]=c;save();renderQuiz();
 const fb=$("fb");if(fb)fb.scrollIntoView({behavior:"smooth",block:"center"});}
function feedback(it){
 const c=cek(it.no),sisa=CFG.MAKS_CEK-(c?c.n:0);
 let h="";
 if(c){const cls={Benar:"s-ok",Sebagian:"s-part",Salah:"s-bad"}[c.st];
  const judul={Benar:"✓ Jawabanmu benar!",Sebagian:"◐ Jawabanmu sebagian benar.",Salah:"✗ Jawabanmu belum tepat."}[c.st];
  h+='<div class="fbmsg '+cls+'"><b>'+judul+'</b> Skor soal ini: '+num(c.skor)+" dari "+it.maks+".";
  if(c.st!=="Benar")h+=sisa>0?"<br>Sisa kesempatan memeriksa: <b>"+sisa+"</b>. Ubah jawabanmu, lalu periksa lagi.":"<br>Kesempatan memeriksa sudah habis. Jawaban ini yang dinilai.";
  h+="</div>";}
 if(!terkunci(it)){
  const bisa=lengkap(it)&&berubah(it);
  const lbl=!lengkap(it)?(answered(it)?"Lengkapi semua bagian dulu":"Pilih jawaban dulu"):(!berubah(it)?"Ubah jawaban untuk memeriksa lagi":(c?"Periksa lagi":"Periksa jawaban")+" ("+sisa+"× tersisa)");
  h+='<button id="btnCek" class="cek'+(bisa?" pri":"")+'" '+(bisa?"":"disabled")+">"+lbl+"</button>";}
 return '<div id="fb" class="fb">'+h+"</div>";}

/* ---------- widget jawaban ---------- */
function widget(it,ro,show){
 const a=S.ans[it.no];let h="";const dis=ro?"disabled":"";const k=KEYS[it.no-1];
 const mark=(ok,kt)=>show?(ok?' <span class="status s-ok">benar</span>':' <span class="status s-bad">kunci: '+kt+"</span>"):"";
 if(it.type==="pg"){
  h=it.opts.map((o,i)=>'<div class="opt'+(a===i?" sel":"")+(ro?" ro":"")+(show?(i===k?" right":(a===i?" wrong":"")):"")+'" data-act="pg" data-i="'+i+'"><span class="l">'+L[i]+'.</span><span>'+mk(o)+"</span></div>").join("");}
 else if(it.type==="pgk"){
  const set=new Set(a||[]);
  h=it.opts.map((o,i)=>'<div class="opt'+(set.has(i)?" sel":"")+(ro?" ro":"")+(show?(k.includes(i)?" right":(set.has(i)?" wrong":"")):"")+'" data-act="pgk" data-i="'+i+'"><span class="l">'+(set.has(i)?"☑":"☐")+" "+L[i]+'.</span><span>'+mk(o)+"</span></div>").join("");}
 else if(it.type==="jodoh"){
  h='<div class="tw"><table class="t"><thead><tr><th>Pilihan di kolom kanan</th></tr></thead><tbody>'+it.right.map((r,i)=>"<tr><td><b>"+L[i]+".</b> "+mk(r)+"</td></tr>").join("")+"</tbody></table></div>";
  h+=it.left.map((l,i)=>{const v=a?a[i]:null;
   return '<div class="row"><div class="txt"><b>'+(i+1)+".</b> "+mk(l)+"</div><select "+dis+' data-act="jodoh" data-k="'+i+'"><option value="">– pilih –</option>'+it.right.map((r,j)=>'<option value="'+j+'"'+(v===j?" selected":"")+">"+L[j]+"</option>").join("")+"</select>"+mark(v===k[i],L[k[i]])+"</div>";}).join("");}
 else if(it.type==="urut"){
  h='<div class="tw"><table class="t"><tbody>'+it.items.map((r,i)=>"<tr><td><b>("+L[i]+")</b> "+mk(r)+"</td></tr>").join("")+"</tbody></table></div><p class='small'>Pilih huruf untuk tiap urutan (1 = paling awal).</p>";
  h+=it.items.map((_,i)=>{const v=a?a[i]:null;
   return '<div class="row"><div class="txt"><b>Urutan ke-'+(i+1)+"</b></div><select "+dis+' data-act="urut" data-k="'+i+'"><option value="">– pilih –</option>'+it.items.map((r,j)=>'<option value="'+j+'"'+(v===j?" selected":"")+">"+L[j]+"</option>").join("")+"</select>"+mark(v===k[i],L[k[i]])+"</div>";}).join("");
  if(a){const used=a.filter(x=>x!=null);if(new Set(used).size!==used.length)h+='<div class="warn">Ada huruf yang dipakai lebih dari satu kali. Periksa kembali urutanmu.</div>';}}
 else if(it.type==="bs"){
  h='<div class="tw"><table class="t"><thead><tr><th>No</th><th>Pernyataan</th></tr></thead><tbody>'+it.stmts.map((s,i)=>"<tr><td>"+(i+1)+"</td><td>"+mk(s)+"</td></tr>").join("")+"</tbody></table></div>";
  h+=it.stmts.map((s,i)=>{const v=a?a[i]:null;
   return '<div class="row"><div class="txt"><b>Pernyataan '+(i+1)+'</b></div><div class="bsb"><button '+dis+' class="'+(v===true?"on":"")+'" data-act="bs" data-k="'+i+'" data-v="1">Benar</button><button '+dis+' class="'+(v===false?"on":"")+'" data-act="bs" data-k="'+i+'" data-v="0">Salah</button></div>'+mark(v===k[i],k[i]?"Benar":"Salah")+'</div>';}).join("");}
 return h;}

function instr(it){
 return {pg:"Pilih satu jawaban yang paling tepat.",pgk:"Pilih SEMUA jawaban yang benar (lebih dari satu).",jodoh:"Pasangkan setiap pernyataan dengan satu pilihan. Ada pilihan yang tidak terpakai.",urut:"Susun urutan yang benar dengan memilih huruf pada tiap urutan.",bs:"Tentukan setiap pernyataan Benar atau Salah."}[it.type];}
function badges(it){let h='<span class="badge b-bt">'+BNAMA[it.type]+'</span><span class="badge b-lv">'+it.level+"</span>";
 if(it.la.indexOf("Literasi")>=0)h+='<span class="badge b-lit">LITERASI</span>';
 if(it.la.indexOf("Numerasi")>=0)h+='<span class="badge b-num">NUMERASI</span>';return h;}
function qcard(it,ro,fb,show){
 return '<div class="card qcard"><div class="qhead"><span class="qno">Soal '+it.no+' <span class="small">/ '+N+'</span></span><span>'+badges(it)+'</span></div><p class="instr">'+instr(it)+" (skor maks "+it.maks+")</p>"+blocks(it.stim)+(it.q?'<p class="q">'+mk(it.q)+"</p>":"")+widget(it,ro,show)+(fb?feedback(it):"")+"</div>";}

async function mulai(){
 if(belumBuka()||sudahTutup()){renderStart();return;}
 const nm=$("nm").value.trim().replace(/\s+/g," "),ab=$("ab").value.trim(),kl=$("kl").value,msg=$("msg");
 if(nm.length<3){msg.textContent="Isi nama lengkap (minimal 3 huruf).";return;}
 if(!/^\d{1,2}$/.test(ab)){msg.textContent="Isi nomor absen dengan angka.";return;}
 layarPenuh();
 const key=siswaKey(kl,ab),id=uid(),lokal=attCount(key);
 const btn=$("btnStart");btn.disabled=true;btn.textContent="Memeriksa kesempatan…";msg.textContent="";
 let ke=lokal+1,boleh=lokal<CFG.MAKS_PERCOBAAN,dariServer=false;
 try{const r=await jsonp({action:"mulai",id:id,kelas:kl,absen:ab,nama:nm,versi:CFG.VERSI,maks:CFG.MAKS_PERCOBAAN},10000);
  if(r&&r.ok){dariServer=true;boleh=!!r.boleh;ke=r.ke;}}catch(e){}
 if(!boleh){btn.disabled=false;btn.textContent="Mulai";keluarLayarPenuh();
  msg.innerHTML="Kesempatan mengerjakan untuk <b>"+esc(kl)+" absen "+esc(ab)+"</b> sudah habis ("+CFG.MAKS_PERCOBAAN+" kali). Hubungi guru jika perlu tambahan kesempatan."+(dariServer?"":"");return;}
 attAdd(key,id);
 S=fresh({nama:nm,kelas:kl,absen:ab});S.phase="quiz";S.t0=Date.now();S.dur=parseInt($("du").value,10);S.id=id;S.ke=ke;
 save();renderQuiz();}

function remaining(){if(!S.dur)return null;return Math.max(0,S.t0+S.dur*60000-Date.now());}
function fmt(ms){const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60);}
function tick(){const el=$("timer");if(!el||S.phase!=="quiz")return;
 const r=remaining();el.textContent="⏱ "+fmt(r);el.className="timer"+(r<600000?" low":"");
 if(r<=0){clearInterval(timerId);submit(true,"Waktu habis");}}
function gridHtml(mode){return '<div class="grid">'+ITEMS.map(it=>{let c="";
 if(mode==="quiz"){const k=cek(it.no);if(k)c+=k.st==="Benar"?" ok":(k.st==="Sebagian"?" part":" bad");else if(answered(it))c+=" done";if(S.flag[it.no])c+=" flag";if(it.no===S.cur)c+=" cur";}
 else{const r=scoreItem(it);c+=r.status==="Benar"?" ok":(r.status==="Sebagian"?" part":" bad");if(it.no===S.rev)c+=" cur";}
 return '<button class="'+c+'" data-go="'+it.no+'">'+it.no+"</button>";}).join("")+"</div>";}
function renderQuiz(){
 const it=ITEMS[S.cur-1];const nAns=ITEMS.filter(answered).length;const ro=terkunci(it);
 app().innerHTML=header()+'<div class="bar"><span class="timer" id="timer"></span><span>Terjawab <b>'+nAns+"</b>/"+N+'</span><button id="btnGrid">'+(S.grid?"Tutup daftar ▴":"Daftar soal ▾")+'</button><button id="btnFin" class="pri">Kumpulkan</button></div>'+
 (S.grid?'<div class="card gridcard">'+gridHtml("quiz")+'<p class="small legend"><i class="lg done"></i>dijawab <i class="lg ok"></i>benar <i class="lg part"></i>sebagian <i class="lg bad"></i>salah ⚑ ragu</p></div>':"")+qcard(it,ro,true)+
 '<div class="nav sticky"><button id="btnPrev" '+(S.cur===1?"disabled":"")+'>← Sebelum</button><button id="btnFlag" class="'+(S.flag[S.cur]?"flagon":"")+'">⚑ '+(S.flag[S.cur]?"Ragu":"Tandai")+'</button><button id="btnNext" class="pri" '+(S.cur===N?"disabled":"")+'>Berikut →</button></div>';
 $("btnPrev").onclick=()=>go(S.cur-1);$("btnNext").onclick=()=>go(S.cur+1);$("btnFin").onclick=()=>submit(false);
 $("btnGrid").onclick=()=>{S.grid=!S.grid;save();renderQuiz();};
 $("btnFlag").onclick=()=>{S.flag[S.cur]=!S.flag[S.cur];save();renderQuiz();};
 if($("btnCek"))$("btnCek").onclick=()=>periksa(it);
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{if(window.innerWidth<=700)S.grid=false;go(parseInt(b.dataset.go,10));});
 if(!ro)bindInputs(it);
 clearInterval(timerId);tick();timerId=setInterval(tick,1000);}
function go(n){if(n<1||n>N)return;S.cur=n;save();renderQuiz();window.scrollTo(0,0);}
function rerenderKeep(){const y=window.scrollY;renderQuiz();window.scrollTo(0,y);}
function bindInputs(it){
 document.querySelectorAll("[data-act]").forEach(el=>{
  const act=el.dataset.act;
  if(act==="pg")el.onclick=()=>{S.ans[it.no]=(S.ans[it.no]===+el.dataset.i)?null:+el.dataset.i;save();rerenderKeep();};
  if(act==="pgk")el.onclick=()=>{const s=new Set(S.ans[it.no]||[]);const i=+el.dataset.i;s.has(i)?s.delete(i):s.add(i);S.ans[it.no]=[...s].sort();save();rerenderKeep();};
  if(act==="jodoh"||act==="urut")el.onchange=()=>{const n=it.type==="jodoh"?it.left.length:it.items.length;const a=S.ans[it.no]||Array(n).fill(null);a[+el.dataset.k]=el.value===""?null:+el.value;S.ans[it.no]=a;save();rerenderKeep();};
  if(act==="bs")el.onclick=()=>{const a=S.ans[it.no]||it.stmts.map(()=>null);const k=+el.dataset.k,v=el.dataset.v==="1";a[k]=(a[k]===v)?null:v;S.ans[it.no]=a;save();rerenderKeep();};});}

function submit(auto,alasan){
 if(S.phase!=="quiz")return;
 const nAns=ITEMS.filter(answered).length;
 const lanjut=()=>{clearInterval(timerId);const h=hitung();
  S.phase="result";S.res={total:h.total,t1:Date.now(),alasan:alasan||"Dikumpulkan siswa"};S.rev=null;S.kirim={st:"proses"};save();
  keluarLayarPenuh();renderResult();window.scrollTo(0,0);kirimRekap();
  if(auto)modal("<h3 style='margin-top:0'>Jawaban dikumpulkan otomatis</h3><p>"+esc(alasan)+".</p>","Lihat nilai");};
 if(auto){lanjut();return;}
 const kosong=N-nAns;
 tanya("<h3 style='margin-top:0'>Kumpulkan jawaban?</h3><p>"+(kosong>0?"Masih ada <b>"+kosong+" soal</b> belum dijawab. ":"")+"Setelah dikumpulkan, jawaban tidak dapat diubah.</p>","Ya, kumpulkan",lanjut);}

/* ---------- hasil ---------- */
function ringkas(){const h=hitung();const c={Benar:0,Sebagian:0,Salah:0,Kosong:0};h.rows.forEach(r=>c[r.status]++);
 const dur=Math.round((S.res.t1-S.t0)/600)/100;let nc=0;Object.values(S.chk).forEach(x=>nc+=x.n);return{h,c,dur,nc};}
function kirimRekap(){
 if(!CFG.URL_REKAP){S.kirim={st:"nonaktif"};save();statusKirim();return;}
 const {h,c,dur,nc}=ringkas();S.kirim={st:"proses"};statusKirim();
 jsonp({action:"kirim",id:S.id,versi:CFG.VERSI,nama:S.ident.nama,kelas:S.ident.kelas,absen:S.ident.absen,ke:S.ke,
  mulai:stamp(new Date(S.t0)),selesai:stamp(new Date(S.res.t1)),durasi:dur,nilai:h.total,benar:c.Benar,sebagian:c.Sebagian,salah:c.Salah,kosong:c.Kosong,
  keluar:S.keluar||0,cek:nc,alasan:S.res.alasan,skor:h.rows.map(r=>r.skor).join("|"),maks:h.rows.map(r=>r.it.maks).join("|"),jawab:h.rows.map(r=>r.jawab).join("|")},60000)
 .then(r=>{S.kirim={st:(r&&r.ok)?"ok":"gagal",t:Date.now(),e:r&&r.error};save();statusKirim();})
 .catch(e=>{S.kirim={st:"gagal",e:String(e.message||e)};save();statusKirim();});}
function statusKirim(){const el=$("kst");if(!el)return;const st=S.kirim?S.kirim.st:"";
 if(st==="ok")el.innerHTML='<div class="fbmsg s-ok">✓ Nilaimu sudah tercatat otomatis di rekap guru.</div>';
 else if(st==="proses")el.innerHTML='<div class="fbmsg s-kos">⏳ Mengirim nilai ke rekap guru…</div>';
 else if(st==="nonaktif")el.innerHTML="";
 else{el.innerHTML='<div class="fbmsg s-bad">⚠ Nilai belum terkirim ke rekap guru (periksa koneksi internet, lalu tekan Kirim ulang).'+(S.kirim&&S.kirim.e?'<br><small>Keterangan: '+esc(S.kirim.e)+'</small>':'')+'<div class="btnrow"><button id="btnRetry" class="pri">Kirim ulang</button></div></div>';$("btnRetry").onclick=kirimRekap;}}
function kodeHasil(){const {h}=ringkas();const o={v:CFG.VERSI,n:S.ident.nama,k:S.ident.kelas,a:S.ident.absen,p:S.ke,t:h.total,x:S.keluar||0,w:stamp(new Date(S.res.t1)),s:h.rows.map(r=>r.skor)};
 return "PSAS"+CFG.TINGKAT+":"+btoa(unescape(encodeURIComponent(JSON.stringify(o))));}
function mailtoHref(){const {h,c,dur}=ringkas();
 const subj="Hasil Latihan PSAS Informatika "+CFG.TINGKAT+" V"+CFG.VERSI+" - "+S.ident.kelas+" - "+S.ident.absen+" - "+S.ident.nama;
 const body=["Yth. Bapak/Ibu Guru Informatika,","","Berikut hasil latihan PSAS Ganjil saya.","",
  "Nama: "+S.ident.nama,"Kelas: "+S.ident.kelas,"No. absen: "+S.ident.absen,"Versi soal: "+CFG.VERSI,"Percobaan ke: "+S.ke+" dari "+CFG.MAKS_PERCOBAAN,"",
  "NILAI: "+num(h.total),"Benar penuh: "+c.Benar+" | Sebagian: "+c.Sebagian+" | Salah: "+c.Salah+" | Tidak dijawab: "+c.Kosong,
  "Mulai: "+stamp(new Date(S.t0)),"Selesai: "+stamp(new Date(S.res.t1))+" ("+num(dur)+" menit)","Keluar halaman: "+(S.keluar||0)+" kali","Keterangan: "+S.res.alasan+(S.bukaPemb?" | pembahasan dibuka lebih awal":""),"",
  "Kode hasil (jangan diubah):",kodeHasil(),"","Terima kasih."].join("\n");
 return "mailto:"+emailGuru()+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);}
function csvEsc(v){v=String(v==null?"":v);return /[",;\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCSV(){
 const {h,dur}=ringkas();
 const head=["versi","nama","kelas","no_absen","percobaan_ke","waktu_mulai","waktu_selesai","durasi_menit","keluar_halaman","no_soal","bentuk","kode_tp","materi","level","jawaban_siswa","status","skor","skor_maks","nilai_total"];
 const lines=[head.join(",")];
 h.rows.forEach(r=>{const it=r.it;lines.push([CFG.VERSI,S.ident.nama,S.ident.kelas,S.ident.absen,S.ke,stamp(new Date(S.t0)),stamp(new Date(S.res.t1)),dur,S.keluar||0,it.no,BNAMA[it.type],it.tp,it.materi,it.level,r.jawab,r.status,r.skor,it.maks,h.total].map(csvEsc).join(","));});
 return lines.join("\r\n");}
function download(name,text){const b=new Blob(["﻿"+text],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function safe(s){return String(s).replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,30);}
function persen(a,b){return b?Math.round(a/b*1000)/10:0;}
function renderResult(){
 const {h,c}=ringkas();const rows=h.rows;
 const grp=(keyf)=>{const m={};rows.forEach(r=>{const k=keyf(r.it);m[k]=m[k]||{s:0,m:0};m[k].s+=r.skor;m[k].m+=r.it.maks;});return m;};
 const bar=(m)=>Object.keys(m).sort().map(k=>"<tr><td>"+esc(k)+"</td><td>"+num(m[k].s)+" / "+m[k].m+"</td><td class='gcol'><div class='prog'><i style='width:"+persen(m[k].s,m[k].m)+"%'></i></div></td><td>"+String(persen(m[k].s,m[k].m)).replace(".",",")+"%</td></tr>").join("");
 const tpMap=grp(i=>i.tp);const byBentuk=grp(i=>BNAMA[i.type]);const byKat=grp(i=>i.kat);const byLN=grp(i=>i.la==="-"?"Tanpa muatan khusus":i.la);
 const kk=h.total>=78?"Mencapai KKTP (≥ 78)":"Belum mencapai KKTP (< 78)";
 const sisa=S.bukaPemb?0:CFG.MAKS_PERCOBAAN-S.ke;const pemb=pembTerbuka();
 let body=header()+'<div class="card"><div class="hasil"><div><div class="small">Nilai latihan</div><div class="score">'+num(h.total)+'</div><div class="small">dari 100 • '+kk+'</div></div><div><b>'+esc(S.ident.nama)+'</b><br><span class="small">'+esc(S.ident.kelas)+" • absen "+esc(S.ident.absen)+" • Versi "+CFG.VERSI+"<br>Percobaan ke-"+S.ke+" dari "+CFG.MAKS_PERCOBAAN+" • keluar halaman "+(S.keluar||0)+"×</span></div></div>"+
 '<div class="kv"><div><b style="color:var(--ok)">'+c.Benar+'</b>Benar</div><div><b style="color:var(--part)">'+c.Sebagian+'</b>Sebagian</div><div><b style="color:var(--bad)">'+c.Salah+'</b>Salah</div><div><b>'+c.Kosong+'</b>Kosong</div></div>'+
 (S.res.alasan!=="Dikumpulkan siswa"?'<p class="warn">Dikumpulkan otomatis: '+esc(S.res.alasan)+".</p>":"")+'<div id="kst"></div></div>'+
 '<div class="card emailcard"><h3 style="margin-top:0">📧 Langkah terakhir: kirim hasil ke email guru</h3><p>Tekan tombol di bawah. Aplikasi email (Gmail) akan terbuka dengan isi yang sudah terisi otomatis. Cukup tekan <b>Kirim</b> dan jangan ubah isinya.</p>'+
 '<a id="btnMail" class="btn pri big" href="'+esc(mailtoHref())+'">Kirim ke '+esc(emailGuru())+'</a>'+
 '<div class="btnrow"><button id="btnCsv">⬇ Unduh CSV</button><button id="btnCopy">Salin isi email</button></div><p class="small">Jika aplikasi email tidak terbuka, tekan <b>Salin isi email</b>, lalu tempel dan kirim secara manual ke '+esc(emailGuru())+'.</p></div>'+
 '<div class="card pembcard"><h3 style="margin-top:0">📖 Kunci dan pembahasan</h3>'+(pembLewat()?'<p>Pembahasan sudah <b>ditutup</b> sejak '+tglWIB(Date.parse(CFG.PEMB_TUTUP))+' karena hari ujian PSAS. Selamat mengerjakan ujian!</p>':pemb?'<p><b>Pembahasan sudah terbuka.</b> Ketuk nomor soal pada peta soal di bawah untuk melihat soal, jawabanmu, kunci, dan pembahasannya. Pelajari terutama soal yang berwarna merah dan kuning.</p><button id="btnPemb1" class="pri">Mulai dari soal nomor 1</button>':
   '<p>Kamu masih punya <b>'+sisa+' kesempatan</b> mengulang'+(isFinite(T_TUTUP)?' sampai '+tglWIB(T_TUTUP):'')+'. Kunci dan pembahasan terbuka otomatis setelah kesempatanmu habis'+(isFinite(T_TUTUP)?' atau setelah latihan ditutup':'')+'.</p><div class="btnrow"><button id="btnNew" class="pri">Ulangi latihan</button><button id="btnBukaPemb">Buka pembahasan sekarang</button></div><p class="small">Bila pembahasan dibuka sekarang, kesempatan mengulang <b>hangus</b> dan tercatat di rekap guru.</p>')+'</div>'+
 '<div class="card"><h3 style="margin-top:0">Peta soal</h3><p class="small legend"><i class="lg ok"></i>benar <i class="lg part"></i>sebagian <i class="lg bad"></i>salah/kosong</p>'+gridHtml("res")+'<p class="small">Ketuk nomor untuk melihat kembali soal dan jawabanmu'+(pemb?' beserta kunci dan pembahasannya':'')+'.</p></div>';
 if(S.rev){const it=ITEMS[S.rev-1];const r=scoreItem(it);const cls={Benar:"s-ok",Sebagian:"s-part",Salah:"s-bad",Kosong:"s-kos"}[r.status];
  body+='<div id="revbox">'+qcard(it,true,false,pemb)+'<div class="card"><span class="status '+cls+'">'+r.status+"</span> Skor: <b>"+num(r.skor)+" / "+it.maks+"</b>"+
   (pemb?'<div class="pembbox"><div><b>Kunci:</b> '+esc(keyStr(it))+'</div><div class="pembtxt"><b>Pembahasan</b><br>'+mk(PEMB[it.no-1]||"–")+'</div></div>':'<p class="small">'+(pembLewat()?'Pembahasan sudah ditutup karena hari ujian PSAS.':'Kunci dan pembahasan terbuka setelah kesempatan mengerjakanmu habis.')+'</p>')+
   '<div class="nav"><button id="revPrev" '+(S.rev===1?"disabled":"")+'>← Sebelumnya</button><button id="revNext" class="pri" '+(S.rev===N?"disabled":"")+'>Berikutnya →</button></div></div></div>';}
 body+='<div class="card"><h3 style="margin-top:0">Capaian per Tujuan Pembelajaran</h3><div class="tw"><table class="t"><thead><tr><th>Kode TP</th><th>Skor</th><th class="gcol">Grafik</th><th>%</th></tr></thead><tbody>'+bar(tpMap)+'</tbody></table></div></div>'+
 '<div class="card"><h3 style="margin-top:0">Capaian per bentuk soal dan level</h3><div class="tw"><table class="t"><thead><tr><th>Kelompok</th><th>Skor</th><th class="gcol">Grafik</th><th>%</th></tr></thead><tbody>'+bar(byBentuk)+bar(byKat)+bar(byLN)+'</tbody></table></div></div>';
 app().innerHTML=body;statusKirim();
 $("btnCsv").onclick=()=>download("PSAS-"+CFG.TINGKAT+"-V"+CFG.VERSI+"_"+safe(S.ident.kelas)+"_"+safe(S.ident.absen)+"_"+safe(S.ident.nama)+"_P"+S.ke+".csv",buildCSV());
 $("btnCopy").onclick=()=>{const t=decodeURIComponent(mailtoHref().split("&body=")[1]);const done=()=>toast("Isi email disalin.");
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>modal("<p>Salin teks berikut:</p><textarea readonly>"+esc(t)+"</textarea>","Tutup"));else modal("<p>Salin teks berikut:</p><textarea readonly>"+esc(t)+"</textarea>","Tutup");};
 const lihat=n=>{S.rev=n;save();renderResult();const e=$("revbox");if(e)e.scrollIntoView({behavior:"smooth"});};
 if($("btnPemb1"))$("btnPemb1").onclick=()=>lihat(1);
 if($("revPrev"))$("revPrev").onclick=()=>lihat(S.rev-1);
 if($("revNext"))$("revNext").onclick=()=>lihat(S.rev+1);
 if($("btnBukaPemb"))$("btnBukaPemb").onclick=()=>tanya("<h3 style='margin-top:0'>Buka pembahasan sekarang?</h3><p>Kamu akan melihat kunci dan pembahasan semua soal. <b>Kesempatan mengulang latihan ini hangus</b> dan hal ini tercatat di rekap guru.</p>","Ya, buka pembahasan",bukaPembahasan);
 if($("btnNew"))$("btnNew").onclick=()=>{const belum=!S.kirim||(S.kirim.st!=="ok"&&S.kirim.st!=="nonaktif");
  tanya("<h3 style='margin-top:0'>Ulangi latihan?</h3><p>Ini akan memakai kesempatan ke-"+(S.ke+1)+" dari "+CFG.MAKS_PERCOBAAN+". Hasil ini akan hilang dari layar HP-mu.</p>"+(belum?"<p class='warn'>Hasil ini <b>belum terkirim</b> ke rekap guru. Kirim email dulu atau tekan Kirim ulang sebelum mengulang.</p>":"<p>Pastikan kamu sudah mengirim email hasil ini.</p>"),"Ya, ulangi",()=>{const id=S.ident;clearSave();S=fresh(id);renderStart();window.scrollTo(0,0);});};
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>lihat(parseInt(b.dataset.go,10)));}
function pembLewat(){return !!CFG.PEMB_TUTUP&&Date.now()>Date.parse(CFG.PEMB_TUTUP);}
function pembTerbuka(){return S.phase==="result"&&!pembLewat()&&(S.bukaPemb||S.ke>=CFG.MAKS_PERCOBAAN||sudahTutup());}
function bukaPembahasan(){
 S.bukaPemb=true;const key=siswaKey(S.ident.kelas,S.ident.absen);
 for(let i=attCount(key);i<CFG.MAKS_PERCOBAAN;i++)attAdd(key,"hangus_"+uid());
 save();jsonp({action:"pembahasan",id:S.id,kelas:S.ident.kelas,absen:S.ident.absen},15000).catch(()=>{});
 S.rev=1;save();renderResult();const e=$("revbox");if(e)e.scrollIntoView({behavior:"smooth"});}
function keyStr(it){const k=KEYS[it.no-1];
 if(it.type==="pg")return L[k];
 if(it.type==="pgk")return k.map(i=>L[i]).join(", ");
 if(it.type==="jodoh")return k.map((x,i)=>(i+1)+"–"+L[x]).join(", ");
 if(it.type==="urut")return k.map(x=>L[x]).join(" – ");
 return k.map((x,i)=>(i+1)+"–"+(x?"B":"S")).join(", ");}

/* ---------- halaman pembahasan (mode khusus) ---------- */
function renderPembahasanPage(n){
 const B=CFG.PEMB_BUKA?Date.parse(CFG.PEMB_BUKA):0, T=CFG.PEMB_TUTUP?Date.parse(CFG.PEMB_TUTUP):Infinity, now=Date.now();
 const kembali='<p style="margin:12px 0 0"><a href="index.html">← Kembali ke halaman depan</a></p>';
 const head='<header class="top"><h1>Pembahasan Latihan PSAS Ganjil – Informatika '+CFG.TINGKAT+' – Versi '+CFG.VERSI+'</h1><small>SMA Kartika XIX-1 Bandung • 2026/2027 • '+N+' soal</small></header>';
 if(now<B||now>T){
  app().innerHTML=head+'<div class="card"><h2 style="margin-top:0">'+(now<B?'Pembahasan belum dibuka':'Pembahasan sudah ditutup')+'</h2><p>Pembahasan Versi '+CFG.VERSI+' dapat dibuka mulai <b>'+tglWIB(B)+'</b>'+(isFinite(T)?' sampai <b>'+tglWIB(T)+'</b>':'')+'.</p>'+kembali+'</div>';return;}
 S.phase="pemb";ITEMS.forEach(it=>{S.ans[it.no]=JSON.parse(JSON.stringify(KEYS[it.no-1]));});
 n=Math.min(Math.max(n||1,1),N);const it=ITEMS[n-1];
 const grid='<div class="grid">'+ITEMS.map(x=>'<button class="'+(x.no===n?"cur":"")+'" data-pn="'+x.no+'">'+x.no+'</button>').join("")+'</div>';
 app().innerHTML=head+
  '<div class="card"><p style="margin-top:0">Pelajari setiap soal: jawaban yang benar sudah ditandai, lalu baca pembahasannya. Ketuk nomor untuk berpindah soal.</p>'+grid+
  (isFinite(T)?'<p class="small" style="margin-bottom:0">Pembahasan dapat dibuka sampai '+tglWIB(T)+'.</p>':'')+'</div>'+
  qcard(it,true,false,true)+
  '<div class="card"><div class="pembbox" style="margin-top:0"><div><b>Kunci:</b> '+esc(keyStr(it))+'</div><div class="pembtxt"><b>Pembahasan</b><br>'+mk(PEMB[n-1]||"–")+'</div></div>'+
  '<div class="nav"><button id="pPrev" '+(n===1?"disabled":"")+'>← Sebelumnya</button><button id="pNext" class="pri" '+(n===N?"disabled":"")+'>Berikutnya →</button></div>'+kembali+'</div>';
 const go2=k=>{renderPembahasanPage(k);window.scrollTo(0,0);try{history.replaceState(null,"","#soal-"+k);}catch(e){}};
 document.querySelectorAll("[data-pn]").forEach(b=>b.onclick=()=>go2(+b.dataset.pn));
 $("pPrev").onclick=()=>go2(n-1);$("pNext").onclick=()=>go2(n+1);}
(function init(){
 if(CFG.MODE==="guru"){guruInit();return;}
 if(CFG.MODE==="pembahasan"){const m=/soal-(\d+)/.exec(location.hash||"");renderPembahasanPage(m?+m[1]:1);return;}
 const sv=load();
 if(sv&&sv.phase==="result"){S=Object.assign(fresh(),sv);renderResult();if(!S.kirim||S.kirim.st==="gagal"||S.kirim.st==="proses"||S.kirim.st==="nonaktif")kirimRekap();return;}
 renderStart();})();
</script>
